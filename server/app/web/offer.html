<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Мастер предлагает</title>
<style>
/*
  Клиент отвечает на предложение мастера: «грыжа — замена шины 650 ₽».
  Открывается из телеграма или уведомления, без входа: ссылку получает
  только он. Три ответа, крупно — читают одной рукой, у машины или в
  очереди на кассе.
*/
:root {
  --ink: #0f172a; --ink-soft: #475569; --line: #e2e8f0; --bg: #f1f5f9;
  --card: #ffffff; --brand: #2563eb; --ok: #047857; --ok-bg: #dcfce7;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ink: #e2e8f0; --ink-soft: #94a3b8; --line: #1e293b; --bg: #0b1220;
    --card: #111a2e; --ok: #4ade80; --ok-bg: #12301f;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  font-size: 17px; line-height: 1.45;
  padding: env(safe-area-inset-top) 16px calc(env(safe-area-inset-bottom) + 24px); }
main { max-width: 520px; margin: 0 auto; }
header { padding: 20px 0 12px; }
h1 { margin: 0; font-size: 22px; }
.sub { color: var(--ink-soft); font-size: 15px; margin-top: 2px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 16px;
  padding: 16px; margin-bottom: 12px; }
.media img, .media video { display: block; width: 100%; max-height: 60vh; object-fit: contain;
  border-radius: 12px; background: #000; }
.line { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0;
  border-bottom: 1px solid var(--line); }
.line:last-child { border-bottom: 0; }
.total { font-weight: 700; font-size: 19px; }
.note { color: var(--ink-soft); font-size: 15px; margin: 8px 0 0; }
button { width: 100%; padding: 16px; font: inherit; font-size: 17px; font-weight: 600;
  border: 0; border-radius: 14px; margin-bottom: 10px; cursor: pointer; }
.yes { background: var(--brand); color: #fff; }
.call { background: var(--card); color: var(--ink); border: 1.5px solid var(--line); }
.no { background: none; color: var(--ink-soft); font-weight: 500; }
button:disabled { opacity: .55; }
.done { background: var(--ok-bg); color: var(--ok); border-radius: 14px; padding: 16px;
  font-weight: 600; text-align: center; }
.empty { text-align: center; color: var(--ink-soft); padding: 48px 0; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <header>
    <h1 id="shop">Мастер предлагает</h1>
    <div class="sub" id="who"></div>
  </header>

  <div id="view" hidden>
    <div class="card media" id="media" hidden></div>
    <div class="card">
      <div id="items"></div>
      <p class="note" id="comment" hidden></p>
    </div>
    <div id="ask">
      <button type="button" class="yes" data-answer="yes">Согласен</button>
      <button type="button" class="call" data-answer="call">Позвоните мне</button>
      <button type="button" class="no" data-answer="no">Не надо</button>
      <p class="note">Цена по прайсу. Ответ сразу увидят мастер и приёмщик.</p>
    </div>
    <div class="done" id="done" hidden></div>
  </div>
  <div class="empty" id="empty" hidden></div>
</main>
<script>
'use strict';
(function () {
  var token = location.pathname.split('/').filter(Boolean)[1] || '';
  function $(id) { return document.getElementById(id); }
  function money(value) { return String(Math.round(value)).replace(/\B(?=(\d{3})+(?!\d))/g, ' ') + ' ₽'; }
  var DONE = {
    yes: 'Спасибо! Мастер уже знает — работа добавлена в заказ.',
    call: 'Приёмщик позвонит вам в ближайшие минуты.',
    no: 'Хорошо, делать не будем. Если передумаете — скажите приёмщику.'
  };

  function draw(data) {
    if (data.color) document.documentElement.style.setProperty('--brand', data.color);
    $('shop').textContent = data.shop || 'Мастер предлагает';
    document.title = (data.shop ? data.shop + ' — ' : '') + 'мастер предлагает';
    $('who').textContent = [data.license_plate, data.author ? 'мастер ' + data.author : '']
      .filter(Boolean).join(' · ');

    if (data.media && !$('media').childNodes.length) {
      var node = document.createElement(data.media.media === 'video' ? 'video' : 'img');
      node.src = data.media.url;
      if (data.media.media === 'video') {
        node.controls = true; node.playsInline = true; node.preload = 'metadata';
      } else {
        node.alt = 'Что нашёл мастер';
      }
      $('media').appendChild(node);
      $('media').hidden = false;
    }

    var html = (data.items || []).map(function (item) {
      var row = document.createElement('div');
      row.className = 'line';
      var name = document.createElement('span'); name.textContent = item.name;
      var price = document.createElement('b'); price.textContent = money(item.price);
      row.appendChild(name); row.appendChild(price);
      return row;
    });
    $('items').innerHTML = '';
    html.forEach(function (row) { $('items').appendChild(row); });
    if ((data.items || []).length > 1) {
      var total = document.createElement('div');
      total.className = 'line total';
      total.textContent = 'Итого ' + money(data.total);
      $('items').appendChild(total);
    }
    if (data.comment) { $('comment').textContent = data.comment; $('comment').hidden = false; }

    var answered = data.state && data.state !== 'pending';
    $('ask').hidden = answered;
    $('done').hidden = !answered;
    if (answered) $('done').textContent = DONE[data.state] || data.state_title;
    $('view').hidden = false;
  }

  function fail(text) { $('empty').textContent = text; $('empty').hidden = false; $('view').hidden = true; }

  fetch('/public/offer/' + encodeURIComponent(token))
    .then(function (answer) { return answer.json().then(function (body) { return { ok: answer.ok, body: body }; }); })
    .then(function (result) { if (!result.ok) return fail(result.body.detail || 'Ссылка устарела'); draw(result.body); })
    .catch(function () { fail('Нет связи. Проверьте интернет и откройте ссылку ещё раз'); });

  [].slice.call(document.querySelectorAll('[data-answer]')).forEach(function (button) {
    button.addEventListener('click', function () {
      [].slice.call(document.querySelectorAll('[data-answer]')).forEach(function (b) { b.disabled = true; });
      fetch('/public/offer/' + encodeURIComponent(token), {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ answer: button.getAttribute('data-answer') })
      }).then(function (answer) { return answer.json(); })
        .then(draw)
        .catch(function () {
          [].slice.call(document.querySelectorAll('[data-answer]')).forEach(function (b) { b.disabled = false; });
          alert('Нет связи. Попробуйте ещё раз');
        });
    });
  });
})();
</script>
</body>
</html>
