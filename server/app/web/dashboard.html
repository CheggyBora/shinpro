<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Шиномонтаж — дашборд</title>
<style>
/*
  Дашборд смотрят с телефона в конце смены и с компьютера, когда
  разбирают месяц. Поэтому верстка начинается с узкого экрана: широкий
  из неё получается сам, а обратно — никогда.
*/
:root {
  --ink: #0f172a; --ink-soft: #475569; --muted: #94a3b8;
  --line: #e2e8f0; --bg: #f1f5f9; --card: #fff;
  --brand: #2563eb; --brand-dark: #1d4ed8;
  --ok: #059669; --bad: #dc2626; --warn: #b45309;
  --radius: 16px;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  font-size: 15px; line-height: 1.45;
  padding: 0 0 90px;
}
h1, h2, h3 { margin: 0; font-weight: 700; }
button { font-family: inherit; cursor: pointer; }

/* Атрибут hidden браузер выполняет правилом display: none, и любое
   правило display в классе его перебивает — у класса выше вес. Из-за
   этого скрытое окно .sheet оставалось растянутым на весь экран:
   прозрачная подложка ловила все нажатия, и дашборд переставал
   слушаться мыши, хотя выглядел рабочим. Ставим рядом с остальными
   основами, чтобы ловушка не вернулась с новым классом */
[hidden] { display: none !important; }

.wrap { max-width: 1100px; margin: 0 auto; padding: 0 14px; }

/* --- Шапка --- */
.top {
  background: var(--card); border-bottom: 1px solid var(--line);
  padding: 12px 0; position: sticky; top: 0; z-index: 20;
}
.top .wrap { display: flex; align-items: center; gap: 10px; }
.top h1 { font-size: 17px; }
.who { margin-left: auto; font-size: 13px; color: var(--ink-soft); text-align: right; }
.who b { display: block; color: var(--ink); font-size: 14px; }

/* --- Период --- */
.period { display: flex; gap: 6px; overflow-x: auto; padding: 12px 0 4px; }
.period::-webkit-scrollbar { display: none; }
.chip {
  flex: 0 0 auto; padding: 8px 14px; border-radius: 999px;
  border: 1.5px solid var(--line); background: var(--card);
  font-size: 14px; color: var(--ink-soft);
}
.chip[aria-pressed="true"] {
  border-color: var(--brand); background: var(--brand); color: #fff; font-weight: 600;
}
.dates { display: none; gap: 8px; padding-bottom: 6px; }
.dates.on { display: flex; }
.dates input {
  flex: 1; padding: 10px; border: 1.5px solid var(--line); border-radius: 12px;
  font-size: 15px; font-family: inherit; color: var(--ink); background: var(--card);
}

/* --- Карточки --- */
.card {
  background: var(--card); border-radius: var(--radius); padding: 16px;
  margin-bottom: 12px; box-shadow: 0 1px 2px rgba(15,23,42,.05);
}
.card h2 { font-size: 15px; margin-bottom: 12px; }

.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tile { background: var(--card); border-radius: var(--radius); padding: 14px; }
.tile span { display: block; font-size: 12.5px; color: var(--ink-soft); margin-bottom: 4px; }
.tile b { font-size: 21px; font-weight: 700; letter-spacing: -.3px; }
.tile.wide { grid-column: 1 / -1; }
.tile b.ok { color: var(--ok); }
.tile b.bad { color: var(--bad); }

/* --- График по дням --- */
.bars { display: flex; align-items: flex-end; gap: 3px; height: 120px; margin-top: 6px; }
.bar { flex: 1; background: var(--brand); border-radius: 4px 4px 0 0; min-height: 2px; opacity: .85; }
.bar.zero { background: var(--line); }
.bar-labels { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); margin-top: 6px; }

/* --- Списки --- */
.row {
  display: flex; align-items: center; gap: 10px; padding: 11px 0;
  border-bottom: 1px solid var(--line); text-align: left;
  width: 100%; background: none; border-left: 0; border-right: 0; border-top: 0;
  font-size: 15px; color: var(--ink);
}
.row:last-child { border-bottom: 0; }
.row .main { flex: 1; min-width: 0; }
.row .main b { display: block; font-weight: 600; }
.row .main span { font-size: 12.5px; color: var(--ink-soft); display: block;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .money { font-weight: 700; white-space: nowrap; }
.row .money small { display: block; font-weight: 400; font-size: 11.5px;
  color: var(--ink-soft); text-align: right; }

.sub { padding: 7px 0 7px 14px; border-bottom: 1px solid var(--line);
  display: flex; gap: 10px; font-size: 13.5px; color: var(--ink-soft); }
.sub .num { width: 62px; color: var(--muted); }
.sub .plate { flex: 1; }
.sub .money { font-weight: 600; color: var(--ink); }

.tag { display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 7px;
  border-radius: 6px; background: var(--bg); color: var(--ink-soft); margin-left: 6px; }
.tag.bad { background: #fee2e2; color: var(--bad); }
.tag.warn { background: #fef3c7; color: var(--warn); }
.tag.ok { background: #d1fae5; color: var(--ok); }

.hint {
  margin: 10px 2px 0; font-size: 13px; color: var(--ink-soft); line-height: 1.5;
}
.empty { text-align: center; color: var(--muted); padding: 24px 10px; font-size: 14px; }
.error { background: #fee2e2; color: #991b1b; border-radius: 12px;
  padding: 11px 13px; font-size: 14px; margin-bottom: 12px; }

/* --- Низ: разделы --- */
.tabs {
  position: fixed; bottom: 0; left: 0; right: 0; background: var(--card);
  border-top: 1px solid var(--line); display: flex; z-index: 30;
  padding-bottom: env(safe-area-inset-bottom);
}
.tabs button {
  flex: 1; border: 0; background: none; padding: 10px 2px 12px;
  font-size: 11.5px; color: var(--muted); display: flex; flex-direction: column;
  align-items: center; gap: 3px;
}
.tabs button[aria-pressed="true"] { color: var(--brand); font-weight: 700; }
.tabs svg { width: 21px; height: 21px; stroke: currentColor; fill: none;
  stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* --- Вход --- */
.login { max-width: 380px; margin: 40px auto; padding: 0 14px; }
.login .card { padding: 22px; }
.login h2 { font-size: 19px; margin-bottom: 6px; }
.login p { margin: 0 0 18px; font-size: 13.5px; color: var(--ink-soft); }
.field { margin-bottom: 14px; }
.field label { display: block; font-size: 13px; color: var(--ink-soft); margin-bottom: 5px; }
.field input {
  width: 100%; padding: 13px 14px; border: 1.5px solid var(--line);
  border-radius: 12px; font-size: 17px; font-family: inherit; color: var(--ink);
}
.field input:focus { outline: none; border-color: var(--brand); }
input.code { letter-spacing: 8px; text-align: center; font-size: 22px; font-weight: 700; }
.go {
  width: 100%; padding: 14px; border: 0; border-radius: 12px;
  background: var(--brand); color: #fff; font-size: 16px; font-weight: 600;
}
.go:disabled { background: var(--muted); }
.link { background: none; border: 0; color: var(--brand); font-size: 13.5px;
  padding: 10px 0 0; width: 100%; }

/* --- Окно наряда --- */
.sheet {
  position: fixed; inset: 0; background: rgba(15,23,42,.45); z-index: 40;
  display: flex; align-items: flex-end; justify-content: center;
}
.sheet .inner {
  background: var(--card); border-radius: 20px 20px 0 0; width: 100%;
  max-width: 560px; max-height: 88vh; overflow-y: auto; padding: 18px 16px 28px;
}
.sheet h2 { font-size: 17px; margin-bottom: 4px; }
.sheet .when { color: var(--ink-soft); font-size: 13px; margin-bottom: 14px; }
.line { display: flex; justify-content: space-between; gap: 12px; padding: 7px 0;
  font-size: 14px; border-bottom: 1px solid var(--line); }
.line span { color: var(--ink-soft); }
.line b { font-weight: 600; white-space: nowrap; }
/* Адреса длинные — на телефоне переносятся, а не уезжают за край */
.line b.url { white-space: normal; word-break: break-all; text-align: right; }
.line.total b { font-size: 17px; }
.block-title { font-size: 12.5px; color: var(--muted); text-transform: uppercase;
  letter-spacing: .04em; margin: 16px 0 4px; }

/* --- Часы записи: подпись над полем, два поля в строку --- */
.clock { display: flex; gap: 18px; flex-wrap: wrap; margin: 4px 0 2px; }
.clock label { display: block; font-size: 13px; color: var(--ink-soft);
  margin-bottom: 5px; }
.clock input {
  padding: 10px 12px; border: 1.5px solid var(--line); border-radius: 12px;
  font-size: 16px; font-family: inherit; color: var(--ink);
  background: var(--card);
}
.clock input:focus { outline: none; border-color: var(--brand); }

/* --- Форма сотрудника --- */
.form label { display: block; font-size: 13px; color: var(--ink-soft); margin: 14px 0 5px; }
.form input[type="text"], .form input[type="tel"], .form input[type="number"], .form select {
  width: 100%; padding: 12px 13px; border: 1.5px solid var(--line);
  border-radius: 12px; font-size: 16px; font-family: inherit;
  color: var(--ink); background: var(--card);
}
.form input:focus, .form select:focus { outline: none; border-color: var(--brand); }
.form .note { font-size: 12.5px; color: var(--ink-soft); margin: 5px 0 0; }
.perm { display: flex; align-items: center; gap: 10px; padding: 9px 0;
  border-bottom: 1px solid var(--line); font-size: 14.5px; }
.perm:last-child { border-bottom: 0; }
.perm input { width: 20px; height: 20px; accent-color: var(--brand); flex: 0 0 auto; }
.danger { background: none; border: 1.5px solid var(--line); color: var(--bad);
  width: 100%; padding: 12px; border-radius: 12px; font-size: 15px; margin-top: 10px; }

/* --- Календарь задач ---
   Цвет раздела один и тот же везде: в цеху, в ленте над нарядами и
   здесь. По нему задачу узнают раньше, чем прочтут */
:root {
  --work: #2563eb; --work-bg: #dbeafe;
  --storage: #0f766e; --storage-bg: #ccfbf1;
  --tires: #c2410c; --tires-bg: #ffedd5;
  --paint: #7c3aed; --paint-bg: #ede9fe;
  /* Поставки мойки — янтарь: рядом с оранжевыми «Шинами» не
     встречаются (у мойки их нет), но и спутать их не должно */
  --supply: #b45309; --supply-bg: #fef3c7;
}
/* Метка направления у задачи: синяя — шиномонтаж, бирюзовая — мойка.
   Видна, только когда точка работает и мойкой */
.dir { display: inline-block; font-size: 10.5px; font-weight: 700; letter-spacing: .02em;
  padding: 2px 6px; border-radius: 6px; white-space: nowrap; }
.dir.tire { background: #dbeafe; color: #1d4ed8; }
.dir.wash { background: #ccfbf1; color: #0f766e; }
/* Строки фильтров под неделей: «Направление» и «Разделы». На узком
   экране кнопки переносятся, а не уезжают за край */
.cal-filter { display: flex; gap: 5px; flex-wrap: wrap; align-items: center;
  padding: 10px 0 0; }
.cal-filter .lab { font-size: 13px; color: var(--ink-soft); margin-right: 1px; }
.cal-filter .chip { padding: 6px 10px; font-size: 13.5px; }
.cal-head { display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
  margin-bottom: 10px; }
.cal-head h2 { margin: 0 auto 0 0; font-size: 15px; }
.cal-head .chip { padding: 7px 12px; }
.cal-add { border: 0; background: var(--brand); color: #fff; font-weight: 600;
  padding: 8px 14px; border-radius: 999px; font-size: 14px; }
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.week button {
  border: 1.5px solid var(--line); background: var(--card); border-radius: 12px;
  padding: 6px 0 5px; display: flex; flex-direction: column; align-items: center;
  font-size: 11.5px; color: var(--ink-soft); min-width: 0;
}
.week button b { font-size: 16px; color: var(--ink); line-height: 1.2; }
.week button.today b { color: var(--brand); }
.week button[aria-pressed="true"] { border-color: var(--brand); background: #eff6ff; }
.week .dots { display: flex; gap: 2px; height: 6px; margin-top: 3px; }
.week .dots i { width: 6px; height: 6px; border-radius: 50%; display: block; }
.week .dots i.late { background: var(--bad); }
.dot-work { background: var(--work); } .dot-storage { background: var(--storage); }
.dot-tires { background: var(--tires); } .dot-paint { background: var(--paint); }
.dot-supply { background: var(--supply); }
.cat { display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 7px;
  border-radius: 6px; white-space: nowrap; }
.cat.work { background: var(--work-bg); color: var(--work); }
.cat.storage { background: var(--storage-bg); color: var(--storage); }
.cat.tires { background: var(--tires-bg); color: var(--tires); }
.cat.paint { background: var(--paint-bg); color: var(--paint); }
.cat.supply { background: var(--supply-bg); color: var(--supply); }
.chip.f-work[aria-pressed="true"] { background: var(--work); border-color: var(--work); }
.chip.f-storage[aria-pressed="true"] { background: var(--storage); border-color: var(--storage); }
.chip.f-tires[aria-pressed="true"] { background: var(--tires); border-color: var(--tires); }
.chip.f-paint[aria-pressed="true"] { background: var(--paint); border-color: var(--paint); }
.chip.f-supply[aria-pressed="true"] { background: var(--supply); border-color: var(--supply); }
.day-title { font-size: 14px; font-weight: 700; margin: 4px 0 2px; }
/* Месяц / Неделя / День (решение владельца 29.10.2026) */
.views { display: inline-flex; border: 1.5px solid var(--line); border-radius: 999px;
  overflow: hidden; margin-right: 6px; }
.views button { border: 0; background: var(--card); padding: 7px 13px; font-size: 13.5px;
  color: var(--ink-soft); font-family: inherit; }
.views button[aria-pressed="true"] { background: var(--brand); color: #fff; font-weight: 600; }
.cal-add.ghost { background: var(--card); color: var(--ink); border: 1.5px solid var(--line); }
.cal-nav { display: inline-flex; gap: 6px; }
/* На телефоне заголовок — своей строкой, кнопки — под ним */
@media (max-width: 700px) { .cal-head h2 { flex-basis: 100%; } }
.cal-split { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 12px;
  align-items: start; }
.cal-split > .card { margin: 0; }
@media (max-width: 900px) { .cal-split { grid-template-columns: minmax(0, 1fr); } }
.month { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 3px; }
.month .wd { font-size: 11.5px; color: var(--ink-soft); padding: 0 4px 2px; }
.month .cell { border: 1.5px solid var(--line); background: var(--card); border-radius: 10px;
  min-height: 96px; padding: 4px; display: flex; flex-direction: column; gap: 2px;
  text-align: left; min-width: 0; font-family: inherit; cursor: pointer; }
.month .cell b { font-size: 12.5px; font-weight: 600; color: var(--ink-soft); padding-left: 2px; }
.month .cell.today b { color: var(--brand); }
.month .cell.other b { color: var(--muted); font-weight: 400; }
.month .cell[aria-pressed="true"] { border-color: var(--brand); background: #eff6ff; }
.month .more { font-size: 11px; color: var(--ink-soft); padding-left: 2px; }
.month .dots { display: none; gap: 2px; height: 6px; padding-left: 2px; }
.month .dots i { width: 6px; height: 6px; border-radius: 50%; display: block; }
.it { display: block; font-size: 11.5px; padding: 1px 4px; border-radius: 4px; white-space: nowrap;
  overflow: hidden; text-overflow: ellipsis; text-align: left; border: 0; font-family: inherit;
  max-width: 100%; }
.it.c-work, .blk.c-work { background: var(--work-bg); color: var(--work); }
.it.c-storage, .blk.c-storage { background: var(--storage-bg); color: var(--storage); }
.it.c-tires, .blk.c-tires { background: var(--tires-bg); color: var(--tires); }
.it.c-paint, .blk.c-paint { background: var(--paint-bg); color: var(--paint); }
.it.c-supply, .blk.c-supply { background: var(--supply-bg); color: var(--supply); }
.it.note, .blk.note { background: #f1f5f9; color: #475569; font-style: italic; }
.it.done, .blk.done { background: #f8fafc; color: var(--muted); text-decoration: line-through; }
.it.late, .blk.late { background: #fee2e2; color: var(--bad); }
.dot-note { background: #94a3b8; } .dot-done { background: #cbd5e1; }
.month .dots i.late { background: var(--bad); }
@media (max-width: 700px) {
  .month .cell { min-height: 54px; }
  .month .cell .it, .month .more { display: none; }
  .month .dots { display: flex; }
}
/* Неделя и день по часам: слева часы, сверху «без времени» */
.thead, .tband, .tgrid { display: flex; }
.tcol0 { width: 48px; flex: 0 0 48px; font-size: 11px; color: var(--ink-soft);
  text-align: right; padding-right: 6px; position: relative; }
.thead .th { flex: 1; min-width: 0; border: 0; background: none; font-family: inherit;
  font-size: 13px; color: var(--ink-soft); padding: 2px 0 6px; cursor: pointer; }
.thead .th.today { color: var(--brand); font-weight: 700; }
.tband { margin-bottom: 4px; }
.tband .tb { flex: 1; min-width: 0; border: 1px solid var(--line); min-height: 24px;
  padding: 2px; display: flex; flex-direction: column; gap: 2px; }
.tband .it { cursor: pointer; }
.tgrid .tcol0 span { position: absolute; right: 6px; transform: translateY(-1px); }
.tdays { flex: 1; display: flex; min-width: 0; border-top: 1px solid var(--line); }
.tday { flex: 1; min-width: 0; position: relative; border-left: 1px solid var(--line);
  background-image: linear-gradient(to bottom, var(--line) 1px, transparent 1px); }
.tday:last-child { border-right: 1px solid var(--line); }
.tday.today { background-color: #f8fbff; }
.blk { position: absolute; border: 0; border-left: 3px solid currentColor; border-radius: 4px;
  padding: 2px 5px; font-size: 12px; text-align: left; overflow: hidden; font-family: inherit;
  line-height: 1.25; cursor: pointer; }
.blk b { font-weight: 600; }
.blk small { display: block; text-decoration: underline; }
.nowline { position: absolute; left: 0; right: 0; height: 2px; background: var(--bad);
  pointer-events: none; }
.nowline::before { content: ''; position: absolute; left: -4px; top: -3px; width: 8px;
  height: 8px; border-radius: 50%; background: var(--bad); }
.task.note { background: #f8fafc; }
.task.note .tt b { font-weight: 400; font-style: italic; }
.cat.note { background: #e2e8f0; color: #475569; }
.task .tm small { display: block; font-weight: 400; font-size: 12px; }
.chip.f-note[aria-pressed="true"] { background: #475569; border-color: #475569; }
.task { display: flex; align-items: flex-start; gap: 8px;
  border-bottom: 1px solid var(--line); padding: 2px 0; }
.task:last-child { border-bottom: 0; }
.task .open { flex: 1; min-width: 0; display: flex; gap: 8px; align-items: flex-start;
  background: none; border: 0; padding: 9px 0; text-align: left; color: var(--ink);
  font-size: 14.5px; }
.task .tm { width: 42px; flex: 0 0 auto; font-weight: 600; color: var(--ink-soft);
  font-variant-numeric: tabular-nums; }
.task .tt { flex: 1; min-width: 0; }
.task .tt b { font-weight: 600; display: block; overflow-wrap: anywhere; }
.task .tt span { display: block; font-size: 12.5px; color: var(--ink-soft);
  overflow-wrap: anywhere; }
.task .tt .cat { display: inline-block; margin: 0 0 2px; }
/* Перебиваем «.task .tt span» — у него вес больше, чем у «.dir» */
.task .tt .dir { display: inline-block; margin: 0 4px 2px 0; font-size: 10.5px; }
.task .tt .dir.tire { color: #1d4ed8; } .task .tt .dir.wash { color: #0f766e; }
.task input[type="checkbox"] { width: 22px; height: 22px; margin: 10px 2px 0;
  accent-color: var(--ok); flex: 0 0 auto; }
.task.late { background: #fef2f2; border-left: 3px solid var(--bad);
  padding-left: 6px; border-radius: 6px; }
.task.late .tm { color: var(--bad); }
.task.done .tt b { text-decoration: line-through; color: var(--muted); }
.task.done .tm { color: var(--muted); }
.segs { display: flex; gap: 6px; flex-wrap: wrap; }
.segs .chip { padding: 8px 12px; }
.moves { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.moves button { border: 1.5px solid var(--line); background: var(--card);
  border-radius: 10px; padding: 8px 11px; font-size: 14px; color: var(--ink); }
.moves input { padding: 7px 9px; border: 1.5px solid var(--line); border-radius: 10px;
  font-size: 14px; font-family: inherit; color: var(--ink); background: var(--card); }
.two { display: flex; gap: 10px; }
.two > div { flex: 1; min-width: 0; }
.confirm { background: #fef2f2; border-radius: 12px; padding: 12px; margin-top: 10px;
  font-size: 14px; }
.confirm .moves { margin-top: 8px; }
.confirm .yes { background: var(--bad); color: #fff; border-color: var(--bad); }
.form textarea { width: 100%; padding: 12px 13px; border: 1.5px solid var(--line);
  border-radius: 12px; font-size: 16px; font-family: inherit; color: var(--ink);
  background: var(--card); min-height: 70px; resize: vertical; }
.form input[type="date"], .form input[type="time"] {
  width: 100%; padding: 11px 12px; border: 1.5px solid var(--line);
  border-radius: 12px; font-size: 16px; font-family: inherit; color: var(--ink);
  background: var(--card); }
.form textarea:focus { outline: none; border-color: var(--brand); }

/* --- Склад ---
   Те же цвета, что в цеху: в минусе — красным, мало — жёлтым. Строка
   целиком, а не одна цифра: с телефона её видно, не вчитываясь */
.stock-when { font-size: 12.5px; color: var(--ink-soft); white-space: nowrap; }
.stock-sum { display: flex; gap: 6px; flex-wrap: wrap; margin: 10px 0 4px; }
.srow { display: flex; align-items: flex-start; gap: 10px; padding: 9px 10px;
  border: 1px solid var(--line); border-radius: 10px; margin-top: 6px; }
.srow.neg { background: #fee2e2; border-color: #fecaca; }
.srow.low { background: #fef3c7; border-color: #fde68a; }
.srow .main { flex: 1; min-width: 0; }
.srow .main b { display: block; font-weight: 600; overflow-wrap: anywhere; }
.srow .meta { display: flex; flex-wrap: wrap; gap: 3px 6px; align-items: center;
  font-size: 12.5px; color: var(--ink-soft); margin-top: 2px; }
.srow .qty { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
.srow .qty b { display: block; font-size: 16px; }
.srow.neg .qty b { color: var(--bad); }
.srow.low .qty b { color: var(--warn); }
.srow .qty small { display: block; font-size: 11.5px; color: var(--ink-soft); }
.kind { display: inline-block; font-size: 10.5px; font-weight: 700; padding: 2px 6px;
  border-radius: 6px; white-space: nowrap; }
.kind.goods { background: #dcfce7; color: #166534; }
.kind.material { background: #e0e7ff; color: #3730a3; }

/* --- Обложка наряда (docs/order_photo.md, вариант Г) ---
   Снимок машины с телефона: маленький в списке нарядов, крупный в
   карточке. Владелец видит не только сумму, но и какую машину сделали */
.cover-sm { width: 56px; height: 42px; object-fit: cover; border-radius: 6px;
  flex: 0 0 auto; background: var(--line); display: block; }
.cover-lg { display: block; width: 100%; max-height: 260px; object-fit: cover;
  border-radius: 12px; background: var(--line); margin: 4px 0 6px; }
.cover-link { display: block; }

/* --- Касса ---
   Чип ордера: приходный — зелёный, расходный — красный, безнал — серый
   (касса от него не меняется). Расхождение при пересчёте — строка
   целиком: недостача красная, излишек жёлтый, как остатки склада */
.cash-now .tile { background: var(--bg); }
.cash-now .tile b { font-size: 24px; }
.cash-now .tile small { display: block; font-size: 12px; color: var(--ink-soft);
  margin-top: 2px; }
.cash-now .tile.off b { color: var(--muted); font-size: 17px; }
.co { display: flex; align-items: flex-start; gap: 10px; padding: 10px 0;
  border-bottom: 1px solid var(--line); }
.co:last-child { border-bottom: 0; }
.co .main { flex: 1; min-width: 0; }
.co .main b { font-weight: 600; overflow-wrap: anywhere; }
.co .meta { font-size: 12.5px; color: var(--ink-soft); overflow-wrap: anywhere; }
.co .sum { font-weight: 700; white-space: nowrap; font-variant-numeric: tabular-nums; }
.co .sum.plus { color: var(--ok); } .co .sum.minus { color: var(--bad); }
.co.noncash .sum { color: var(--muted); font-weight: 600; }
.co.gone .main b, .co.gone .sum { text-decoration: line-through; color: var(--muted); }
.ord { display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 7px;
  border-radius: 6px; white-space: nowrap; margin: 0 6px 3px 0; vertical-align: 1px; }
.ord.in { background: #d1fae5; color: var(--ok); }
.ord.out { background: #fee2e2; color: var(--bad); }
.ord.noncash { background: var(--bg); color: var(--ink-soft); }
.cat-line { display: flex; justify-content: space-between; gap: 12px; padding: 6px 0;
  font-size: 14px; border-bottom: 1px solid var(--line); }
.cat-line:last-child { border-bottom: 0; }
.cat-line span { color: var(--ink-soft); overflow-wrap: anywhere; min-width: 0; }
.cat-line b { white-space: nowrap; font-variant-numeric: tabular-nums; }
.cat-line b.in { color: var(--ok); } .cat-line b.out { color: var(--bad); }
.cat-line.noncash b { color: var(--muted); }
.cshift { padding: 9px 10px; border: 1px solid var(--line); border-radius: 10px;
  margin-top: 6px; display: flex; gap: 10px; align-items: flex-start; }
.cshift.short { background: #fee2e2; border-color: #fecaca; }
.cshift.over { background: #fef3c7; border-color: #fde68a; }
.cshift .main { flex: 1; min-width: 0; }
.cshift .main b { display: block; font-weight: 600; }
.cshift .meta { font-size: 12.5px; color: var(--ink-soft); overflow-wrap: anywhere; }
.cshift .diff { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
.cshift .diff b { display: block; font-size: 16px; }
.cshift.short .diff b { color: var(--bad); } .cshift.over .diff b { color: var(--warn); }
.cshift .diff small { display: block; font-size: 11.5px; color: var(--ink-soft); }

/* --- Шиномонтаж | Мойка ---
   Переключатель над цифрами (docs/wash_dashboard.md). Виден, только
   когда у выбранной точки есть мойка. На телефоне — во всю ширину,
   по половине на направление: попасть пальцем легче, чем в чип */
.dir-switch { padding: 12px 0 0; }
.dir-switch .seg-in { display: flex; gap: 3px; padding: 3px; width: 100%;
  border: 1.5px solid var(--line); border-radius: 12px; background: var(--card); }
.dir-switch button { flex: 1 1 0; min-width: 0; border: 0; background: none;
  border-radius: 9px; padding: 8px 10px; font-size: 14.5px; color: var(--ink-soft); }
.dir-switch button[aria-pressed="true"] { background: var(--brand); color: #fff;
  font-weight: 600; }
.dir-switch button[data-dir="wash"][aria-pressed="true"] { background: #0f766e; }
/* Метки в строке списка — в одну строку с номером машины. Правило
   «.row .main span» делает span блоком, и без этого каждая метка
   вставала отдельной полосой */
.row .main b .dir, .row .main b .tag { display: inline-block; white-space: nowrap;
  overflow: visible; }
.row .main b .dir { margin-left: 6px; vertical-align: 1px; font-size: 10.5px;
  color: inherit; }
.row .main b .dir.tire { color: #1d4ed8; } .row .main b .dir.wash { color: #0f766e; }
.line .dir { margin-right: 6px; vertical-align: 1px; }

/* Разделов стало больше, чем помещается в ширину телефона: полоса
   прокручивается, а не сжимает подписи до нечитаемых */
@media (max-width: 759px) {
  .tabs { overflow-x: auto; }
  .tabs::-webkit-scrollbar { display: none; }
  .tabs button { flex: 1 0 auto; min-width: 62px; }
}

@media (min-width: 760px) {
  body { padding-bottom: 20px; }
  .tiles { grid-template-columns: repeat(4, 1fr); }
  .tabs { position: static; border-top: 0; border-bottom: 1px solid var(--line);
    background: none; margin-bottom: 12px; }
  .tabs button { flex: 0 0 auto; flex-direction: row; padding: 10px 16px; font-size: 14px; }
  .dir-switch .seg-in { display: inline-flex; width: auto; }
  .dir-switch button { flex: 0 0 auto; min-width: 150px; }
  .sheet { align-items: center; }
  .sheet .inner { border-radius: 20px; max-height: 80vh; }
}
</style>

<body>

<!-- ВХОД -->
<div class="login" id="screenLogin">
  <div class="card">
    <h2 id="loginTitle">Дашборд</h2>
    <p id="loginHint">Введите телефон, по которому вас завёл владелец.</p>

    <div id="stepPhone">
      <div class="field">
        <label for="lPhone">Телефон</label>

      </div>
      <button class="go" id="lPinGo" type="button" disabled>Войти</button>
      <button class="link" id="lForgot" type="button">Забыли ПИН?</button>
    </div>

    <div id="stepCode" hidden>
      <div class="field">
        <label for="lCode">Код из сообщения</label>
        <input id="lCode" class="code" inputmode="numeric" maxlength="4" autocomplete="one-time-code">

    </div>

    <div id="stepCall" hidden>
      <p class="note">Позвоните на этот номер. Отвечать не надо — вызов
        сбросится сам, и номер подтвердится.</p>
      <a class="go" id="lDial" href="tel:" style="display:block;text-align:center;
         text-decoration:none">Позвонить</a>
      <p class="note" id="callState">Ждём звонка…</p>
      <button class="link" id="lCallCode" type="button">Лучше кодом из SMS</button>
    </div>

    <div id="stepNewPin" hidden>
      <div class="field">
        <label for="lNewPin">Придумайте ПИН из четырёх цифр</label>
        <input id="lNewPin" class="code" inputmode="numeric" maxlength="4" autocomplete="off">
      </div>
      <button class="go" id="lNewPinGo" type="button" disabled>Сохранить</button>
    </div>

    <div class="error" id="loginError" hidden></div>
  </div>
</div>

<!-- ДАШБОРД -->
<div id="screenMain" hidden>
  <div class="top">
    <div class="wrap">
      <h1 id="shopName">Шиномонтаж</h1>
      <div class="who">
        <b id="whoName"></b>
        <a class="link" href="/d/plates" style="width:auto;padding:0;margin-right:12px">Проверка номеров</a>
        <button class="link" id="logout" type="button" style="width:auto;padding:0">Выйти</button>
      </div>
    </div>
  </div>

  <div class="wrap">
    <div class="period" id="shops" hidden></div>
    <div class="dir-switch" id="dirSwitch" hidden></div>
    <div class="period" id="period"></div>
    <div class="dates" id="dates">
      <input id="dFrom" type="date"><input id="dTo" type="date">
    </div>

    <div class="tabs" id="tabs"></div>
    <div class="error" id="mainError" hidden></div>
    <div id="view"></div>
  </div>
</div>

<div class="sheet" id="sheet" hidden><div class="inner" id="sheetBody"></div></div>

<script>
'use strict';

var $ = function (id) { return document.getElementById(id); };
var token = null;
var me = null;
// Видит ли вошедший «Заказчиков» — владелец сервера (/platform/me)
var platformOn = false;
var period = { key: '30', from: null, to: null };
var shops = [];          // точки этого аккаунта
var currentShop = '';    // пусто — считаем по всем сразу
var section = null;

// ------------------------------------------------------------------
// Мелочи
// ------------------------------------------------------------------

function money(value) {
  var number = Math.round(Number(value) || 0);
  return number.toLocaleString('ru-RU') + ' ₽';
}

function plural(count, one, few, many) {
  var n = Math.abs(count) % 100, n1 = n % 10;
  if (n > 10 && n < 20) return many;
  if (n1 > 1 && n1 < 5) return few;
  if (n1 === 1) return one;
  return many;
}

function dayText(iso) {
  var date = new Date(iso);
  return date.toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit' });
}

function timeText(iso) {
  var date = new Date(iso);
  return date.toLocaleString('ru-RU', {
    day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
}

function escape(text) {
  return String(text == null ? '' : text)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function fixPhone(text) {
  var digits = (text || '').replace(/\D/g, '');
  if (!digits) return '';
  if (digits[0] === '8') digits = '7' + digits.slice(1);
  if (digits[0] !== '7') digits = '7' + digits;
  digits = digits.slice(0, 11);
  var out = '+7';
  if (digits.length > 1) out += ' ' + digits.slice(1, 4);
  if (digits.length > 4) out += ' ' + digits.slice(4, 7);
  if (digits.length > 7) out += '-' + digits.slice(7, 9);
  if (digits.length > 9) out += '-' + digits.slice(9, 11);
  return out;
}

function api(path, options) {
  options = options || {};
  options.headers = options.headers || {};
  options.headers['Content-Type'] = 'application/json';
  if (token) options.headers['Authorization'] = 'Bearer ' + token;
  if (options.body && typeof options.body !== 'string') {
    options.body = JSON.stringify(options.body);
  }

  return fetch(path, options).then(function (answer) {
    return answer.json().catch(function () { return {}; }).then(function (data) {
      if (answer.ok) return data;

      // Права изменились или вход устарел — не делаем вид, что всё в
      // порядке, а честно возвращаем человека на вход
      if (answer.status === 401 && token) {
        forget();
        throw new Error(data.detail || 'Войдите заново');
      }

      var detail = data.detail;
      if (detail && typeof detail === 'object') detail = detail.detail;
      throw new Error(detail || 'Не получилось. Попробуйте ещё раз');
    });
  });
}

// ------------------------------------------------------------------
// Вход
// ------------------------------------------------------------------

var phoneDigits = '';

$('lPhone').addEventListener('input', function (event) {
  event.target.value = fixPhone(event.target.value);
  phoneDigits = event.target.value.replace(/\D/g, '');
  $('lNext').disabled = phoneDigits.length !== 11;
});

$('lPhone').addEventListener('focus', function (event) {
  if (!event.target.value) event.target.value = '+7 ';
});

['lPin', 'lCode', 'lNewPin'].forEach(function (id) {
  $(id).addEventListener('input', function (event) {
    event.target.value = event.target.value.replace(/\D/g, '');
    if (id === 'lPin') $('lPinGo').disabled = event.target.value.length !== 4;
    if (id === 'lNewPin') $('lNewPinGo').disabled = event.target.value.length !== 4;
    if (event.target.value.length === 4) {
      if (id === 'lPin') $('lPinGo').click();
      if (id === 'lCode') $('lCodeGo').click();
    }
  });
});

function loginStep(name) {
  ['stepPhone', 'stepPin', 'stepCode', 'stepCall',
   'stepNewPin'].forEach(function (id) {
    $(id).hidden = id !== name;
  });
  $('loginError').hidden = true;
}

function loginError(text) {
  $('loginError').textContent = text;
  $('loginError').hidden = false;
}

$('lNext').addEventListener('click', function () {
  api('/staff/start', { method: 'POST', body: { phone: phoneDigits } })
    .then(function (answer) {
      if (answer.step === 'pin') {
        loginStep('stepPin');
        $('lPin').focus();
      } else if (answer.call_available) {
        // Звонок быстрее кода и дешевле: нечего ждать и перепутать
        startCall();
      } else {
        loginStep('stepCode');
        sendCode();
      }
    })
    .catch(function (e) { loginError(e.message); });
});

var call = { ticket: null, until: 0 };

function startCall() {
  loginStep('stepCall');
  $('callState').textContent = 'Берём номер…';
  $('lDial').removeAttribute('href');

  api('/staff/call', { method: 'POST', body: { phone: phoneDigits } })
    .then(function (answer) {
      call.ticket = answer.ticket;
      call.until = Date.now() + answer.seconds * 1000;

      $('lDial').href = 'tel:' + answer.dial.replace(/[^+\d]/g, '');
      $('lDial').textContent = 'Позвонить на ' + answer.dial;
      $('callState').textContent = 'Ждём звонка…';
      pollCall();
    })
    .catch(function (e) {
      // Сервис звонков не ответил — не тупик: показываем код
      loginStep('stepCode');
      sendCode();
      loginError(e.message);
    });
}

function pollCall() {
  if (!call.ticket) return;

  if (Date.now() > call.until) {
    $('callState').textContent = 'Время вышло. Начните вход заново.';
    call.ticket = null;
    return;
  }

  fetch('/staff/call/check', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ phone: phoneDigits, ticket: call.ticket })
  }).then(function (answer) {
    if (!call.ticket) return;

    // 202 — ждём дальше. Это не ошибка, и показывать её нельзя
    if (answer.status === 202) { setTimeout(pollCall, 2000); return; }

    return answer.json().catch(function () { return {}; }).then(function (data) {
      if (!answer.ok) {
        $('callState').textContent = data.detail || 'Не получилось';
        call.ticket = null;
        return;
      }

      call.ticket = null;
      token = data.token;
      me = data.staff;

      if (me.pin_is_set) {
        start();
      } else {
        loginStep('stepNewPin');
        $('lNewPin').focus();
      }
    });
  }).catch(function () {
    // Связь моргнула — пробуем снова, срок всё равно ограничен
    setTimeout(pollCall, 3000);
  });
}

$('lCallCode').addEventListener('click', function () {
  call.ticket = null;
  loginStep('stepCode');
  sendCode();
});

function sendCode() {
  $('lCodeGo').textContent = 'Отправляем…';
  api('/staff/code', { method: 'POST', body: { phone: phoneDigits } })
    .then(function () {
      $('lCodeGo').textContent = 'Войти';
      $('lCode').focus();
    })
    .catch(function (e) {
      $('lCodeGo').textContent = 'Выслать код снова';
      loginError(e.message);
    });
}

$('lCodeGo').addEventListener('click', function () {
  var code = $('lCode').value;
  if (code.length !== 4) { sendCode(); return; }

  api('/staff/verify', { method: 'POST', body: { phone: phoneDigits, code: code } })
    .then(function (answer) {
      token = answer.token;
      me = answer.staff;
      if (me.pin_is_set) { start(); return; }
      loginStep('stepNewPin');
      $('lNewPin').focus();
    })
    .catch(function (e) { $('lCode').value = ''; loginError(e.message); });
});

$('lPinGo').addEventListener('click', function () {
  api('/staff/login', { method: 'POST',
                        body: { phone: phoneDigits, pin: $('lPin').value } })
    .then(function (answer) {
      token = answer.token;
      me = answer.staff;
      start();
    })
    .catch(function (e) { $('lPin').value = ''; $('lPinGo').disabled = true;
                          loginError(e.message); });
});

$('lNewPinGo').addEventListener('click', function () {
  api('/staff/pin', { method: 'POST', body: { pin: $('lNewPin').value } })
    .then(function (answer) {
      token = answer.token;
      me = answer.staff;
      start();
    })
    .catch(function (e) { $('lNewPin').value = ''; loginError(e.message); });
});

$('lForgot').addEventListener('click', function () {
  loginStep('stepCode');
  sendCode();
});

$('logout').addEventListener('click', function () { forget(); });

function forget() {
  token = null;
  me = null;
  platformOn = false;
  shownCode = null;
  try { localStorage.removeItem('staffToken'); } catch (e) {}
  $('screenMain').hidden = true;
  $('screenLogin').hidden = false;
  loginStep('stepPhone');
  $('lPin').value = '';
  $('lCode').value = '';
}

function remember() {
  try { localStorage.setItem('staffToken', token); } catch (e) {}
}

// ------------------------------------------------------------------
// Разделы
// ------------------------------------------------------------------

var ICONS = {
  summary: '<path d="M3 3v18h18"/><path d="M7 15l4-5 3 3 5-7"/>',
  services: '<path d="M4 6h16M4 12h16M4 18h10"/>',
  masters: '<circle cx="9" cy="8" r="3"/><path d="M3 20c0-3 3-5 6-5s6 2 6 5"/><path d="M17 11h4M19 9v4"/>',
  orders: '<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/>',
  shifts: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  staff: '<circle cx="9" cy="8" r="3"/><path d="M3 20c0-3 3-5 6-5s6 2 6 5"/>'
       + '<path d="M16 5l2 2 4-4"/>',
  brand: '<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/>',
  points: '<rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/>',
  customers: '<path d="M3 21V8l9-5 9 5v13"/><path d="M9 21v-6h6v6"/>',
  salary: '<rect x="2" y="6" width="20" height="12" rx="2"/>'
        + '<circle cx="12" cy="12" r="2.5"/><path d="M6 12h.01M18 12h.01"/>',
  booking: '<rect x="3" y="5" width="18" height="16" rx="2"/>'
         + '<path d="M8 3v4M16 3v4M3 11h18"/><path d="M8 15h3"/>',
  calendar: '<rect x="3" y="5" width="18" height="16" rx="2"/>'
          + '<path d="M8 3v4M16 3v4M3 11h18"/><path d="M8 16l2 2 4-4"/>',
  stock: '<path d="M3 7.5l9-4.5 9 4.5-9 4.5-9-4.5z"/><path d="M3 7.5v9l9 4.5 9-4.5v-9"/>'
       + '<path d="M12 12v9"/>',
  cash: '<rect x="3" y="10" width="18" height="10" rx="2"/><path d="M6 10V5h12v5"/>'
      + '<path d="M9 8h6M8 15h2M14 15h2"/>'
};

// Точки, которые сейчас на экране: выбранная или все
function shownShops() {
  if (!currentShop) return shops;
  return shops.filter(function (shop) { return String(shop.id) === String(currentShop); });
}

// «Склад» виден, когда у выбранной точки склад включён (docs/stock.md).
// По всем точкам — если включён хоть у одной
function stockOn() {
  return shownShops().some(function (shop) { return shop.stock_enabled; });
}

function sections() {
  var list = [];
  var can = function (name) { return me.permissions.indexOf(name) >= 0; };

  if (can('revenue')) list.push({ key: 'summary', title: 'Сводка' });
  // Задачи нужны всем, кто заходит в дашборд: владелец ставит их из
  // дома, админ отмечает. Отдельного права под них нет
  list.push({ key: 'calendar', title: 'Календарь' });
  // Остатки, как и задачи, нужны всем, кто заходит в дашборд
  if (stockOn()) list.push({ key: 'stock', title: 'Склад' });
  if (can('revenue')) list.push({ key: 'services', title: 'Услуги' });
  if (can('salary_all')) list.push({ key: 'masters', title: 'Мастера' });
  if (can('orders')) list.push({ key: 'orders', title: 'Наряды' });
  if (can('salary_all')) list.push({ key: 'shifts', title: 'Смены' });
  if (can('salary_all')) list.push({ key: 'salary', title: 'Зарплата' });
  // Касса — те же деньги, что выручка: видит тот, кому она открыта
  if (can('revenue')) list.push({ key: 'cash', title: 'Касса' });
  if (can('booking')) list.push({ key: 'booking', title: 'Запись' });
  if (can('staff')) list.push({ key: 'staff', title: 'Доступ' });
  // Как организацию видят клиенты и по каким адресам она открывается
  if (can('staff')) list.push({ key: 'brand', title: 'Оформление' });
  // Связь точек и коды подключения компьютера в цеху
  if (can('staff')) list.push({ key: 'points', title: 'Точки' });
  if (platformOn) list.push({ key: 'customers', title: 'Заказчики' });

  return list;
}

function drawTabs() {
  var list = sections();
  // Раздел пропал — у новой точки склад выключен. Не держим человека
  // на пустом месте, а открываем первый из доступных
  var here = list.some(function (item) { return item.key === section; });
  if (!here && list.length) section = list[0].key;
  $('tabs').innerHTML = list.map(function (item) {
    return '<button type="button" data-key="' + item.key + '" aria-pressed="'
      + (item.key === section) + '"><svg viewBox="0 0 24 24">' + ICONS[item.key]
      + '</svg>' + item.title + '</button>';
  }).join('');

  [].slice.call($('tabs').querySelectorAll('button')).forEach(function (button) {
    button.addEventListener('click', function () {
      section = button.getAttribute('data-key');
      drawTabs();
      load();
    });
  });
}

var PERIODS = [
  { key: 'today', title: 'Сегодня' },
  { key: 'yesterday', title: 'Вчера' },
  { key: '7', title: 'Неделя' },
  { key: '30', title: 'Месяц' },
  { key: 'custom', title: 'Свой период' }
];

function drawPeriod() {
  $('period').innerHTML = PERIODS.map(function (item) {
    return '<button class="chip" type="button" data-key="' + item.key
      + '" aria-pressed="' + (item.key === period.key) + '">' + item.title + '</button>';
  }).join('');

  [].slice.call($('period').querySelectorAll('button')).forEach(function (button) {
    button.addEventListener('click', function () {
      period.key = button.getAttribute('data-key');
      applyPeriod();
      drawPeriod();
      $('dates').className = 'dates' + (period.key === 'custom' ? ' on' : '');
      load();
    });
  });
}

// Рабочий день — это смена (решение владельца 27.10.2026): открыта смена
// со вчерашнего вечера — в час ночи «Сегодня» значит её. Сервер говорит,
// какой день сейчас рабочий (/dashboard/workday); пока не сказал — сегодня
var workDay = null;

function applyPeriod() {
  var today = new Date();
  if (workDay) {
    var parts = workDay.split('-');
    today = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
  }
  // По местной дате, а не toISOString: тот отдаёт UTC, и после полуночи
  // по Москве «сегодня» три часа было бы вчерашним
  var iso = function (date) {
    return date.getFullYear() + '-' + String(date.getMonth() + 1).padStart(2, '0')
      + '-' + String(date.getDate()).padStart(2, '0');
  };

  if (period.key === 'today') { period.from = period.to = iso(today); }
  else if (period.key === 'yesterday') {
    var day = new Date(today); day.setDate(day.getDate() - 1);
    period.from = period.to = iso(day);
  }
  else if (period.key === '7' || period.key === '30') {
    var back = new Date(today);
    back.setDate(back.getDate() - (period.key === '7' ? 6 : 29));
    period.from = iso(back); period.to = iso(today);
  }
  else {
    period.from = $('dFrom').value || period.from;
    period.to = $('dTo').value || period.to;
  }

  $('dFrom').value = period.from;
  $('dTo').value = period.to;
}

['dFrom', 'dTo'].forEach(function (id) {
  $(id).addEventListener('change', function () {
    period.key = 'custom';
    period.from = $('dFrom').value;
    period.to = $('dTo').value;
    drawPeriod();
    load();
  });
});

function query(path) {
  var join = path.indexOf('?') >= 0 ? '&' : '?';
  var full = withDir(path + join + 'from=' + period.from + '&to=' + period.to);
  return currentShop ? full + '&shop=' + encodeURIComponent(currentShop) : full;
}

// ------------------------------------------------------------------
// Шиномонтаж | Мойка (docs/wash_dashboard.md)
// ------------------------------------------------------------------
//
// Выручка, наряды, смены и начисления — по выбранному направлению.
// Смешанный наряд сервер делит по строкам. Переключатель виден, когда
// у выбранной точки есть мойка (по всем точкам — хоть у одной); нет
// мойки — направления в запросах нет, и цифры прежние, общие.
// Остатки зарплаты не делятся: человеку платят одной суммой.

var dashDirection = 'tire';
try {
  var savedDash = localStorage.getItem('dashDirection');
  if (savedDash === 'tire' || savedDash === 'wash') dashDirection = savedDash;
} catch (e) {}

// Разделы, которые считаются по направлению. У календаря и склада свой
// фильтр «Направление», остальное на шиномонтаж и мойку не делится
var DIR_SECTIONS = { summary: 1, services: 1, masters: 1, orders: 1, shifts: 1 };

function washOn() {
  return shownShops().some(function (shop) { return shop.wash_enabled; });
}

// Направление для запросов: пусто — всё вместе, как до мойки
function dashDir() { return washOn() ? dashDirection : ''; }

function withDir(path) {
  var dir = dashDir();
  if (!dir) return path;
  return path + (path.indexOf('?') >= 0 ? '&' : '?') + 'direction=' + dir;
}

function drawDirection() {
  var box = $('dirSwitch');
  box.hidden = !washOn() || !DIR_SECTIONS[section];
  if (box.hidden) return;

  box.innerHTML = '<div class="seg-in" role="group" aria-label="Направление">'
    + DIRS.map(function (item) {
      return '<button type="button" data-dir="' + item.key + '" aria-pressed="'
        + (item.key === dashDirection) + '">' + item.title + '</button>';
    }).join('') + '</div>';

  [].slice.call(box.querySelectorAll('button')).forEach(function (button) {
    button.addEventListener('click', function () {
      if (button.getAttribute('data-dir') === dashDirection) return;
      dashDirection = button.getAttribute('data-dir');
      try { localStorage.setItem('dashDirection', dashDirection); } catch (e) {}
      load();
    });
  });
}

// Метки направлений у смешанного наряда. У наряда одного направления
// метка — шум: что он шиномонтаж, и так видно по переключателю
function dirTags(directions) {
  if (!washOn() || !directions || directions.length < 2) return '';
  return directions.map(function (key) {
    return '<span class="dir ' + (key === 'wash' ? 'wash' : 'tire') + '">'
      + (STOCK_DIR_TAGS[key] || 'шинка') + '</span>';
  }).join('');
}

function withShop(path, shopId) {
  // Адрес без периода, но с выбранной точкой. shopId — точка самой строки:
  // номера нарядов и смен у каждой точки свои
  if (shopId) {
    return path + (path.indexOf('?') >= 0 ? '&' : '?') + 'shop=' + encodeURIComponent(shopId);
  }
  if (!currentShop) return path;
  var join = path.indexOf('?') >= 0 ? '&' : '?';
  return path + join + 'shop=' + encodeURIComponent(currentShop);
}

function drawShops() {
  // Одна точка — выбирать не из чего, полосу не показываем
  if (shops.length < 2) { $('shops').hidden = true; return; }

  $('shops').hidden = false;
  var all = '<button class="chip" type="button" data-shop="" aria-pressed="'
    + (currentShop === '') + '">Все точки</button>';

  $('shops').innerHTML = all + shops.map(function (shop) {
    return '<button class="chip" type="button" data-shop="' + shop.id
      + '" aria-pressed="' + (String(currentShop) === String(shop.id)) + '">'
      + escape(shop.name) + '</button>';
  }).join('');

  [].slice.call($('shops').querySelectorAll('button')).forEach(function (button) {
    button.addEventListener('click', function () {
      currentShop = button.getAttribute('data-shop');
      drawShops();
      drawTabs();
      load();
    });
  });
}

// ------------------------------------------------------------------
// Отрисовка разделов
// ------------------------------------------------------------------

function show(html) { $('view').innerHTML = html; }

function fail(text) {
  $('mainError').textContent = text;
  $('mainError').hidden = false;
}

function load() {
  $('mainError').hidden = true;
  show('<div class="empty">Загружаем…</div>');

  // На экране доступа период ни при чём: люди не относятся к месяцу
  var aboutPeople = section === 'staff' || section === 'salary'
                 || section === 'booking' || section === 'calendar'
                 || section === 'stock' || section === 'brand'
                 || section === 'points' || section === 'customers';
  $('period').style.display = aboutPeople ? 'none' : '';
  $('dates').style.display = aboutPeople ? 'none' : '';
  // Переключатель — после смены точки или раздела: у новой точки мойки
  // может не быть, а у раздела — деления по направлениям
  drawDirection();

  if (section === 'calendar') return loadCalendar();
  if (section === 'stock') return loadStock();
  if (section === 'booking') return loadBooking();
  if (section === 'staff') return loadStaff();
  if (section === 'brand') return loadBrand();
  if (section === 'points') return loadPoints();
  if (section === 'customers') return loadCustomers();
  if (section === 'salary') return loadSalary();
  if (section === 'cash') return loadCash();
  if (section === 'summary') return loadSummary();
  if (section === 'services') return loadServices();
  if (section === 'masters') return loadMasters();
  if (section === 'orders') return loadOrders();
  if (section === 'shifts') return loadShifts();
}

function loadSummary() {
  Promise.all([
    api(query('/dashboard/summary')),
    api(withShop('/dashboard/shifts/current'))
  ]).then(function (answers) {
    var data = answers[0], now = answers[1];
    var html = '';

    // Очередь из цеха — очередь шиномонтажа: у мойки живой очереди нет,
    // и её посты в этом слепке не считаются
    if (now.queue && dashDir() !== 'wash') {
      var q = now.queue;
      html += '<div class="card"><h2>Сейчас в цеху</h2>'
        + '<div class="line"><span>В работе</span><b>' + q.cars_in_work + '</b></div>'
        + '<div class="line"><span>Ждут</span><b>' + q.cars_waiting + '</b></div>'
        + (now.no_posts ? '' : '<div class="line"><span>Открыто постов</span><b>' + q.open_posts + '</b></div>')
        + '<div class="line"><span>Данные получены</span><b>' + timeText(q.taken_at) + '</b></div>'
        + '</div>';
    }

    html += '<div class="tiles">'
      + tile('Выручка', money(data.net_revenue), 'wide', data.net_revenue > 0 ? 'ok' : '')
      + tile('Машин', data.cars + (data.warranty_cars
             ? ' <span class="tag warn">' + data.warranty_cars + ' по гарантии</span>' : ''))
      + tile('Средний чек', money(data.average_check))
      + tile('Наличные', money(data.cash))
      + tile('Карта', money(data.card))
      + tile('Зарплата', money(data.salary))
      + tile('Расходники', money(data.consumables))
      + (data.refunded ? tile('Возвраты', money(data.refunded), '', 'bad') : '')
      + tile('Осталось цеху', money(data.left), 'wide')
      + '</div>';

    html += '<div class="card"><h2>Выручка по дням</h2>' + bars(data.by_day) + '</div>';
    show(html);
  }).catch(function (e) { show(''); fail(e.message); });
}

function tile(title, value, extra, color) {
  return '<div class="tile ' + (extra || '') + '"><span>' + title + '</span><b class="'
    + (color || '') + '">' + value + '</b></div>';
}

function bars(days) {
  if (!days || !days.length) return '<div class="empty">Нет данных</div>';

  var top = Math.max.apply(null, days.map(function (row) {
    return Math.max(row.revenue, 0);
  })) || 1;

  var html = '<div class="bars">' + days.map(function (row) {
    var height = Math.max(2, Math.round(Math.max(row.revenue, 0) / top * 118));
    return '<div class="bar' + (row.revenue > 0 ? '' : ' zero') + '" style="height:'
      + height + 'px" title="' + dayText(row.day) + ': ' + money(row.revenue) + '"></div>';
  }).join('') + '</div>';

  return html + '<div class="bar-labels"><span>' + dayText(days[0].day)
    + '</span><span>' + money(top) + '</span><span>'
    + dayText(days[days.length - 1].day) + '</span></div>';
}

function serviceRows(rows) {
  return rows.map(function (row) {
    return '<div class="row"><div class="main"><b>' + escape(row.service_name)
      + '</b><span>' + row.quantity + ' ' + plural(row.quantity, 'раз', 'раза', 'раз')
      + ' · ' + row.share + '%</span></div>'
      + '<div class="money">' + money(row.amount) + '</div></div>';
  }).join('');
}

function loadServices() {
  api(query('/dashboard/sales')).then(function (data) {
    var all = data.main.concat(data.extra);
    if (!all.length) return show('<div class="empty">За этот период услуг не было</div>');

    var html = '';

    // Доля допродаж впереди всего: это главное число на экране.
    // Пока прайс не размечен, его не показываем — ноль здесь означал бы
    // «не продают», а на деле означает «не отличили»
    if (data.marked) {
      html += '<div class="card"><h2>Продажи</h2>'
        + '<div class="tiles">'
        + tile('Основные услуги', money(data.main_amount))
        + tile('Допродажи', money(data.extra_amount))
        + tile('Доля допродаж', data.extra_share + '%')
        + '</div></div>';
    }

    if (data.main.length) {
      html += '<div class="card"><h2>Основные услуги</h2>'
        + serviceRows(data.main) + '</div>';
    }

    if (data.extra.length) {
      html += '<div class="card"><h2>Допродажи</h2>'
        + serviceRows(data.extra) + '</div>';
    }

    // Товары — разрез поперёк основного и допов: вентиль и то, и
    // другое. Поэтому отдельной карточкой, и главное в ней наценка:
    // выручка с перепродажи без закупки — это оборот, а не прибыль
    if (data.goods && data.goods.length) {
      html += '<div class="card"><h2>Товары</h2>'
        + '<div class="tiles">'
        + tile('Продано', money(data.goods_amount))
        + tile('Закупка', money(data.goods_cost))
        + tile('Наценка', money(data.goods_margin), 'wide',
               data.goods_margin > 0 ? 'ok' : '')
        + '</div>'
        + serviceRows(data.goods) + '</div>';
    }

    if (!data.marked) {
      html += '<p class="hint">Чтобы видеть долю допродаж, разметьте прайс '
        + 'в программе цеха: Прайс-лист → Свойства позиций → '
        + 'столбец «Вид».</p>';
    }

    show(html);
  }).catch(function (e) { show(''); fail(e.message); });
}

function loadMasters() {
  api(query('/dashboard/masters')).then(function (rows) {
    if (!rows.length) return show('<div class="empty">За этот период начислений не было</div>');

    show('<div class="card"><h2>Мастера</h2>' + rows.map(function (row) {
      return '<button class="row" type="button" data-master="' + row.employee_local_id + '">'
        + '<div class="main"><b>' + escape(row.title) + '</b><span>'
        + (!currentShop && row.shop_name ? escape(row.shop_name) + ' · ' : '')
        + row.orders + ' ' + plural(row.orders, 'наряд', 'наряда', 'нарядов')
        + ' · выработка ' + money(row.revenue)
        + (row.salary_percent ? ' · ' + row.salary_percent + '%' : '') + '</span></div>'
        + '<div class="money">' + money(row.salary) + '</div></button>';
    }).join('') + '</div>');

    [].slice.call($('view').querySelectorAll('[data-master]')).forEach(function (button) {
      button.addEventListener('click', function () {
        loadOrders(button.getAttribute('data-master'));
      });
    });
  }).catch(function (e) { show(''); fail(e.message); });
}

function loadOrders(masterId) {
  var path = '/dashboard/orders';
  if (masterId) path += '?employee_local_id=' + masterId;

  api(query(path)).then(function (rows) {
    if (!rows.length) return show('<div class="empty">За этот период нарядов нет</div>');

    show('<div class="card"><h2>Наряды' + (masterId ? ' мастера' : '') + '</h2>'
      + rows.map(function (row) {
        var tags = dirTags(row.directions);
        if (row.is_warranty) tags += '<span class="tag warn">гарантия</span>';
        if (row.refunded_amount) tags += '<span class="tag bad">возврат</span>';

        // Смешанный наряд: крупно — часть выбранного направления, мелко —
        // из какой суммы она. Иначе сумма списка не сойдётся со сводкой
        var part = row.direction_amount != null
          && Math.abs(row.direction_amount - row.total_amount) > 0.005;

        return '<button class="row" type="button" data-order="' + row.local_id
          + '" data-shop="' + (row.shop_id || '') + '">'
          + (row.cover_url ? '<img class="cover-sm" loading="lazy" alt="" src="'
             + escape(row.cover_url) + '">' : '')
          + '<div class="main"><b>' + escape(row.license_plate || '—') + tags + '</b>'
          + '<span>№' + row.local_id + ' · ' + timeText(row.visited_at)
          + (row.masters.length ? ' · ' + escape(row.masters.join(', ')) : '')
          + '</span></div>'
          + '<div class="money">' + money(part ? row.direction_amount : row.total_amount)
          + '<small>' + (part ? 'из ' + money(row.total_amount) + ' · ' : '')
          + (row.payment_method === 'card' ? 'карта' : 'наличные')
          + '</small></div></button>';
      }).join('') + '</div>');

    [].slice.call($('view').querySelectorAll('[data-order]')).forEach(function (button) {
      button.addEventListener('click', function () {
        openOrder(button.getAttribute('data-order'), button.getAttribute('data-shop'));
      });
    });
  }).catch(function (e) { show(''); fail(e.message); });
}

function loadShifts() {
  api(query('/dashboard/shifts')).then(function (rows) {
    if (!rows.length) return show('<div class="empty">За этот период смен не было</div>');

    show('<div class="card"><h2>Смены</h2>' + rows.map(function (row) {
      var open = row.status !== 'closed';
      return '<button class="row" type="button" data-shift="' + row.local_id
        + '" data-shop="' + (row.shop_id || '') + '">'
        + '<div class="main"><b>' + timeText(row.started_at)
        + (open ? '<span class="tag ok">идёт</span>' : '') + '</b>'
        + '<span>' + row.open_posts + ' '
        + plural(row.open_posts, 'пост', 'поста', 'постов')
        + (row.ended_at ? ' · до ' + timeText(row.ended_at) : '') + '</span></div>'
        + '<div class="money">' + money(row.total_salary)
        + '<small>начислено</small></div></button>';
    }).join('') + '</div>');

    [].slice.call($('view').querySelectorAll('[data-shift]')).forEach(function (button) {
      button.addEventListener('click', function () {
        openShift(button.getAttribute('data-shift'), button.getAttribute('data-shop'));
      });
    });
  }).catch(function (e) { show(''); fail(e.message); });
}

// ------------------------------------------------------------------
// Зарплата: остатки и выдача на карту
// ------------------------------------------------------------------

function loadSalary() {
  api(withShop('/dashboard/salary')).then(function (data) {
    var html = '';

    // Итог впереди построчного: владельцу сначала нужен ответ на
    // вопрос «сколько всего отдать», а уже потом — кому именно
    if (data.totals && data.people.length) {
      html += '<div class="card"><h2>Итого</h2><div class="tiles">'
        + tile('Начислено', money(data.totals.accrued))
        + tile('Выдано', money(data.totals.paid))
        + tile('Осталось выдать', money(data.totals.balance), '', 'bad')
        + (data.totals.waiting
           ? tile('Ждёт цеха', money(data.totals.waiting))
           : '')
        + '</div></div>';
    }

    html += '<div class="card"><h2>Кому сколько должны</h2>';

    if (!data.people.length) {
      html += '<div class="empty">Сотрудников пока нет</div>';
    }

    html += data.people.map(function (person) {
      // Отмеченный перевод уже вычтен из остатка. Говорим об этом
      // прямо: иначе владелец решит, что перевод не прошёл, и повторит
      var waiting = person.waiting
        ? '<span class="tag warn">ждёт цеха ' + money(person.waiting) + '</span>'
        : '';

      // Ключ — точка и номер: «Игорь (№1)» есть в каждой точке, и без
      // названия эти строки неразличимы
      return '<button class="row" type="button" data-pay="'
        + person.shop_id + ':' + person.employee_local_id + '"'
        + (data.can_pay ? '' : ' disabled style="opacity:1"') + '>'
        + '<div class="main"><b>' + escape(person.title) + waiting + '</b>'
        + '<span>'
        + (!currentShop && person.shop_name
           ? escape(person.shop_name) + ' · ' : '')
        + 'начислено ' + money(person.accrued)
        + ' · выдано ' + money(person.paid) + '</span></div>'
        + '<div class="money' + (person.balance < 0 ? '' : '') + '">'
        + money(person.balance)
        + '<small>' + (person.balance < 0 ? 'переплата' : 'к выдаче')
        + '</small></div></button>';
    }).join('') + '</div>';

    if (data.can_pay) {
      html += '<p class="empty" style="padding:4px 10px 14px">'
        + 'Наличные выдают в программе цеха, под ПИНом. Отсюда — только '
        + 'перевод на карту.</p>';
    }

    if (data.payouts.length) {
      html += '<div class="card"><h2>Последние выплаты</h2>'
        + data.payouts.map(function (row) {
            var marks = '';
            if (row.is_advance) marks += '<span class="tag warn">аванс</span>';
            if (row.waiting) marks += '<span class="tag warn">ждёт цеха</span>';

            return '<div class="row"><div class="main"><b>'
              + escape(row.title) + marks + '</b><span>'
              + (row.paid_at ? timeText(row.paid_at) : '')
              + ' · ' + (row.method === 'card' ? 'на карту' : 'наличными')
              + (row.source === 'dashboard' ? ' · отметил владелец' : '')
              + '</span></div>'
              + '<div class="money">' + money(row.amount) + '</div></div>';
          }).join('') + '</div>';
    }

    show(html);

    var people = {};
    data.people.forEach(function (person) {
      people[person.shop_id + ':' + person.employee_local_id] = person;
    });

    if (data.can_pay) {
      [].slice.call($('view').querySelectorAll('[data-pay]')).forEach(function (button) {
        button.addEventListener('click', function () {
          openPayout(people[button.getAttribute('data-pay')]);
        });
      });
    }
  }).catch(function (e) { show(''); fail(e.message); });
}

function openPayout(person) {
  var html = '<h2>' + escape(person.title) + '</h2>'
    + '<div class="when">Перевод на карту'
    + (person.shop_name ? ' · ' + escape(person.shop_name) : '') + '</div>'
    + '<div class="line"><span>Начислено за всё время</span><b>'
    + money(person.accrued) + '</b></div>'
    + '<div class="line"><span>Уже выдано</span><b>'
    + money(person.paid) + '</b></div>'
    + '<div class="line total"><span>К выдаче</span><b>'
    + money(person.balance) + '</b></div>';

  html += '<div class="form">'
    + '<label for="pAmount">Сумма перевода</label>'
    + '<input id="pAmount" type="number" inputmode="decimal" value="'
    + (person.balance > 0 ? Math.round(person.balance) : '') + '">'
    + '<label for="pComment">Комментарий</label>'
    + '<input id="pComment" type="text" placeholder="за сентябрь">'
    + '<p class="note">Деньги переводите сами, из своего банка. Здесь '
    + 'вы отмечаете, что перевод сделан: программа цеха учтёт его при '
    + 'ближайшем обмене, и остаток уменьшится.</p></div>';

  html += '<button class="go" type="button" id="doPay" style="margin-top:16px">'
    + 'Отметить перевод</button>'
    + '<div class="error" id="formError" hidden></div>';

  sheet(html);

  $('doPay').addEventListener('click', function () {
    var amount = parseFloat($('pAmount').value);
    if (!amount || amount <= 0) {
      formError('Укажите сумму перевода');
      return;
    }

    if (amount > person.balance + 0.01) {
      if (!confirm('Это больше, чем начислено (' + money(person.balance)
                   + '). Выдать авансом?')) return;
    }

    api('/dashboard/salary/pay', { method: 'POST', body: {
      shop_id: person.shop_id,
      employee_local_id: person.employee_local_id,
      amount: amount,
      comment: $('pComment').value
    } }).then(function () {
      closeSheet();
      loadSalary();
    }).catch(function (e) { formError(e.message); });
  });
}

// ------------------------------------------------------------------
// Запись: посты, часы и выключатель
// ------------------------------------------------------------------
//
// То же самое меняется и в цеху, под ПИНом администратора. Разошлись —
// прав тот, кто поставил позже. Поэтому здесь всегда показываем, когда
// настройку правили в последний раз: иначе владелец, выключивший
// запись, не поймёт, почему через десять минут она снова включена.

function loadBooking() {
  if (shops.length > 1 && !currentShop) {
    show('<div class="card"><h2>Запись</h2><p class="note">Часы и посты '
       + 'у каждой точки свои. Выберите точку сверху.</p></div>');
    return;
  }

  api(withShop('/dashboard/booking-settings')).then(function (data) {
    drawBooking(data);
  }).catch(function (e) {
    show('<div class="empty">' + escape(e.message) + '</div>');
  });
}

function drawBooking(data) {
  var posts = [1, 2, 3].map(function (count) {
    return '<button class="chip" type="button" data-posts="' + count
      + '" aria-pressed="' + (count === data.booking_posts) + '">'
      + count + '</button>';
  }).join('');

  var html = '<div class="card"><h2>Приём записи</h2>'
    + '<div class="line"><span>Через интернет</span><b id="bState">'
    + (data.booking_enabled ? 'включён' : 'выключен') + '</b></div>'
    + '<button class="go" type="button" id="bToggle" style="margin-top:12px">'
    + (data.booking_enabled ? 'Выключить приём записи' : 'Включить приём записи')
    + '</button>';

  if (data.booking_enabled && !data.shop.takes_bookings) {
    html += '<p class="note">Приём включён, но точка не выходила на связь '
      + 'с программой цеха — пока связи не будет, записаться нельзя.</p>';
  } else {
    html += '<p class="note">Выключенную запись клиенты не видят: точка '
      + 'не показывается в кабинете. Записи, сделанные раньше, остаются '
      + 'на месте.</p>';
  }
  html += '</div>';

  // Без постов — «машин в час»: машины к постам не привязаны
  html += '<div class="card"><h2>' + (data.hourly ? 'Машин в час по записи' : 'Постов под запись') + '</h2>'
    + '<div class="period" id="bPosts" style="padding:0;margin:4px 0 2px">'
    + posts + '</div>'
    + '<p class="note">Это запас на дни, которые в цеху отдельно не '
    + 'настраивали. Если приёмщик задал число на конкретный день, '
    + 'главнее его: он видит, кто в тот день работает.</p></div>';

  html += '<div class="card"><h2>Часы записи</h2>'
    + '<div class="clock">'
    + '<div><label for="bOpens">Записывать с</label>'
    + '<input id="bOpens" type="time" value="'
    + escape(data.booking_opens_at) + '"></div>'
    + '<div><label for="bCloses">Записывать до</label>'
    + '<input id="bCloses" type="time" value="'
    + escape(data.booking_closes_at === '24:00' ? '23:59' : data.booking_closes_at)
    + '"></div></div>'
    + '<p class="note">В эти часы кабинет предлагает окна клиентам. '
    + 'Приёмщика они не ограничивают: по телефону он запишет на любое '
    + 'время.</p>'
    + '<button class="go" type="button" id="bSaveHours" '
    + 'style="margin-top:12px">Сохранить часы</button></div>';

  html += '<div class="card"><h2>Когда меняли</h2>'
    + bookingWhen('Приём записи', data.changed_at.booking_enabled)
    + bookingWhen('Посты', data.changed_at.booking_posts)
    + bookingWhen('Записывать с', data.changed_at.booking_opens_at)
    + bookingWhen('Записывать до', data.changed_at.booking_closes_at)
    + '<p class="note">То же меняется и в цеху. Если поменяли с двух '
    + 'сторон, останется то, что поставили позже. Цех узнает об этой '
    + 'правке при ближайшем обмене, клиенты в кабинете — сразу.</p></div>';

  html += '<div class="error" id="formError" hidden></div>';
  show(html);

  $('bToggle').addEventListener('click', function () {
    saveBooking({ booking_enabled: !data.booking_enabled });
  });

  [].slice.call($('bPosts').querySelectorAll('button')).forEach(function (button) {
    button.addEventListener('click', function () {
      saveBooking({ booking_posts: parseInt(button.getAttribute('data-posts'), 10) });
    });
  });

  $('bSaveHours').addEventListener('click', function () {
    var closes = $('bCloses').value;
    // Полночь браузер отдаёт как 23:59: «24:00» в поле времени не ввести,
    // а сервер понимает именно конец суток
    if (closes === '23:59') closes = '24:00';
    saveBooking({ booking_opens_at: $('bOpens').value,
                  booking_closes_at: closes });
  });
}

function bookingWhen(title, iso) {
  return '<div class="line"><span>' + title + '</span><b>'
    + (iso ? timeText(iso) : 'не меняли') + '</b></div>';
}

function saveBooking(body) {
  api(withShop('/dashboard/booking-settings'),
      { method: 'PUT', body: body })
    .then(function () { loadBooking(); })
    .catch(function (e) {
      var box = $('formError');
      if (box) { box.textContent = e.message; box.hidden = false; }
      else fail(e.message);
    });
}
