var roles = null;   // справочник ролей и прав, спрашиваем один раз

// ------------------------------------------------------------------
// Оформление и адреса
// ------------------------------------------------------------------
//
// У каждой организации своё название, логотип и цвет на странице
// записи и свой адрес (решение владельца 27.10.2026). Свой домен
// подключается здесь: вписал, сделал запись у регистратора — сервер
// сам проверит и выпустит сертификат (deploy/domains.sh)

var BRAND_COLORS = ['#2563eb', '#dc2626', '#059669', '#ea580c', '#7c3aed', '#1e293b'];

function domainTag(item) {
  var kind = item.status === 'active' ? 'ok' : (item.status === 'error' ? 'bad' : 'warn');
  return '<span class="tag ' + kind + '">' + escape(item.status_title) + '</span>';
}

function loadBrand() {
  api('/dashboard/brand').then(drawBrand).catch(function (e) { show(''); fail(e.message); });
}

function drawBrand(data) {
  var colors = BRAND_COLORS.slice();
  if (colors.indexOf(data.color) < 0) colors.push(data.color);

  var html = '<div class="card"><h2>Как вас видят клиенты</h2>'
    + '<div class="field"><label for="bName">Название на странице записи</label>'
    + '<input id="bName" maxlength="200" value="' + escape(data.name) + '" placeholder="'
    + escape(data.shown_name) + '"></div>'
    + '<div class="field"><label>Логотип</label>'
    + '<div style="display:flex;gap:12px;align-items:center">'
    + '<img id="bLogo" alt="Логотип" style="width:64px;height:64px;border-radius:12px;'
    + 'object-fit:contain;background:var(--line)"' + (data.has_logo ? '' : ' hidden') + '>'
    + '<div style="display:flex;flex-direction:column;gap:6px">'
    + '<label class="chip" style="cursor:pointer">Загрузить<input id="bFile" type="file"'
    + ' accept="image/png,image/jpeg,image/webp" hidden></label>'
    + (data.has_logo ? '<button class="link" type="button" id="bNoLogo" style="padding:0">Убрать</button>' : '')
    + '</div></div>'
    + '<div class="hint">Квадратный JPG или PNG. Он же — значок кабинета на экране телефона.</div></div>'
    + '<div class="field"><label>Цвет кнопок</label><div style="display:flex;gap:8px;flex-wrap:wrap">'
    + colors.map(function (color) {
        return '<button type="button" data-color="' + color + '" aria-label="Цвет ' + color
          + '" aria-pressed="' + (color === data.color) + '" style="width:40px;height:40px;'
          + 'border-radius:20px;background:' + color + ';border:' + (color === data.color
            ? '3px solid var(--ink)' : '0') + '"></button>';
      }).join('')
    + '</div></div>'
    + '<div class="hint">Видно на странице записи, в кабинете клиента и на экране очереди.</div>'
    + '</div>';

  html += '<div class="card"><h2>Адреса</h2>'
    + data.ours.map(function (item) {
        return '<div class="row"><div class="main"><b>' + escape(item.name) + ' ' + domainTag(item)
          + '</b><span>' + escape(item.role_title) + '</span></div></div>';
      }).join('')
    + data.own.map(function (item) {
        var how = '';
        if (item.status !== 'active') {
          how = '<span>Там, где покупали домен, добавьте запись: тип <b style="display:inline">'
            + item.record.type + '</b>, имя <b style="display:inline">' + escape(item.record.host)
            + '</b>, значение <b style="display:inline">' + escape(item.record.value) + '</b>.'
            + (item.record_a.value ? ' Если CNAME нельзя — тип A, значение '
              + escape(item.record_a.value) + '.' : '')
            + ' Проверяем сами каждые 5 минут.</span>';
        }
        return '<div class="row"><div class="main"><b>' + escape(item.name) + ' ' + domainTag(item)
          + '</b><span>' + escape(item.role_title) + (item.note ? ' · ' + escape(item.note) : '')
          + '</span>' + how + '</div>'
          + '<button class="link" type="button" data-drop="' + item.id + '">Отключить</button></div>';
      }).join('')
    + '<h2 style="margin-top:16px">Подключить свой домен</h2>'
    + '<div class="form"><div class="field"><label for="dName">Адрес</label>'
    + '<input id="dName" placeholder="zapis.vash-domen.ru" autocapitalize="off" spellcheck="false"></div>'
    + '<div class="field"><label for="dRole">Для чего</label><select id="dRole">'
    + '<option value="lk">Запись и кабинет клиента</option><option value="admin">Дашборд</option>'
    + '</select></div></div>'
    + '<button class="go" type="button" id="dAdd">Подключить</button>'
    + '<div class="hint">Наш адрес продолжает работать и после подключения своего — '
    + 'старые ссылки у клиентов не сломаются.</div></div>';

  show(html);

  if (data.has_logo) {
    fetch('/dashboard/brand/logo?v=' + encodeURIComponent(data.logo_version),
          { headers: { Authorization: 'Bearer ' + token } })
      .then(function (answer) { return answer.ok ? answer.blob() : null; })
      .then(function (blob) { if (blob && $('bLogo')) $('bLogo').src = URL.createObjectURL(blob); })
      .catch(function () {});
  }

  function save(body) {
    api('/dashboard/brand', { method: 'PUT', body: body }).then(drawBrand)
      .catch(function (e) { fail(e.message); });
  }

  $('bName').addEventListener('change', function () { save({ name: $('bName').value }); });
  [].slice.call($('view').querySelectorAll('[data-color]')).forEach(function (button) {
    button.addEventListener('click', function () { save({ color: button.getAttribute('data-color') }); });
  });

  $('bFile').addEventListener('change', function () {
    var file = $('bFile').files[0];
    if (!file) return;
    var form = new FormData();
    form.append('file', file);
    fetch('/dashboard/brand/logo', { method: 'POST', body: form,
                                     headers: { Authorization: 'Bearer ' + token } })
      .then(function (answer) {
        return answer.json().then(function (body) {
          if (!answer.ok) throw new Error(body.detail || 'Не получилось загрузить');
          return body;
        });
      })
      .then(drawBrand).catch(function (e) { fail(e.message); });
  });

  if ($('bNoLogo')) {
    $('bNoLogo').addEventListener('click', function () {
      api('/dashboard/brand/logo', { method: 'DELETE' }).then(drawBrand)
        .catch(function (e) { fail(e.message); });
    });
  }

  $('dAdd').addEventListener('click', function () {
    var name = $('dName').value.trim();
    if (!name) return;
    api('/dashboard/domains', { method: 'POST', body: { name: name, role: $('dRole').value } })
      .then(drawBrand).catch(function (e) { fail(e.message); });
  });

  [].slice.call($('view').querySelectorAll('[data-drop]')).forEach(function (button) {
    button.addEventListener('click', function () {
      if (!confirm('Отключить этот адрес? По нему перестанут открываться страницы.')) return;
      api('/dashboard/domains/' + button.getAttribute('data-drop'), { method: 'DELETE' })
        .then(drawBrand).catch(function (e) { fail(e.message); });
    });
  });
}

// ------------------------------------------------------------------
// Коды подключения: «Точки» и «Заказчики»
// ------------------------------------------------------------------
//
// Решение владельца 27.10.2026: новую точку ставят без SSH и ключа.
// Здесь выдаётся код из 8 цифр и готовое сообщение со ссылкой на
// страницу скачивания; в программе цеха вводят тот же код
// (app/services/onboarding.py)

var shownCode = null;     // { title, code } — только что выданный код

function copyText(text) {
  if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(text);
  var area = document.createElement('textarea');
  area.value = text;
  document.body.appendChild(area);
  area.select();
  try { document.execCommand('copy'); } catch (e) {}
  document.body.removeChild(area);
  return Promise.resolve();
}

function codeCard() {
  if (!shownCode || !shownCode.code) return '';
  var code = shownCode.code;
  return '<div class="card" style="border:2px solid var(--brand)"><h2>Код для «'
    + escape(shownCode.title) + '»</h2>'
    + '<div style="font-size:34px;font-weight:700;letter-spacing:6px;text-align:center;margin:6px 0">'
    + escape(code.code) + '</div>'
    + '<div class="hint" style="text-align:center">Срабатывает один раз · действует до '
    + escape(stampText(code.expires_at)) + '</div>'
    + '<div class="hint" style="white-space:pre-line;background:var(--bg);border-radius:10px;padding:10px 12px">'
    + escape(code.text) + '</div>'
    + '<button class="go" type="button" id="cCopy">Скопировать сообщение</button>'
    + '<div class="hint">Перешлите его в WhatsApp или Telegram тому, кто будет ставить программу.</div>'
    + '</div>';
}

function bindCodeCard() {
  if (!$('cCopy')) return;
  $('cCopy').addEventListener('click', function () {
    copyText(shownCode.code.text).then(function () {
      $('cCopy').textContent = 'Скопировано ✓';
    }).catch(function () { fail('Не получилось скопировать — выделите текст вручную'); });
  });
}

function pointRow(point, codePath) {
  var kind = point.state === 'online' ? 'ok' : (point.state === 'offline' ? 'bad' : 'warn');
  var about = point.state === 'waiting'
    ? (point.code ? 'код ' + point.code.code + ' до ' + stampText(point.code.expires_at) : 'кода нет')
    : 'обмен ' + stampText(point.last_sync_at);
  return '<div class="row"><div class="main"><b>' + escape(point.name)
    + ' <span class="tag ' + kind + '">' + escape(point.state_title) + '</span></b>'
    + '<span>' + escape(about) + '</span></div>'
    + '<button class="chip" type="button" data-code="' + codePath + point.id + '" data-title="'
    + attr(point.name) + '">' + (point.state === 'waiting' ? 'Код' : 'Переподключить') + '</button>'
    + (point.code ? '<button class="link" type="button" style="width:auto;padding:0 0 0 10px" data-uncode="'
      + codePath + point.id + '">Отменить код</button>' : '')
    + '</div>';
}

function bindPointRows(reload) {
  [].slice.call($('view').querySelectorAll('[data-code]')).forEach(function (button) {
    button.addEventListener('click', function () {
      var title = button.getAttribute('data-title');
      api(button.getAttribute('data-code') + '/code', { method: 'POST' }).then(function (code) {
        shownCode = { title: title, code: code };
        reload();
      }).catch(function (e) { fail(e.message); });
    });
  });
  [].slice.call($('view').querySelectorAll('[data-uncode]')).forEach(function (button) {
    button.addEventListener('click', function () {
      if (!confirm('Отменить код? По нему больше нельзя будет подключиться.')) return;
      api(button.getAttribute('data-uncode') + '/code', { method: 'DELETE' }).then(function () {
        shownCode = null;
        reload();
      }).catch(function (e) { fail(e.message); });
    });
  });
}

function loadPoints() {
  api('/dashboard/points').then(function (data) {
    show(codeCard() + '<div class="card"><h2>Точки</h2>'
      + data.points.map(function (point) { return pointRow(point, '/dashboard/points/'); }).join('')
      + '<div class="hint">«Переподключить» — когда в цеху меняют компьютер. Выдаётся код; '
      + 'старый компьютер работает, пока код не введут на новом, — обмен не встаёт.</div></div>');
    bindCodeCard();
    bindPointRows(loadPoints);
  }).catch(function (e) { show(''); fail(e.message); });
}

// --- Заказчики: видит только владелец сервера -------------------------

function sizeText(bytes) {
  return (bytes / 1024 / 1024).toFixed(1).replace('.', ',') + ' МБ';
}

function loadCustomers() {
  api('/platform/accounts').then(drawCustomers).catch(function (e) { show(''); fail(e.message); });
}

function drawCustomers(data) {
  var program = data.program || {};
  var html = codeCard();

  html += '<div class="card"><h2>Программа для точек</h2>'
    + (program.exists
      ? '<div class="line"><span>Загружена</span><b>' + escape(stampText(program.uploaded_at))
        + ' · ' + sizeText(program.size) + '</b></div>'
      : '<div class="hint" style="color:var(--bad)">Не загружена — по коду её пока не скачать.</div>')
    + '<div class="line"><span>Страница скачивания</span><b class="url">' + escape(data.setup_url) + '</b></div>'
    + '<label class="chip" style="cursor:pointer;display:inline-block;margin-top:10px">'
    + 'Загрузить новую версию<input id="pFile" type="file" accept=".exe" hidden></label>'
    + '<div class="hint" id="pState">Файл dist/TireShop.exe после сборки. Новые точки сразу получат его.</div></div>';

  html += '<div class="card"><h2>Новый заказчик</h2><div class="form">'
    + '<div class="field"><label for="nName">Название</label><input id="nName" maxlength="200" placeholder="Сеть «Колесо»"></div>'
    + '<div class="field"><label for="nSlug">Короткое имя для адреса — необязательно</label>'
    + '<input id="nSlug" maxlength="48" placeholder="koleso" autocapitalize="off" spellcheck="false"></div>'
    + '<div class="field"><label for="nPhone">Телефон владельца — он первым войдёт в дашборд</label>'
    + '<input id="nPhone" type="tel" placeholder="+7 900 000-00-00"></div>'
    + '<div class="field"><label for="nUntil">Оплачено до — пусто, если без срока</label><input id="nUntil" type="date"></div>'
    + '<button class="go" type="button" id="nGo">Завести и выдать код первой точки</button>'
    + '</div></div>';

  data.accounts.forEach(function (account) {
    var bill = account.billing;
    var kind = bill.state === 'paid' || bill.state === 'free' ? 'ok'
      : (bill.state === 'grace' ? 'warn' : 'bad');
    html += '<div class="card"><h2>' + escape(account.name) + ' <span class="tag ' + kind + '">'
      + escape(bill.title) + (bill.paid_until ? ' до ' + escape(shortDay(bill.paid_until.slice(0, 10))) : '')
      + '</span></h2>'
      + '<div class="line"><span>Запись</span><b class="url">' + escape(account.lk_url || '—') + '</b></div>'
      + '<div class="line"><span>Дашборд</span><b class="url">' + escape(account.admin_url || '—') + '</b></div>'
      + '<div class="line"><span>Владелец</span><b class="url">' + escape(account.owners.join(', ') || '—') + '</b></div>'
      + account.shops.map(function (point) { return pointRow(point, '/platform/shops/'); }).join('')
      + '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px">'
      + '<button class="chip" type="button" data-add="' + account.id + '">+ Точка</button>'
      + '<button class="chip" type="button" data-pay="' + account.id + '">Записать оплату</button>'
      + (account.is_home ? '' : (bill.state === 'blocked'
        ? '<button class="chip" type="button" data-open="' + account.id + '">Открыть доступ</button>'
        : '<button class="chip" type="button" data-close="' + account.id + '">Закрыть доступ</button>'))
      + '</div></div>';
  });

  show(html);
  bindCodeCard();
  bindPointRows(loadCustomers);

  $('nGo').addEventListener('click', function () {
    var body = { name: $('nName').value.trim(), owner_phone: $('nPhone').value.trim(),
                 slug: $('nSlug').value.trim() || null, paid_until: $('nUntil').value || null };
    if (!body.name || !body.owner_phone) { fail('Впишите название и телефон владельца'); return; }
    $('nGo').disabled = true;
    api('/platform/accounts', { method: 'POST', body: body }).then(function (answer) {
      shownCode = { title: answer.account.shops[0].name, code: answer.code };
      loadCustomers();
    }).catch(function (e) { $('nGo').disabled = false; fail(e.message); });
  });

  function each(attrName, act) {
    [].slice.call($('view').querySelectorAll('[' + attrName + ']')).forEach(function (button) {
      button.addEventListener('click', function () { act(button.getAttribute(attrName)); });
    });
  }

  each('data-add', function (id) {
    var name = prompt('Название новой точки');
    if (!name || !name.trim()) return;
    api('/platform/accounts/' + id + '/shops', { method: 'POST', body: { name: name.trim() } })
      .then(function (answer) { shownCode = { title: name.trim(), code: answer.code }; loadCustomers(); })
      .catch(function (e) { fail(e.message); });
  });
  each('data-pay', function (id) {
    var amount = prompt('Сколько пришло, ₽');
    if (amount === null) return;
    var months = prompt('За сколько месяцев', '1');
    if (months === null) return;
    api('/platform/accounts/' + id + '/pay', { method: 'POST',
        body: { amount: Number(String(amount).replace(',', '.')) || 0, months: parseInt(months, 10) || 1 } })
      .then(loadCustomers).catch(function (e) { fail(e.message); });
  });
  each('data-close', function (id) {
    var reason = prompt('Закрыть кабинет, запись и дашборд организации. Причина (необязательно):', '');
    if (reason === null) return;
    api('/platform/accounts/' + id + '/block', { method: 'POST', body: { reason: reason } })
      .then(loadCustomers).catch(function (e) { fail(e.message); });
  });
  each('data-open', function (id) {
    api('/platform/accounts/' + id + '/unblock', { method: 'POST' })
      .then(loadCustomers).catch(function (e) { fail(e.message); });
  });

  $('pFile').addEventListener('change', function () {
    var file = $('pFile').files[0];
    if (file) uploadProgram(file);
  });
}

// 40 МБ одним запросом nginx не пропустит (до 10 МБ) — режем на куски
function uploadProgram(file) {
  function say(text) { if ($('pState')) $('pState').textContent = text; }
  api('/platform/program/start', { method: 'POST' }).then(function (start) {
    var step = start.part_bytes;
    function next(offset) {
      if (offset >= file.size) {
        say('Проверяем файл…');
        return api('/platform/program/finish?upload=' + start.upload + '&size=' + file.size,
                   { method: 'POST' });
      }
      say('Загружаем… ' + Math.floor(offset * 100 / file.size) + '%');
      return fetch('/platform/program/part?upload=' + start.upload + '&offset=' + offset, {
        method: 'POST', body: file.slice(offset, offset + step),
        headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/octet-stream' }
      }).then(function (answer) {
        return answer.json().catch(function () { return {}; }).then(function (body) {
          if (!answer.ok) throw new Error(body.detail || 'Кусок файла не принят');
          return next(body.size);
        });
      });
    }
    return next(0);
  }).then(function () {
    loadCustomers();
  }).catch(function (e) { say(''); fail(e.message); });
}

function loadStaff() {
  var need = roles ? Promise.resolve(roles) : api('/staff/roles');

  Promise.all([need, api('/staff/people')]).then(function (answers) {
    roles = answers[0];
    var people = answers[1];

    var html = '<div class="card"><h2>Кто имеет доступ</h2>'
      + people.map(function (person) {
        var tags = '';
        if (!person.is_active) tags += '<span class="tag bad">доступ закрыт</span>';
        else if (!person.pin_is_set) tags += '<span class="tag warn">ещё не заходил</span>';

        return '<button class="row" type="button" data-person="' + person.id + '">'
          + '<div class="main"><b>' + escape(person.name || person.phone) + tags + '</b>'
          + '<span>' + escape(person.role_title) + ' · ' + escape(person.phone)
          + '</span></div>'
          + '<div class="money" style="font-weight:400;color:var(--muted)">›</div>'
          + '</button>';
      }).join('') + '</div>';

    html += '<button class="go" type="button" id="addPerson">Добавить сотрудника</button>';
    html += '<button class="link" type="button" id="openLog">Журнал действий</button>';

    show(html);

    var index = {};
    people.forEach(function (person) { index[person.id] = person; });

    [].slice.call($('view').querySelectorAll('[data-person]')).forEach(function (button) {
      button.addEventListener('click', function () {
        openPerson(index[button.getAttribute('data-person')]);
      });
    });

    $('addPerson').addEventListener('click', function () { openPerson(null); });
    $('openLog').addEventListener('click', openLog);
  }).catch(function (e) { show(''); fail(e.message); });
}

function roleOptions(current) {
  return roles.roles.map(function (role) {
    return '<option value="' + role.key + '"'
      + (role.key === current ? ' selected' : '') + '>' + escape(role.title) + '</option>';
  }).join('');
}

function rolePermissions(key) {
  var role = roles.roles.filter(function (item) { return item.key === key; })[0];
  return role ? role.permissions : [];
}

function openPerson(person) {
  var adding = !person;
  var current = person ? person.permissions : rolePermissions('admin');

  var html = '<h2>' + (adding ? 'Новый сотрудник'
                              : escape(person.name || person.phone)) + '</h2>';
  html += '<div class="when">' + (adding
    ? 'Человек войдёт сам: телефон, код, свой ПИН'
    : escape(person.phone) + ' · ' + escape(person.role_title)) + '</div>';

  html += '<div class="form">';

  if (adding) {
    html += '<label for="fPhone">Телефон</label>'
      + '<input id="fPhone" type="tel" inputmode="tel" placeholder="+7 ___ ___-__-__">';
  }

  html += '<label for="fName">Имя</label>'
    + '<input id="fName" type="text" value="' + escape(person ? (person.name || '') : '')
    + '" placeholder="Игорь">';

  html += '<label for="fRole">Роль</label><select id="fRole">'
    + roleOptions(person ? person.role : 'admin') + '</select>';

  html += '<label>Что доступно</label><div id="fPerms">'
    + roles.permissions.map(function (item) {
        return '<label class="perm"><input type="checkbox" value="' + item.key + '"'
          + (current.indexOf(item.key) >= 0 ? ' checked' : '') + '>'
          + escape(item.title) + '</label>';
      }).join('') + '</div>'
    + '<p class="note">Галочки подставляются по роли. Снимите или добавьте '
    + 'любую — у этого человека будет по-своему.</p>';

  html += '</div>';

  html += '<button class="go" type="button" id="savePerson" style="margin-top:18px">'
    + (adding ? 'Завести' : 'Сохранить') + '</button>';

  if (!adding) {
    html += '<button class="danger" type="button" id="togglePerson">'
      + (person.is_active ? 'Закрыть доступ' : 'Открыть доступ снова') + '</button>';
  }

  html += '<div class="error" id="formError" hidden></div>';

  sheet(html);

  // Сменили роль — подставляем её галочки. Человек, меняющий роль,
  // ждёт именно этого, а не сохранения прежних прав от старой
  $('fRole').addEventListener('change', function () {
    var allowed = rolePermissions($('fRole').value);
    [].slice.call($('fPerms').querySelectorAll('input')).forEach(function (box) {
      box.checked = allowed.indexOf(box.value) >= 0;
    });
  });

  if (adding) {
    $('fPhone').addEventListener('input', function (event) {
      event.target.value = fixPhone(event.target.value);
    });
  }

  $('savePerson').addEventListener('click', function () {
    var chosen = [].slice.call($('fPerms').querySelectorAll('input'))
      .filter(function (box) { return box.checked; })
      .map(function (box) { return box.value; });

    var body = {
      name: $('fName').value,
      role: $('fRole').value,
      permissions: chosen
    };

    var request = adding
      ? api('/staff/people', { method: 'POST',
            body: Object.assign({ phone: $('fPhone').value.replace(/\D/g, '') }, body) })
      : api('/staff/people/' + person.id, { method: 'PATCH', body: body });

    request.then(function () {
      // Себе же меняли права — прежний вход больше не годится,
      // и сервер это подтвердит отказом на первом же запросе
      if (person && me && person.id === me.id) {
        closeSheet();
        forget();
        loginError('Права изменились, войдите заново');
        return;
      }
      closeSheet();
      loadStaff();
    }).catch(function (e) { formError(e.message); });
  });

  if (!adding) {
    $('togglePerson').addEventListener('click', function () {
      api('/staff/people/' + person.id, { method: 'PATCH',
          body: { is_active: !person.is_active } })
        .then(function () { closeSheet(); loadStaff(); })
        .catch(function (e) { formError(e.message); });
    });
  }
}

function formError(text) {
  var box = $('formError');
  if (!box) { fail(text); return; }
  box.textContent = text;
  box.hidden = false;
  box.scrollIntoView({ block: 'nearest' });
}

function openLog() {
  api('/staff/log?limit=100').then(function (rows) {
    var html = '<h2>Журнал действий</h2>'
      + '<div class="when">Кто заходил и что менял</div>';

    if (!rows.length) html += '<div class="empty">Пока пусто</div>';

    var WHAT = {
      login: 'вход по ПИНу', verify: 'вход по коду', set_pin: 'задан ПИН',
      staff_add: 'заведён сотрудник', staff_update: 'изменён доступ'
    };

    html += rows.map(function (row) {
      return '<div class="line"><span>' + timeText(row.happened_at) + ' · '
        + escape(row.phone || '') + '</span><b style="white-space:normal">'
        + escape(row.detail || WHAT[row.action] || row.action) + '</b></div>';
    }).join('');

    sheet(html);
  }).catch(function (e) { fail(e.message); });
}
