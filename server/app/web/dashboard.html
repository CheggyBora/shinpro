<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Шиномонтаж — дашборд</title>
<style>
/*
  Дашборд смотрят с телефона в конце смены и с компьютера, когда
  разбирают месяц. Поэтому верстка начинается с узкого экрана: широкий
  из неё получается сам, а обратно — никогда.
*/
:root {
  --ink: #0f172a; --ink-soft: #475569; --muted: #94a3b8;
  --line: #e2e8f0; --bg: #f1f5f9; --card: #fff;
  --brand: #2563eb; --brand-dark: #1d4ed8;
  --ok: #059669; --bad: #dc2626; --warn: #b45309;
  --radius: 16px;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  font-size: 15px; line-height: 1.45;
  padding: 0 0 90px;
}
h1, h2, h3 { margin: 0; font-weight: 700; }
button { font-family: inherit; cursor: pointer; }

.wrap { max-width: 1100px; margin: 0 auto; padding: 0 14px; }

/* --- Шапка --- */
.top {
  background: var(--card); border-bottom: 1px solid var(--line);
  padding: 12px 0; position: sticky; top: 0; z-index: 20;
}
.top .wrap { display: flex; align-items: center; gap: 10px; }
.top h1 { font-size: 17px; }
.who { margin-left: auto; font-size: 13px; color: var(--ink-soft); text-align: right; }
.who b { display: block; color: var(--ink); font-size: 14px; }

/* --- Период --- */
.period { display: flex; gap: 6px; overflow-x: auto; padding: 12px 0 4px; }
.period::-webkit-scrollbar { display: none; }
.chip {
  flex: 0 0 auto; padding: 8px 14px; border-radius: 999px;
  border: 1.5px solid var(--line); background: var(--card);
  font-size: 14px; color: var(--ink-soft);
}
.chip[aria-pressed="true"] {
  border-color: var(--brand); background: var(--brand); color: #fff; font-weight: 600;
}
.dates { display: none; gap: 8px; padding-bottom: 6px; }
.dates.on { display: flex; }
.dates input {
  flex: 1; padding: 10px; border: 1.5px solid var(--line); border-radius: 12px;
  font-size: 15px; font-family: inherit; color: var(--ink); background: var(--card);
}

/* --- Карточки --- */
.card {
  background: var(--card); border-radius: var(--radius); padding: 16px;
  margin-bottom: 12px; box-shadow: 0 1px 2px rgba(15,23,42,.05);
}
.card h2 { font-size: 15px; margin-bottom: 12px; }

.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tile { background: var(--card); border-radius: var(--radius); padding: 14px; }
.tile span { display: block; font-size: 12.5px; color: var(--ink-soft); margin-bottom: 4px; }
.tile b { font-size: 21px; font-weight: 700; letter-spacing: -.3px; }
.tile.wide { grid-column: 1 / -1; }
.tile b.ok { color: var(--ok); }
.tile b.bad { color: var(--bad); }

/* --- График по дням --- */
.bars { display: flex; align-items: flex-end; gap: 3px; height: 120px; margin-top: 6px; }
.bar { flex: 1; background: var(--brand); border-radius: 4px 4px 0 0; min-height: 2px; opacity: .85; }
.bar.zero { background: var(--line); }
.bar-labels { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); margin-top: 6px; }

/* --- Списки --- */
.row {
  display: flex; align-items: center; gap: 10px; padding: 11px 0;
  border-bottom: 1px solid var(--line); text-align: left;
  width: 100%; background: none; border-left: 0; border-right: 0; border-top: 0;
  font-size: 15px; color: var(--ink);
}
.row:last-child { border-bottom: 0; }
.row .main { flex: 1; min-width: 0; }
.row .main b { display: block; font-weight: 600; }
.row .main span { font-size: 12.5px; color: var(--ink-soft); display: block;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .money { font-weight: 700; white-space: nowrap; }
.row .money small { display: block; font-weight: 400; font-size: 11.5px;
  color: var(--ink-soft); text-align: right; }

.sub { padding: 7px 0 7px 14px; border-bottom: 1px solid var(--line);
  display: flex; gap: 10px; font-size: 13.5px; color: var(--ink-soft); }
.sub .num { width: 62px; color: var(--muted); }
.sub .plate { flex: 1; }
.sub .money { font-weight: 600; color: var(--ink); }

.tag { display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 7px;
  border-radius: 6px; background: var(--bg); color: var(--ink-soft); margin-left: 6px; }
.tag.bad { background: #fee2e2; color: var(--bad); }
.tag.warn { background: #fef3c7; color: var(--warn); }
.tag.ok { background: #d1fae5; color: var(--ok); }

.empty { text-align: center; color: var(--muted); padding: 24px 10px; font-size: 14px; }
.error { background: #fee2e2; color: #991b1b; border-radius: 12px;
  padding: 11px 13px; font-size: 14px; margin-bottom: 12px; }

/* --- Низ: разделы --- */
.tabs {
  position: fixed; bottom: 0; left: 0; right: 0; background: var(--card);
  border-top: 1px solid var(--line); display: flex; z-index: 30;
  padding-bottom: env(safe-area-inset-bottom);
}
.tabs button {
  flex: 1; border: 0; background: none; padding: 10px 2px 12px;
  font-size: 11.5px; color: var(--muted); display: flex; flex-direction: column;
  align-items: center; gap: 3px;
}
.tabs button[aria-pressed="true"] { color: var(--brand); font-weight: 700; }
.tabs svg { width: 21px; height: 21px; stroke: currentColor; fill: none;
  stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* --- Вход --- */
.login { max-width: 380px; margin: 40px auto; padding: 0 14px; }
.login .card { padding: 22px; }
.login h2 { font-size: 19px; margin-bottom: 6px; }
.login p { margin: 0 0 18px; font-size: 13.5px; color: var(--ink-soft); }
.field { margin-bottom: 14px; }
.field label { display: block; font-size: 13px; color: var(--ink-soft); margin-bottom: 5px; }
.field input {
  width: 100%; padding: 13px 14px; border: 1.5px solid var(--line);
  border-radius: 12px; font-size: 17px; font-family: inherit; color: var(--ink);
}
.field input:focus { outline: none; border-color: var(--brand); }
input.code { letter-spacing: 8px; text-align: center; font-size: 22px; font-weight: 700; }
.go {
  width: 100%; padding: 14px; border: 0; border-radius: 12px;
  background: var(--brand); color: #fff; font-size: 16px; font-weight: 600;
}
.go:disabled { background: var(--muted); }
.link { background: none; border: 0; color: var(--brand); font-size: 13.5px;
  padding: 10px 0 0; width: 100%; }

/* --- Окно наряда --- */
.sheet {
  position: fixed; inset: 0; background: rgba(15,23,42,.45); z-index: 40;
  display: flex; align-items: flex-end; justify-content: center;
}
.sheet .inner {
  background: var(--card); border-radius: 20px 20px 0 0; width: 100%;
  max-width: 560px; max-height: 88vh; overflow-y: auto; padding: 18px 16px 28px;
}
.sheet h2 { font-size: 17px; margin-bottom: 4px; }
.sheet .when { color: var(--ink-soft); font-size: 13px; margin-bottom: 14px; }
.line { display: flex; justify-content: space-between; gap: 12px; padding: 7px 0;
  font-size: 14px; border-bottom: 1px solid var(--line); }
.line span { color: var(--ink-soft); }
.line b { font-weight: 600; white-space: nowrap; }
.line.total b { font-size: 17px; }
.block-title { font-size: 12.5px; color: var(--muted); text-transform: uppercase;
  letter-spacing: .04em; margin: 16px 0 4px; }

@media (min-width: 760px) {
  body { padding-bottom: 20px; }
  .tiles { grid-template-columns: repeat(4, 1fr); }
  .tabs { position: static; border-top: 0; border-bottom: 1px solid var(--line);
    background: none; margin-bottom: 12px; }
  .tabs button { flex: 0 0 auto; flex-direction: row; padding: 10px 16px; font-size: 14px; }
  .sheet { align-items: center; }
  .sheet .inner { border-radius: 20px; max-height: 80vh; }
}
</style>
</head>
<body>

<!-- ВХОД -->
<div class="login" id="screenLogin">
  <div class="card">
    <h2 id="loginTitle">Дашборд</h2>
    <p id="loginHint">Введите телефон, по которому вас завёл владелец.</p>

    <div id="stepPhone">
      <div class="field">
        <label for="lPhone">Телефон</label>
        <input id="lPhone" type="tel" inputmode="tel" autocomplete="tel" placeholder="+7 ___ ___-__-__">
      </div>
      <button class="go" id="lNext" type="button" disabled>Продолжить</button>
    </div>

    <div id="stepPin" hidden>
      <div class="field">
        <label for="lPin">ПИН-код</label>
        <input id="lPin" class="code" inputmode="numeric" maxlength="4" autocomplete="off">
      </div>
      <button class="go" id="lPinGo" type="button" disabled>Войти</button>
      <button class="link" id="lForgot" type="button">Забыли ПИН?</button>
    </div>

    <div id="stepCode" hidden>
      <div class="field">
        <label for="lCode">Код из сообщения</label>
        <input id="lCode" class="code" inputmode="numeric" maxlength="4" autocomplete="one-time-code">
      </div>
      <button class="go" id="lCodeGo" type="button">Выслать код</button>
    </div>

    <div id="stepNewPin" hidden>
      <div class="field">
        <label for="lNewPin">Придумайте ПИН из четырёх цифр</label>
        <input id="lNewPin" class="code" inputmode="numeric" maxlength="4" autocomplete="off">
      </div>
      <button class="go" id="lNewPinGo" type="button" disabled>Сохранить</button>
    </div>

    <div class="error" id="loginError" hidden></div>
  </div>
</div>

<!-- ДАШБОРД -->
<div id="screenMain" hidden>
  <div class="top">
    <div class="wrap">
      <h1 id="shopName">Шиномонтаж</h1>
      <div class="who">
        <b id="whoName"></b>
        <button class="link" id="logout" type="button" style="width:auto;padding:0">Выйти</button>
      </div>
    </div>
  </div>

  <div class="wrap">
    <div class="period" id="period"></div>
    <div class="dates" id="dates">
      <input id="dFrom" type="date"><input id="dTo" type="date">
    </div>

    <div class="tabs" id="tabs"></div>
    <div class="error" id="mainError" hidden></div>
    <div id="view"></div>
  </div>
</div>

<div class="sheet" id="sheet" hidden><div class="inner" id="sheetBody"></div></div>

<script>
'use strict';

var $ = function (id) { return document.getElementById(id); };
var token = null;
var me = null;
var period = { key: '30', from: null, to: null };
var section = null;

// ------------------------------------------------------------------
// Мелочи
// ------------------------------------------------------------------

function money(value) {
  var number = Math.round(Number(value) || 0);
  return number.toLocaleString('ru-RU') + ' ₽';
}

function plural(count, one, few, many) {
  var n = Math.abs(count) % 100, n1 = n % 10;
  if (n > 10 && n < 20) return many;
  if (n1 > 1 && n1 < 5) return few;
  if (n1 === 1) return one;
  return many;
}

function dayText(iso) {
  var date = new Date(iso);
  return date.toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit' });
}

function timeText(iso) {
  var date = new Date(iso);
  return date.toLocaleString('ru-RU', {
    day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
}

function escape(text) {
  return String(text == null ? '' : text)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function fixPhone(text) {
  var digits = (text || '').replace(/\D/g, '');
  if (!digits) return '';
  if (digits[0] === '8') digits = '7' + digits.slice(1);
  if (digits[0] !== '7') digits = '7' + digits;
  digits = digits.slice(0, 11);
  var out = '+7';
  if (digits.length > 1) out += ' ' + digits.slice(1, 4);
  if (digits.length > 4) out += ' ' + digits.slice(4, 7);
  if (digits.length > 7) out += '-' + digits.slice(7, 9);
  if (digits.length > 9) out += '-' + digits.slice(9, 11);
  return out;
}

function api(path, options) {
  options = options || {};
  options.headers = options.headers || {};
  options.headers['Content-Type'] = 'application/json';
  if (token) options.headers['Authorization'] = 'Bearer ' + token;
  if (options.body && typeof options.body !== 'string') {
    options.body = JSON.stringify(options.body);
  }

  return fetch(path, options).then(function (answer) {
    return answer.json().catch(function () { return {}; }).then(function (data) {
      if (answer.ok) return data;

      // Права изменились или вход устарел — не делаем вид, что всё в
      // порядке, а честно возвращаем человека на вход
      if (answer.status === 401 && token) {
        forget();
        throw new Error(data.detail || 'Войдите заново');
      }

      var detail = data.detail;
      if (detail && typeof detail === 'object') detail = detail.detail;
      throw new Error(detail || 'Не получилось. Попробуйте ещё раз');
    });
  });
}

// ------------------------------------------------------------------
// Вход
// ------------------------------------------------------------------

var phoneDigits = '';

$('lPhone').addEventListener('input', function (event) {
  event.target.value = fixPhone(event.target.value);
  phoneDigits = event.target.value.replace(/\D/g, '');
  $('lNext').disabled = phoneDigits.length !== 11;
});

$('lPhone').addEventListener('focus', function (event) {
  if (!event.target.value) event.target.value = '+7 ';
});

['lPin', 'lCode', 'lNewPin'].forEach(function (id) {
  $(id).addEventListener('input', function (event) {
    event.target.value = event.target.value.replace(/\D/g, '');
    if (id === 'lPin') $('lPinGo').disabled = event.target.value.length !== 4;
    if (id === 'lNewPin') $('lNewPinGo').disabled = event.target.value.length !== 4;
    if (event.target.value.length === 4) {
      if (id === 'lPin') $('lPinGo').click();
      if (id === 'lCode') $('lCodeGo').click();
    }
  });
});

function loginStep(name) {
  ['stepPhone', 'stepPin', 'stepCode', 'stepNewPin'].forEach(function (id) {
    $(id).hidden = id !== name;
  });
  $('loginError').hidden = true;
}

function loginError(text) {
  $('loginError').textContent = text;
  $('loginError').hidden = false;
}

$('lNext').addEventListener('click', function () {
  api('/staff/start', { method: 'POST', body: { phone: phoneDigits } })
    .then(function (answer) {
      if (answer.step === 'pin') {
        loginStep('stepPin');
        $('lPin').focus();
      } else {
        loginStep('stepCode');
        sendCode();
      }
    })
    .catch(function (e) { loginError(e.message); });
});

function sendCode() {
  $('lCodeGo').textContent = 'Отправляем…';
  api('/staff/code', { method: 'POST', body: { phone: phoneDigits } })
    .then(function () {
      $('lCodeGo').textContent = 'Войти';
      $('lCode').focus();
    })
    .catch(function (e) {
      $('lCodeGo').textContent = 'Выслать код снова';
      loginError(e.message);
    });
}

$('lCodeGo').addEventListener('click', function () {
  var code = $('lCode').value;
  if (code.length !== 4) { sendCode(); return; }

  api('/staff/verify', { method: 'POST', body: { phone: phoneDigits, code: code } })
    .then(function (answer) {
      token = answer.token;
      me = answer.staff;
      if (me.pin_is_set) { start(); return; }
      loginStep('stepNewPin');
      $('lNewPin').focus();
    })
    .catch(function (e) { $('lCode').value = ''; loginError(e.message); });
});

$('lPinGo').addEventListener('click', function () {
  api('/staff/login', { method: 'POST',
                        body: { phone: phoneDigits, pin: $('lPin').value } })
    .then(function (answer) {
      token = answer.token;
      me = answer.staff;
      start();
    })
    .catch(function (e) { $('lPin').value = ''; $('lPinGo').disabled = true;
                          loginError(e.message); });
});

$('lNewPinGo').addEventListener('click', function () {
  api('/staff/pin', { method: 'POST', body: { pin: $('lNewPin').value } })
    .then(function (answer) {
      token = answer.token;
      me = answer.staff;
      start();
    })
    .catch(function (e) { $('lNewPin').value = ''; loginError(e.message); });
});

$('lForgot').addEventListener('click', function () {
  loginStep('stepCode');
  sendCode();
});

$('logout').addEventListener('click', function () { forget(); });

function forget() {
  token = null;
  me = null;
  try { localStorage.removeItem('staffToken'); } catch (e) {}
  $('screenMain').hidden = true;
  $('screenLogin').hidden = false;
  loginStep('stepPhone');
  $('lPin').value = '';
  $('lCode').value = '';
}

function remember() {
  try { localStorage.setItem('staffToken', token); } catch (e) {}
}

// ------------------------------------------------------------------
// Разделы
// ------------------------------------------------------------------

var ICONS = {
  summary: '<path d="M3 3v18h18"/><path d="M7 15l4-5 3 3 5-7"/>',
  services: '<path d="M4 6h16M4 12h16M4 18h10"/>',
  masters: '<circle cx="9" cy="8" r="3"/><path d="M3 20c0-3 3-5 6-5s6 2 6 5"/><path d="M17 11h4M19 9v4"/>',
  orders: '<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/>',
  shifts: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>'
};

function sections() {
  var list = [];
  var can = function (name) { return me.permissions.indexOf(name) >= 0; };

  if (can('revenue')) {
    list.push({ key: 'summary', title: 'Сводка' });
    list.push({ key: 'services', title: 'Услуги' });
  }
  if (can('salary_all')) list.push({ key: 'masters', title: 'Мастера' });
  if (can('orders') || can('salary_own')) list.push({ key: 'orders', title: 'Наряды' });
  if (can('salary_all') || can('salary_own')) list.push({ key: 'shifts', title: 'Смены' });

  return list;
}

function drawTabs() {
  var list = sections();
  $('tabs').innerHTML = list.map(function (item) {
    return '<button type="button" data-key="' + item.key + '" aria-pressed="'
      + (item.key === section) + '"><svg viewBox="0 0 24 24">' + ICONS[item.key]
      + '</svg>' + item.title + '</button>';
  }).join('');

  [].slice.call($('tabs').querySelectorAll('button')).forEach(function (button) {
    button.addEventListener('click', function () {
      section = button.getAttribute('data-key');
      drawTabs();
      load();
    });
  });
}

var PERIODS = [
  { key: 'today', title: 'Сегодня' },
  { key: 'yesterday', title: 'Вчера' },
  { key: '7', title: 'Неделя' },
  { key: '30', title: 'Месяц' },
  { key: 'custom', title: 'Свой период' }
];

function drawPeriod() {
  $('period').innerHTML = PERIODS.map(function (item) {
    return '<button class="chip" type="button" data-key="' + item.key
      + '" aria-pressed="' + (item.key === period.key) + '">' + item.title + '</button>';
  }).join('');

  [].slice.call($('period').querySelectorAll('button')).forEach(function (button) {
    button.addEventListener('click', function () {
      period.key = button.getAttribute('data-key');
      applyPeriod();
      drawPeriod();
      $('dates').className = 'dates' + (period.key === 'custom' ? ' on' : '');
      load();
    });
  });
}

function applyPeriod() {
  var today = new Date();
  var iso = function (date) { return date.toISOString().slice(0, 10); };

  if (period.key === 'today') { period.from = period.to = iso(today); }
  else if (period.key === 'yesterday') {
    var day = new Date(today); day.setDate(day.getDate() - 1);
    period.from = period.to = iso(day);
  }
  else if (period.key === '7' || period.key === '30') {
    var back = new Date(today);
    back.setDate(back.getDate() - (period.key === '7' ? 6 : 29));
    period.from = iso(back); period.to = iso(today);
  }
  else {
    period.from = $('dFrom').value || period.from;
    period.to = $('dTo').value || period.to;
  }

  $('dFrom').value = period.from;
  $('dTo').value = period.to;
}

['dFrom', 'dTo'].forEach(function (id) {
  $(id).addEventListener('change', function () {
    period.key = 'custom';
    period.from = $('dFrom').value;
    period.to = $('dTo').value;
    drawPeriod();
    load();
  });
});

function query(path) {
  var join = path.indexOf('?') >= 0 ? '&' : '?';
  return path + join + 'from=' + period.from + '&to=' + period.to;
}

// ------------------------------------------------------------------
// Отрисовка разделов
// ------------------------------------------------------------------

function show(html) { $('view').innerHTML = html; }

function fail(text) {
  $('mainError').textContent = text;
  $('mainError').hidden = false;
}

function load() {
  $('mainError').hidden = true;
  show('<div class="empty">Загружаем…</div>');

  if (section === 'summary') return loadSummary();
  if (section === 'services') return loadServices();
  if (section === 'masters') return loadMasters();
  if (section === 'orders') return loadOrders();
  if (section === 'shifts') return loadShifts();
}

function loadSummary() {
  Promise.all([
    api(query('/dashboard/summary')),
    api('/dashboard/shifts/current')
  ]).then(function (answers) {
    var data = answers[0], now = answers[1];
    var html = '';

    if (now.queue) {
      var q = now.queue;
      html += '<div class="card"><h2>Сейчас в цеху</h2>'
        + '<div class="line"><span>В работе</span><b>' + q.cars_in_work + '</b></div>'
        + '<div class="line"><span>Ждут</span><b>' + q.cars_waiting + '</b></div>'
        + '<div class="line"><span>Открыто постов</span><b>' + q.open_posts + '</b></div>'
        + '<div class="line"><span>Данные получены</span><b>' + timeText(q.taken_at) + '</b></div>'
        + '</div>';
    }

    html += '<div class="tiles">'
      + tile('Выручка', money(data.net_revenue), 'wide', data.net_revenue > 0 ? 'ok' : '')
      + tile('Машин', data.cars + (data.warranty_cars
             ? ' <span class="tag warn">' + data.warranty_cars + ' по гарантии</span>' : ''))
      + tile('Средний чек', money(data.average_check))
      + tile('Наличные', money(data.cash))
      + tile('Карта', money(data.card))
      + tile('Зарплата', money(data.salary))
      + tile('Расходники', money(data.consumables))
      + (data.refunded ? tile('Возвраты', money(data.refunded), '', 'bad') : '')
      + tile('Осталось цеху', money(data.left), 'wide')
      + '</div>';

    html += '<div class="card"><h2>Выручка по дням</h2>' + bars(data.by_day) + '</div>';
    show(html);
  }).catch(function (e) { show(''); fail(e.message); });
}

function tile(title, value, extra, color) {
  return '<div class="tile ' + (extra || '') + '"><span>' + title + '</span><b class="'
    + (color || '') + '">' + value + '</b></div>';
}

function bars(days) {
  if (!days || !days.length) return '<div class="empty">Нет данных</div>';

  var top = Math.max.apply(null, days.map(function (row) {
    return Math.max(row.revenue, 0);
  })) || 1;

  var html = '<div class="bars">' + days.map(function (row) {
    var height = Math.max(2, Math.round(Math.max(row.revenue, 0) / top * 118));
    return '<div class="bar' + (row.revenue > 0 ? '' : ' zero') + '" style="height:'
      + height + 'px" title="' + dayText(row.day) + ': ' + money(row.revenue) + '"></div>';
  }).join('') + '</div>';

  return html + '<div class="bar-labels"><span>' + dayText(days[0].day)
    + '</span><span>' + money(top) + '</span><span>'
    + dayText(days[days.length - 1].day) + '</span></div>';
}

function loadServices() {
  api(query('/dashboard/services')).then(function (rows) {
    if (!rows.length) return show('<div class="empty">За этот период услуг не было</div>');

    show('<div class="card"><h2>Что продавалось</h2>' + rows.map(function (row) {
      return '<div class="row"><div class="main"><b>' + escape(row.service_name)
        + '</b><span>' + row.quantity + ' ' + plural(row.quantity, 'раз', 'раза', 'раз')
        + ' · ' + row.share + '%</span></div>'
        + '<div class="money">' + money(row.amount) + '</div></div>';
    }).join('') + '</div>');
  }).catch(function (e) { show(''); fail(e.message); });
}

function loadMasters() {
  api(query('/dashboard/masters')).then(function (rows) {
    if (!rows.length) return show('<div class="empty">За этот период начислений не было</div>');

    show('<div class="card"><h2>Мастера</h2>' + rows.map(function (row) {
      return '<button class="row" type="button" data-master="' + row.employee_shop_id + '">'
        + '<div class="main"><b>' + escape(row.title) + '</b><span>'
        + row.orders + ' ' + plural(row.orders, 'наряд', 'наряда', 'нарядов')
        + ' · выработка ' + money(row.revenue)
        + (row.salary_percent ? ' · ' + row.salary_percent + '%' : '') + '</span></div>'
        + '<div class="money">' + money(row.salary) + '</div></button>';
    }).join('') + '</div>');

    [].slice.call($('view').querySelectorAll('[data-master]')).forEach(function (button) {
      button.addEventListener('click', function () {
        loadOrders(button.getAttribute('data-master'));
      });
    });
  }).catch(function (e) { show(''); fail(e.message); });
}

function loadOrders(masterId) {
  var path = '/dashboard/orders';
  if (masterId) path += '?employee_shop_id=' + masterId;

  api(query(path)).then(function (rows) {
    if (!rows.length) return show('<div class="empty">За этот период нарядов нет</div>');

    show('<div class="card"><h2>Наряды' + (masterId ? ' мастера' : '') + '</h2>'
      + rows.map(function (row) {
        var tags = '';
        if (row.is_warranty) tags += '<span class="tag warn">гарантия</span>';
        if (row.refunded_amount) tags += '<span class="tag bad">возврат</span>';

        return '<button class="row" type="button" data-order="' + row.shop_id + '">'
          + '<div class="main"><b>' + escape(row.license_plate || '—') + tags + '</b>'
          + '<span>№' + row.shop_id + ' · ' + timeText(row.visited_at)
          + (row.masters.length ? ' · ' + escape(row.masters.join(', ')) : '')
          + '</span></div>'
          + '<div class="money">' + money(row.total_amount)
          + '<small>' + (row.payment_method === 'card' ? 'карта' : 'наличные')
          + '</small></div></button>';
      }).join('') + '</div>');

    [].slice.call($('view').querySelectorAll('[data-order]')).forEach(function (button) {
      button.addEventListener('click', function () {
        openOrder(button.getAttribute('data-order'));
      });
    });
  }).catch(function (e) { show(''); fail(e.message); });
}

function loadShifts() {
  api(query('/dashboard/shifts')).then(function (rows) {
    if (!rows.length) return show('<div class="empty">За этот период смен не было</div>');

    show('<div class="card"><h2>Смены</h2>' + rows.map(function (row) {
      var open = row.status !== 'closed';
      return '<button class="row" type="button" data-shift="' + row.shop_id + '">'
        + '<div class="main"><b>' + timeText(row.started_at)
        + (open ? '<span class="tag ok">идёт</span>' : '') + '</b>'
        + '<span>' + row.open_posts + ' '
        + plural(row.open_posts, 'пост', 'поста', 'постов')
        + (row.ended_at ? ' · до ' + timeText(row.ended_at) : '') + '</span></div>'
        + '<div class="money">' + money(row.total_salary)
        + '<small>начислено</small></div></button>';
    }).join('') + '</div>');

    [].slice.call($('view').querySelectorAll('[data-shift]')).forEach(function (button) {
      button.addEventListener('click', function () {
        openShift(button.getAttribute('data-shift'));
      });
    });
  }).catch(function (e) { show(''); fail(e.message); });
}

// ------------------------------------------------------------------
// Окна: наряд и начисления за смену
// ------------------------------------------------------------------

function sheet(html) {
  $('sheetBody').innerHTML = html
    + '<button class="go" type="button" id="sheetClose" style="margin-top:18px">Закрыть</button>';
  $('sheet').hidden = false;
  $('sheetClose').addEventListener('click', closeSheet);
}

function closeSheet() { $('sheet').hidden = true; }

$('sheet').addEventListener('click', function (event) {
  if (event.target === $('sheet')) closeSheet();
});

function openOrder(id) {
  api('/dashboard/orders/' + id).then(function (card) {
    var html = '<h2>' + escape(card.license_plate || '—') + '</h2>'
      + '<div class="when">Наряд №' + card.shop_id + ' · ' + timeText(card.visited_at)
      + (card.is_deleted ? ' · <span class="tag bad">удалён</span>' : '') + '</div>';

    html += '<div class="block-title">Работы</div>';
    html += card.items.map(function (item) {
      return '<div class="line"><span>' + escape(item.service_name)
        + (item.quantity > 1 ? ' × ' + item.quantity : '')
        + (item.discount_percent ? ' · −' + item.discount_percent + '%' : '')
        + '</span><b>' + money(item.total) + '</b></div>';
    }).join('');

    html += '<div class="line total"><span>Итого</span><b>'
      + money(card.total_amount) + '</b></div>';

    if (card.refunded_amount) {
      html += '<div class="line"><span>Возврат'
        + (card.refund_reason ? ': ' + escape(card.refund_reason) : '')
        + '</span><b>−' + money(card.refunded_amount) + '</b></div>';
    }

    if (card.accruals && card.accruals.length) {
      html += '<div class="block-title">Как посчитана зарплата</div>';
      html += '<div class="line"><span>Сумма наряда</span><b>'
        + money(card.total_amount) + '</b></div>';
      html += '<div class="line"><span>Расходники</span><b>−'
        + money(card.consumables_amount) + '</b></div>';
      html += '<div class="line"><span>База для начисления</span><b>'
        + money(card.salary_base) + '</b></div>';
      html += card.accruals.map(function (row) {
        return '<div class="line"><span>' + escape(row.title) + '</span><b>'
          + money(row.amount) + '</b></div>';
      }).join('');
    }

    html += '<div class="block-title">Ещё</div>';
    html += '<div class="line"><span>Оплата</span><b>'
      + (card.payment_method === 'card' ? 'Карта' : 'Наличные') + '</b></div>';
    if (card.actual_minutes != null) {
      html += '<div class="line"><span>Время работы</span><b>' + card.actual_minutes
        + ' мин' + (card.planned_minutes ? ' из ' + card.planned_minutes : '')
        + '</b></div>';
    }
    if (card.recommendations) {
      html += '<div class="line"><span>Рекомендации мастера</span><b style="white-space:normal">'
        + escape(card.recommendations) + '</b></div>';
    }

    sheet(html);
  }).catch(function (e) { fail(e.message); });
}

function openShift(id) {
  api('/dashboard/shifts/' + id + '/salary').then(function (data) {
    var html = '<h2>Начисления за смену</h2><div class="when">'
      + (data.shift.started_at ? timeText(data.shift.started_at) : '')
      + (data.is_final ? '' : ' · смена идёт, сумма ещё вырастет') + '</div>';

    if (!data.employees.length) {
      html += '<div class="empty">Пока нет начислений</div>';
    }

    html += data.employees.map(function (person) {
      return '<div class="row"><div class="main"><b>' + escape(person.title) + '</b>'
        + '<span>' + person.orders.length + ' '
        + plural(person.orders.length, 'наряд', 'наряда', 'нарядов') + '</span></div>'
        + '<div class="money">' + money(person.salary) + '</div></div>'
        + person.orders.map(function (row) {
          return '<button class="sub" type="button" data-order="' + row.order_id + '">'
            + '<span class="num">№' + row.order_id + '</span>'
            + '<span class="plate">' + escape(row.license_plate || '—') + '</span>'
            + '<span class="money">' + money(row.amount) + '</span></button>';
        }).join('');
    }).join('');

    html += '<div class="line total"><span>Всего за смену</span><b>'
      + money(data.total) + '</b></div>';

    sheet(html);

    [].slice.call($('sheetBody').querySelectorAll('[data-order]')).forEach(function (button) {
      button.addEventListener('click', function () {
        openOrder(button.getAttribute('data-order'));
      });
    });
  }).catch(function (e) { fail(e.message); });
}

// ------------------------------------------------------------------
// Запуск
// ------------------------------------------------------------------

function start() {
  remember();
  $('screenLogin').hidden = true;
  $('screenMain').hidden = false;

  $('whoName').textContent = me.name || me.phone;
  $('whoName').title = me.role_title;

  var list = sections();
  if (!list.length) {
    $('tabs').innerHTML = '';
    show('<div class="empty">Вам пока не открыт ни один раздел.<br>'
      + 'Попросите владельца выдать права.</div>');
    return;
  }

  section = list[0].key;
  applyPeriod();
  drawPeriod();
  drawTabs();
  load();
}

fetch('/public/info').then(function (answer) { return answer.json(); })
  .then(function (info) {
    if (info && info.shop_name) $('shopName').textContent = info.shop_name;
  })
  .catch(function () {});

try {
  var saved = localStorage.getItem('staffToken');
  if (saved) {
    token = saved;
    api('/staff/me').then(function (answer) { me = answer; start(); })
      .catch(function () { forget(); });
  }
} catch (e) {}
</script>
