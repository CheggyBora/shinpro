function sheet(html) {
  $('sheetBody').innerHTML = html
    + '<button class="go" type="button" id="sheetClose" style="margin-top:18px">Закрыть</button>';
  $('sheet').hidden = false;
  $('sheetClose').addEventListener('click', closeSheet);
}

function closeSheet() { $('sheet').hidden = true; }

$('sheet').addEventListener('click', function (event) {
  if (event.target === $('sheet')) closeSheet();
});

function openOrder(id, shopId) {
  api(withShop('/dashboard/orders/' + id, shopId)).then(function (card) {
    var html = '<h2>' + escape(card.license_plate || '—') + '</h2>'
      + '<div class="when">Наряд №' + card.local_id + ' · ' + timeText(card.visited_at)
      + (card.is_deleted ? ' · <span class="tag bad">удалён</span>' : '') + '</div>';

    // Обложка: щелчок — снимок целиком в новой вкладке
    if (card.cover_url) {
      html += '<a class="cover-link" href="' + escape(card.cover_url)
        + '" target="_blank" rel="noopener"><img class="cover-lg" alt="Машина при приезде" src="'
        + escape(card.cover_url) + '"></a>';
    }

    // Смешанный наряд: у каждой строки метка направления, у мойки — кто
    // мыл. Деньги наряда на дашборде делятся именно по этим строкам
    var mixed = (card.directions || []).length > 1;
    var tag = function (key) {
      return mixed ? '<span class="dir ' + (key === 'wash' ? 'wash' : 'tire') + '">'
        + (STOCK_DIR_TAGS[key] || 'шинка') + '</span>' : '';
    };

    html += '<div class="block-title">Работы</div>';
    html += card.items.map(function (item) {
      return '<div class="line"><span>' + tag(item.direction) + escape(item.service_name)
        + (item.quantity > 1 ? ' × ' + item.quantity : '')
        + (item.discount_percent ? ' · −' + item.discount_percent + '%' : '')
        + (item.direction === 'wash' && item.employee_title
           ? ' · ' + escape(item.employee_title) : '')
        + '</span><b>' + money(item.total) + '</b></div>';
    }).join('');

    html += '<div class="line total"><span>Итого</span><b>'
      + money(card.total_amount) + '</b></div>';

    if (card.refunded_amount) {
      html += '<div class="line"><span>Возврат'
        + (card.refund_reason ? ': ' + escape(card.refund_reason) : '')
        + '</span><b>−' + money(card.refunded_amount) + '</b></div>';
    }

    if (card.accruals && card.accruals.length) {
      html += '<div class="block-title">Как посчитана зарплата</div>';
      html += '<div class="line"><span>Сумма наряда</span><b>'
        + money(card.total_amount) + '</b></div>';
      html += '<div class="line"><span>Расходники</span><b>−'
        + money(card.consumables_amount) + '</b></div>';
      html += '<div class="line"><span>База для начисления</span><b>'
        + money(card.salary_base) + '</b></div>';
      html += card.accruals.map(function (row) {
        return '<div class="line"><span>' + tag(row.direction) + escape(row.title)
          + '</span><b>' + money(row.amount) + '</b></div>';
      }).join('');
    }

    html += '<div class="block-title">Ещё</div>';
    html += '<div class="line"><span>Оплата</span><b>'
      + (card.payment_method === 'card' ? 'Карта' : 'Наличные') + '</b></div>';
    if (card.actual_minutes != null) {
      html += '<div class="line"><span>Время работы</span><b>' + card.actual_minutes
        + ' мин' + (card.planned_minutes ? ' из ' + card.planned_minutes : '')
        + '</b></div>';
    }
    if (card.recommendations) {
      html += '<div class="line"><span>Рекомендации мастера</span><b style="white-space:normal">'
        + escape(card.recommendations) + '</b></div>';
    }

    sheet(html);
  }).catch(function (e) { fail(e.message); });
}

function openShift(id, shopId) {
  api(withDir(withShop('/dashboard/shifts/' + id + '/salary', shopId))).then(function (data) {
    var html = '<h2>Начисления за смену'
      + (dashDir() ? ' · ' + DIR_TITLES[dashDir()].toLowerCase() : '')
      + '</h2><div class="when">'
      + (data.shift.started_at ? timeText(data.shift.started_at) : '')
      + (data.is_final ? '' : ' · смена идёт, сумма ещё вырастет') + '</div>';

    if (!data.employees.length) {
      html += '<div class="empty">Пока нет начислений</div>';
    }

    html += data.employees.map(function (person) {
      return '<div class="row"><div class="main"><b>' + escape(person.title) + '</b>'
        + '<span>' + person.orders.length + ' '
        + plural(person.orders.length, 'наряд', 'наряда', 'нарядов') + '</span></div>'
        + '<div class="money">' + money(person.salary) + '</div></div>'
        + person.orders.map(function (row) {
          return '<button class="sub" type="button" data-order="' + row.order_id + '">'
            + '<span class="num">№' + row.order_id + '</span>'
            + '<span class="plate">' + escape(row.license_plate || '—') + '</span>'
            + '<span class="money">' + money(row.amount) + '</span></button>';
        }).join('');
    }).join('');

    html += '<div class="line total"><span>Всего за смену</span><b>'
      + money(data.total) + '</b></div>';

    sheet(html);

    [].slice.call($('sheetBody').querySelectorAll('[data-order]')).forEach(function (button) {
      button.addEventListener('click', function () {
        // Наряды смены — той же точки, что и смена
        openOrder(button.getAttribute('data-order'), shopId);
      });
    });
  }).catch(function (e) { fail(e.message); });
}

// ------------------------------------------------------------------
// Календарь задач
// ------------------------------------------------------------------
//
// Тот же календарь, что в цеху (docs/calendar.md): неделя сверху,
// задачи выбранного дня ниже. Задача, поставленная здесь, уезжает в цех
// ближайшим обменом. Неотмеченные прошлых дней висят красными сверху
// сегодняшнего дня, пока их не отметят.

// Календарь у шиномонтажа и мойки один (docs/calendar.md, «Мойка»): у
// каждой задачи метка направления, сверху фильтр «Направление». Разделы
// у мойки свои: хранение и покраска ей ни к чему
var CATS_BY_DIR = {
  tire: [
    { key: 'work', title: 'Рабочая' },
    { key: 'storage', title: 'Хранение' },
    { key: 'tires', title: 'Шины' },
    { key: 'paint', title: 'Покраска' }
  ],
  wash: [
    { key: 'work', title: 'Рабочая' },
    { key: 'supply', title: 'Поставки' }
  ],
  // «Все» направления — все разделы обоих, «Рабочая» одна на двоих
  all: [
    { key: 'work', title: 'Рабочая' },
    { key: 'storage', title: 'Хранение' },
    { key: 'tires', title: 'Шины' },
    { key: 'paint', title: 'Покраска' },
    { key: 'supply', title: 'Поставки' }
  ]
};
var DIRS = [{ key: 'tire', title: 'Шиномонтаж' }, { key: 'wash', title: 'Мойка' }];
var DIR_TAGS = { tire: 'ШИНОМОНТАЖ', wash: 'МОЙКА' };
var DIR_TITLES = { tire: 'Шиномонтаж', wash: 'Мойка' };
var CAT_TITLES = { work: 'Рабочая', storage: 'Хранение', tires: 'Шины', paint: 'Покраска',
                   supply: 'Поставки' };
var SOURCE_TITLES = { shop: 'в цеху', dashboard: 'в дашборде', auto: 'программой',
                      cabinet: 'из кабинета клиента' };
var WEEKDAYS = ['пн', 'вт', 'ср', 'чт', 'пт', 'сб', 'вс'];
var WEEKDAYS_FULL = ['Понедельник', 'Вторник', 'Среда', 'Четверг', 'Пятница',
                     'Суббота', 'Воскресенье'];
var MONTHS = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля',
              'августа', 'сентября', 'октября', 'ноября', 'декабря'];

// direction — фильтр «Направление»: all, tire или wash. Задачи сервер
// отдаёт обоих направлений сразу, фильтруем здесь: переключение фильтра
// не ждёт сети. people — контрагенты по направлениям, для формы задачи
// view — месяц, неделя или день; открывается всегда на месяце
var cal = { start: null, day: null, today: null, filter: [], data: null,
            people: {}, direction: 'all', wash: false, view: 'month',
            hours: { from: 9, to: 21 },
            filters: { all: [], tire: [], wash: [] } };
var VIEWS = [{ key: 'month', title: 'Месяц' }, { key: 'week', title: 'Неделя' },
             { key: 'day', title: 'День' }];
var MONTHS_NOM = ['Январь', 'Февраль', 'Март', 'Апрель', 'Май', 'Июнь', 'Июль', 'Август',
                  'Сентябрь', 'Октябрь', 'Ноябрь', 'Декабрь'];
// Высота часа на сетке недели и дня, пикселей
var HOUR_PX = 44;
// Задача без «до» на сетке — полчаса
var DEFAULT_MINUTES = 30;

// Направление, по которому показываем. Мойка выключена — календарь как
// раньше, только шиномонтаж: фильтра «Направление» тогда не видно
function calDir() { return cal.wash ? cal.direction : 'tire'; }

function calCats(direction) { return CATS_BY_DIR[direction || calDir()] || CATS_BY_DIR.tire; }

// Под каким ключом помнить фильтр разделов. У шиномонтажа — прежний
// ключ: фильтр, выбранный до появления мойки, не должен пропасть
var FILTER_KEYS = { all: 'calFilterAll', tire: 'calFilter', wash: 'calFilterWash' };

// Фильтры запоминаем на этом устройстве, у каждого направления свой:
// владелец, которому нужен только склад, не должен выбирать его заново
// при каждом входе, а «Поставки» мойки — не сбрасывать его фильтр
// шиномонтажа
Object.keys(FILTER_KEYS).forEach(function (dir) {
  try {
    var saved = JSON.parse(localStorage.getItem(FILTER_KEYS[dir]) || '[]');
    if (Array.isArray(saved)) {
      // «note» — фильтр «Комментарии», он есть у любого направления
      var keys = calCats(dir).map(function (item) { return item.key; }).concat(['note']);
      cal.filters[dir] = saved.filter(function (key) { return keys.indexOf(key) >= 0; });
    }
  } catch (e) {}
});
try {
  var savedDir = localStorage.getItem('calDirection');
  if (savedDir === 'tire' || savedDir === 'wash') cal.direction = savedDir;
} catch (e) {}

function setDirection(direction) {
  cal.direction = direction;
  try { localStorage.setItem('calDirection', direction); } catch (e) {}
}

function calFilter() { return cal.filters[calDir()] || []; }

// Метка направления у задачи — только когда мойка есть: без неё всё
// шиномонтаж, и метка была бы шумом
function dirTag(direction) {
  if (!cal.wash) return '';
  var key = direction === 'wash' ? 'wash' : 'tire';
  return '<span class="dir ' + key + '">' + DIR_TAGS[key] + '</span>';
}

// Контрагенты направления: у мойки свои поставщики. Спрашиваем один раз
// на направление и точку; при каждом открытии календаря — заново:
// цех мог завести нового поставщика
function loadPeople(direction) {
  var key = direction + '|' + (currentShop || '');
  if (cal.people[key]) return Promise.resolve(cal.people[key]);
  return api(withShop('/dashboard/counterparties?direction=' + direction))
    .then(function (rows) {
      cal.people[key] = rows || [];
      return cal.people[key];
    });
}

function pad(n) { return (n < 10 ? '0' : '') + n; }

// Даты считаем строками «2026-10-27» и собираем из частей, а не через
// toISOString: тот отдаёт всемирное время, и поздно вечером «сегодня»
// превращалось бы во «вчера»
function isoDay(date) {
  return date.getFullYear() + '-' + pad(date.getMonth() + 1) + '-' + pad(date.getDate());
}
function parseDay(text) {
  var parts = String(text).split('-');
  return new Date(+parts[0], +parts[1] - 1, +parts[2]);
}
function addDays(text, count) {
  var date = parseDay(text);
  date.setDate(date.getDate() + count);
  return isoDay(date);
}
function mondayOf(text) {
  var date = parseDay(text);
  date.setDate(date.getDate() - (date.getDay() + 6) % 7);
  return isoDay(date);
}
function weekdayIndex(text) { return (parseDay(text).getDay() + 6) % 7; }
function shortDay(text) { return text.slice(8, 10) + '.' + text.slice(5, 7); }
function longDay(text) {
  var date = parseDay(text);
  return WEEKDAYS_FULL[weekdayIndex(text)] + ', ' + date.getDate() + ' ' + MONTHS[date.getMonth()];
}
// Время с сервера — московское без пояса: показываем как есть, не
// пересчитывая в пояс браузера
function stampText(iso) {
  return iso ? shortDay(iso.slice(0, 10)) + ' ' + iso.slice(11, 16) : '';
}
function attr(text) { return escape(text).replace(/"/g, '&quot;'); }

// Видна ли задача при выбранных направлении и разделах. Тот же отбор —
// и у просроченных: иначе фильтр «Мойка» показывал бы красные задачи
// шиномонтажа
function calShown(task) {
  var dir = calDir();
  if (dir !== 'all' && (task.direction || 'tire') !== dir) return false;
  var filter = calFilter();
  return !filter.length || filter.indexOf(isNote(task) ? 'note' : task.category) >= 0;
}

// Комментарий — просто запись на день: без галочки, не просрочивается
function isNote(task) { return task.kind === 'note'; }

function timeText(task) {
  return task.due_time ? task.due_time + (task.end_time ? '–' + task.end_time : '') : '';
}

function calShopName(id) {
  var shop = shops.filter(function (row) { return String(row.id) === String(id); })[0];
  return shop ? shop.name : '';
}

// Какие дни показывать: месяц — целыми неделями с понедельника
function calRange() {
  if (cal.view === 'day') return { from: cal.day, to: cal.day };
  if (cal.view === 'week') {
    var monday = mondayOf(cal.day);
    return { from: monday, to: addDays(monday, 6) };
  }
  var first = cal.day.slice(0, 8) + '01';
  var date = parseDay(first);
  var next = isoDay(new Date(date.getFullYear(), date.getMonth() + 1, 1));
  var from = mondayOf(first);
  var days = Math.round((parseDay(next) - parseDay(from)) / 86400000);
  var weeks = Math.ceil(days / 7);
  return { from: from, to: addDays(from, weeks * 7 - 1), weeks: weeks, first: first };
}

function loadCalendar() {
  var local = isoDay(new Date());
  cal.today = cal.today || local;
  cal.day = cal.day || cal.today;
  var range = calRange();
  cal.start = range.from;

  // Обоих направлений сразу: фильтр «Направление» — здесь, в браузере
  var path = '/dashboard/tasks?from=' + range.from + '&to=' + range.to + '&direction=all';
  cal.people = {};
  api(withShop(path))
    .then(function (answer) {
      if (section !== 'calendar') return;
      // Мойку на точке выключили (или выбрали точку без неё) — фильтра
      // «Направление» не видно, и календарь показывает шиномонтаж
      // (calDir), а запомненный выбор ждёт, когда мойка вернётся
      cal.wash = !!answer.wash_enabled;
      cal.data = answer;
      if (answer.hours) cal.hours = answer.hours;
      // «Сегодня» — по часам сервера: он считает по Москве, а телефон
      // владельца может быть где угодно
      if (cal.data.today) cal.today = cal.data.today;
      drawCalendar();
    })
    .catch(function (e) { show(''); fail(e.message); });
}

function calAll() {
  var data = cal.data || { tasks: [], overdue: [] };
  return data.tasks.concat(data.overdue);
}

function calFind(uid) {
  return calAll().filter(function (task) { return task.uid === uid; })[0];
}

function calOfDay(day) {
  return (cal.data ? cal.data.tasks : []).filter(function (task) {
    return task.due_date === day && calShown(task);
  });
}

function isLate(task) { return !isNote(task) && !task.done_at && task.due_date < cal.today; }

function itemClass(task) {
  if (isNote(task)) return 'note';
  if (task.done_at) return 'done';
  if (isLate(task)) return 'late';
  return 'c-' + task.category;
}

function dotClass(task) {
  if (isNote(task)) return 'dot-note';
  if (task.done_at) return 'dot-done';
  return isLate(task) ? 'late' : 'dot-' + task.category;
}

function shortText(task) {
  if (isNote(task)) return '✎ ' + task.title;
  return (task.due_time ? task.due_time + ' ' : '') + task.title;
}

function calTitle(range) {
  if (cal.view === 'day') return longDay(cal.day);
  if (cal.view === 'month') {
    var first = parseDay(range.first);
    return MONTHS_NOM[first.getMonth()] + ' ' + first.getFullYear();
  }
  var startDate = parseDay(range.from), endDate = parseDay(range.to);
  return startDate.getDate()
    + (startDate.getMonth() !== endDate.getMonth() ? ' ' + MONTHS[startDate.getMonth()] : '')
    + ' – ' + endDate.getDate() + ' ' + MONTHS[endDate.getMonth()];
}

// Список дня: сегодня сверху ещё и неотмеченные прошлых дней
function dayRows(day) {
  var rows = '';
  if (day === cal.today) {
    rows += cal.data.overdue.filter(calShown).map(function (task) {
      return taskRow(task, true, day);
    }).join('');
  }
  rows += calOfDay(day).map(function (task) {
    return taskRow(task, isLate(task), day);
  }).join('');
  return rows || '<div class="empty">Записей нет</div>';
}

function monthHtml(range) {
  var month = range.first.slice(0, 7);
  var html = '<div class="cal-split"><div class="card"><div class="month" id="calMonth">'
    + WEEKDAYS.map(function (name) { return '<div class="wd">' + name + '</div>'; }).join('');
  for (var i = 0; i < range.weeks * 7; i++) {
    var day = addDays(range.from, i);
    var items = calOfDay(day);
    var classes = ['cell'];
    if (day.slice(0, 7) !== month) classes.push('other');
    if (day === cal.today) classes.push('today');
    html += '<button type="button" class="' + classes.join(' ') + '" data-day="' + day
      + '" aria-pressed="' + (day === cal.day) + '"><b>' + parseDay(day).getDate() + '</b>'
      + items.slice(0, 3).map(function (task) {
        return '<span class="it ' + itemClass(task) + '">' + escape(shortText(task)) + '</span>';
      }).join('')
      + (items.length > 3 ? '<span class="more">ещё ' + (items.length - 3) + '</span>' : '')
      + '<span class="dots">' + items.slice(0, 4).map(function (task) {
        return '<i class="' + dotClass(task) + '"></i>';
      }).join('') + '</span></button>';
  }
  html += '</div><p class="note">Двойной щелчок по дню — день по часам</p></div>'
    + '<div class="card"><div class="day-title">' + longDay(cal.day) + '</div>'
    + dayRows(cal.day) + '</div></div>';
  return html;
}

function minutesOf(text) {
  var parts = text.split(':');
  return (+parts[0]) * 60 + (+parts[1]);
}

function endOf(task) {
  return task.end_time ? minutesOf(task.end_time) : minutesOf(task.due_time) + DEFAULT_MINUTES;
}

// Записи в одно время — рядом, а не друг на друге
function lanes(tasks) {
  var items = tasks.slice().sort(function (a, b) {
    return minutesOf(a.due_time) - minutesOf(b.due_time);
  });
  var result = [], group = [], ends = [], groupEnd = -1;
  function flush() {
    var count = 0;
    group.forEach(function (item) { count = Math.max(count, item.lane + 1); });
    group.forEach(function (item) { item.lanes = count; result.push(item); });
  }
  items.forEach(function (task) {
    var start = minutesOf(task.due_time), end = endOf(task);
    if (group.length && start >= groupEnd) { flush(); group = []; ends = []; }
    var lane = 0;
    while (lane < ends.length && ends[lane] > start) lane++;
    ends[lane] = end;
    group.push({ task: task, lane: lane });
    groupEnd = group.length === 1 ? end : Math.max(groupEnd, end);
  });
  if (group.length) flush();
  return result;
}

// Часы сетки: часы работы точки, но так, чтобы влезли все записи
function hoursFor(tasks) {
  var from = cal.hours.from, to = cal.hours.to;
  tasks.forEach(function (task) {
    from = Math.min(from, Math.floor(minutesOf(task.due_time) / 60));
    to = Math.max(to, Math.ceil(endOf(task) / 60));
  });
  return { from: from, to: Math.min(to, 24) };
}

function hoursHtml(days) {
  // На телефоне неделя по часам нечитаема — тогда списком по дням
  if (days.length > 1 && window.innerWidth < 700) {
    return '<div class="card">' + days.map(function (day) {
      return '<div class="day-title">' + longDay(day) + '</div>' + dayRows(day);
    }).join('') + '</div>';
  }
  var loose = {}, timed = {}, all = [];
  days.forEach(function (day) {
    var items = calOfDay(day);
    if (days.length === 1 && day === cal.today) {
      items = cal.data.overdue.filter(calShown).concat(items);
    }
    loose[day] = items.filter(function (task) { return !task.due_time || task.due_date !== day; });
    timed[day] = items.filter(function (task) { return task.due_time && task.due_date === day; });
    all = all.concat(timed[day]);
  });
  var hours = hoursFor(all);
  var height = (hours.to - hours.from) * HOUR_PX;

  var html = '<div class="card">';
  if (days.length > 1) {
    html += '<div class="thead"><div class="tcol0"></div>' + days.map(function (day) {
      return '<button type="button" class="th' + (day === cal.today ? ' today' : '')
        + '" data-open-day="' + day + '">' + WEEKDAYS[weekdayIndex(day)] + ' '
        + parseDay(day).getDate() + '</button>';
    }).join('') + '</div>';
  }
  html += '<div class="tband"><div class="tcol0">без<br>времени</div>' + days.map(function (day) {
    return '<div class="tb">' + loose[day].map(function (task) {
      var text = (task.due_date !== day ? shortDay(task.due_date) + ' ' : '') + shortText(task);
      return '<button type="button" class="it ' + itemClass(task) + '" data-open="'
        + attr(task.uid) + '">' + escape(text) + '</button>';
    }).join('') + '</div>';
  }).join('') + '</div>';

  html += '<div class="tgrid" style="height:' + height + 'px"><div class="tcol0">';
  for (var h = hours.from; h < hours.to; h++) {
    html += '<span style="top:' + ((h - hours.from) * HOUR_PX) + 'px">' + h + ':00</span>';
  }
  html += '</div><div class="tdays">';
  var now = new Date();
  var nowMinutes = now.getHours() * 60 + now.getMinutes();
  days.forEach(function (day) {
    html += '<div class="tday' + (day === cal.today ? ' today' : '') + '" data-col="' + day
      + '" data-from="' + hours.from + '" style="background-size:100% ' + HOUR_PX + 'px">';
    lanes(timed[day]).forEach(function (item) {
      var task = item.task;
      var top = (minutesOf(task.due_time) - hours.from * 60) / 60 * HOUR_PX;
      var tall = Math.max((endOf(task) - minutesOf(task.due_time)) / 60 * HOUR_PX, 20);
      var width = 100 / item.lanes;
      // Не <button>: у кнопки текст встаёт посередине высоты, а в блоке
      // на полтора часа время должно быть сверху, как в цеху
      html += '<div role="button" tabindex="0" class="blk ' + itemClass(task) + '" data-open="'
        + attr(task.uid) + '" style="top:' + top + 'px;height:' + (tall - 2) + 'px;left:'
        + (item.lane * width) + '%;width:calc(' + width + '% - 3px)"><b>'
        + escape(timeText(task)) + '</b> ' + escape((isNote(task) ? '✎ ' : '') + task.title)
        + (task.license_plate && tall > 40 ? '<small>' + escape(task.license_plate) + '</small>' : '')
        + '</div>';
    });
    if (day === cal.today && nowMinutes >= hours.from * 60 && nowMinutes <= hours.to * 60) {
      html += '<div class="nowline" style="top:'
        + ((nowMinutes - hours.from * 60) / 60 * HOUR_PX) + 'px"></div>';
    }
    html += '</div>';
  });
  html += '</div></div><p class="note">Щелчок по свободному времени — задача или комментарий на это время</p></div>';
  return html;
}

function shiftCalendar(step) {
  if (cal.view === 'month') {
    var date = parseDay(cal.day.slice(0, 8) + '01');
    var target = isoDay(new Date(date.getFullYear(), date.getMonth() + step, 1));
    // В месяце, где сегодня, выбран сегодняшний день
    cal.day = target.slice(0, 7) === cal.today.slice(0, 7) ? cal.today : target;
  } else {
    cal.day = addDays(cal.day, cal.view === 'week' ? 7 * step : step);
  }
  loadCalendar();
}

function drawCalendar() {
  var data = cal.data;
  var range = calRange();
  var filter = calFilter();
  var html = '<div class="card">';
  html += '<div class="cal-head"><h2>' + escape(calTitle(range)) + '</h2>'
    + '<div class="views" id="calViews">' + VIEWS.map(function (view) {
      return '<button type="button" data-view="' + view.key + '" aria-pressed="'
        + (view.key === cal.view) + '">' + view.title + '</button>';
    }).join('') + '</div>'
    + '<span class="cal-nav">'
    + '<button class="chip" type="button" id="calPrev" aria-label="Назад">‹</button>'
    + '<button class="chip" type="button" id="calToday">Сегодня</button>'
    + '<button class="chip" type="button" id="calNext" aria-label="Вперёд">›</button></span>'
    + '<button class="cal-add ghost" type="button" id="calNote">+ Комментарий</button>'
    + '<button class="cal-add" type="button" id="calAdd">+ Задача</button></div>';

  // Две строки фильтров: направление (только если есть мойка) и разделы
  // выбранного направления. Без мойки — одна строка, как раньше
  if (cal.wash) {
    html += '<div class="cal-filter" id="calDirs"><span class="lab">Направление:</span>'
      + [{ key: 'all', title: 'Все' }].concat(DIRS).map(function (dir) {
        return '<button class="chip" type="button" data-dir="' + dir.key + '" aria-pressed="'
          + (dir.key === cal.direction) + '">' + dir.title + '</button>';
      }).join('') + '</div>';
  }
  html += '<div class="cal-filter" id="calFilters">'
    + (cal.wash ? '<span class="lab">Разделы:</span>' : '')
    + '<button class="chip" type="button" data-cat="" aria-pressed="' + !filter.length
    + '">Все</button>'
    + calCats().concat([{ key: 'note', title: '✎ Комментарии' }]).map(function (item) {
      return '<button class="chip f-' + item.key + '" type="button" data-cat="' + item.key
        + '" aria-pressed="' + (filter.indexOf(item.key) >= 0) + '">' + item.title + '</button>';
    }).join('') + '</div></div>';

  if (cal.view === 'month') html += monthHtml(range);
  else if (cal.view === 'week') {
    var days = [];
    for (var i = 0; i < 7; i++) days.push(addDays(range.from, i));
    html += hoursHtml(days);
  } else html += hoursHtml([cal.day]);

  show(html);

  [].slice.call($('calViews').querySelectorAll('[data-view]')).forEach(function (button) {
    button.addEventListener('click', function () {
      cal.view = button.getAttribute('data-view');
      loadCalendar();
    });
  });
  $('calPrev').addEventListener('click', function () { shiftCalendar(-1); });
  $('calNext').addEventListener('click', function () { shiftCalendar(1); });
  $('calToday').addEventListener('click', function () {
    cal.day = cal.today; loadCalendar();
  });
  $('calAdd').addEventListener('click', function () { openTask(null, 'task'); });
  $('calNote').addEventListener('click', function () { openTask(null, 'note'); });

  if (cal.wash) {
    [].slice.call($('calDirs').querySelectorAll('[data-dir]')).forEach(function (button) {
      button.addEventListener('click', function () {
        var direction = button.getAttribute('data-dir');
        if (direction === cal.direction) return;
        setDirection(direction);
        drawCalendar();
      });
    });
  }

  if ($('calMonth')) {
    [].slice.call($('calMonth').querySelectorAll('[data-day]')).forEach(function (button) {
      button.addEventListener('click', function () {
        cal.day = button.getAttribute('data-day');
        // Соседний месяц — догружаем, свой — перерисовываем без сети
        if (cal.day.slice(0, 7) !== range.first.slice(0, 7)) loadCalendar();
        else drawCalendar();
      });
      button.addEventListener('dblclick', function () {
        cal.day = button.getAttribute('data-day');
        cal.view = 'day';
        loadCalendar();
      });
    });
  }

  [].slice.call($('view').querySelectorAll('[data-open-day]')).forEach(function (button) {
    button.addEventListener('click', function () {
      cal.day = button.getAttribute('data-open-day');
      cal.view = 'day';
      loadCalendar();
    });
  });

  // Щелчок по свободному времени — окошко: задача (уйдёт в Telegram) или
  // комментарий на это время, на час (решение владельца 29.10.2026)
  [].slice.call($('view').querySelectorAll('[data-col]')).forEach(function (column) {
    column.addEventListener('click', function (event) {
      if (event.target !== column) return;
      var from = +column.getAttribute('data-from');
      var minutes = Math.floor((from + event.offsetY / HOUR_PX) * 60);
      minutes = Math.max(0, Math.min(minutes - minutes % 30, 23 * 60 + 30));
      var end = minutes + 60;
      var day = column.getAttribute('data-col');
      var at = pad(Math.floor(minutes / 60)) + ':' + pad(minutes % 60);
      var when = {
        due_date: day,
        due_time: at,
        end_time: end < 24 * 60 ? pad(Math.floor(end / 60)) + ':' + pad(end % 60) : null
      };
      sheet('<h2>' + escape(longDay(day)) + ' · ' + at + '</h2>'
        + '<button class="go" type="button" id="pickTask" style="margin-top:14px">Задача</button>'
        + '<p class="note">Уйдёт в Telegram, будет напоминать, пока не отметят</p>'
        + '<button class="danger" type="button" id="pickNote" style="color:var(--ink)">'
        + 'Комментарий</button><p class="note">Просто запись на это время</p>');
      $('pickTask').addEventListener('click', function () {
        closeSheet(); openTask(null, 'task', when);
      });
      $('pickNote').addEventListener('click', function () {
        closeSheet(); openTask(null, 'note', when);
      });
    });
  });

  [].slice.call($('calFilters').querySelectorAll('[data-cat]')).forEach(function (button) {
    button.addEventListener('click', function () {
      var key = button.getAttribute('data-cat');
      var dir = calDir();
      var chosen = calFilter().slice();
      if (!key) chosen = [];
      else if (chosen.indexOf(key) >= 0) {
        chosen = chosen.filter(function (item) { return item !== key; });
      } else chosen.push(key);
      // Выбраны все разделы и комментарии — это и есть «Все»
      if (chosen.length === calCats().length + 1) chosen = [];
      cal.filters[dir] = chosen;
      try {
        localStorage.setItem(FILTER_KEYS[dir], JSON.stringify(chosen));
      } catch (e) {}
      drawCalendar();
    });
  });

  [].slice.call($('view').querySelectorAll('[data-open]')).forEach(function (button) {
    button.addEventListener('click', function () {
      openTask(calFind(button.getAttribute('data-open')));
    });
  });

  [].slice.call($('view').querySelectorAll('[data-done]')).forEach(function (box) {
    box.addEventListener('change', function () {
      var uid = box.getAttribute('data-done');
      box.disabled = true;
      patchTask(uid, { done: box.checked }).then(function () { loadCalendar(); })
        .catch(function (e) { box.disabled = false; box.checked = !box.checked; fail(e.message); });
    });
  });
}

function taskRow(task, late, day) {
  var shopName = shops.length > 1 && !currentShop ? escape(calShopName(task.shop_id)) : '';
  var tm = task.due_time ? escape(task.due_time)
    + (task.end_time ? '<small>–' + escape(task.end_time) + '</small>' : '') : '';

  // Комментарий — без галочки и без «просрочено»
  if (isNote(task)) {
    return '<div class="task note"><button class="open" type="button" data-open="'
      + attr(task.uid) + '"><span class="tm">' + tm + '</span><span class="tt">'
      + dirTag(task.direction) + '<span class="cat note">комментарий</span>'
      + '<b>' + escape(task.note || task.title) + '</b>'
      + (shopName ? '<span>' + shopName + '</span>' : '') + '</span></button></div>';
  }

  var details = [];
  if (task.license_plate) details.push(escape(task.license_plate));
  if (task.counterparty_name) details.push(escape(task.counterparty_name));
  if (task.client_name) details.push(escape(task.client_name));
  if (task.amount) details.push(money(task.amount));
  if (shopName) details.push(shopName);

  if (late && task.due_date !== (day || cal.day)) tm = escape(shortDay(task.due_date));

  return '<div class="task' + (late ? ' late' : '') + (task.done_at ? ' done' : '') + '">'
    + '<button class="open" type="button" data-open="' + attr(task.uid) + '">'
    + '<span class="tm">' + (tm || '—') + '</span><span class="tt">'
    + dirTag(task.direction)
    + '<span class="cat ' + attr(task.category) + '">' + escape(CAT_TITLES[task.category] || task.category)
    + '</span><b>' + escape(task.title) + '</b>'
    + (details.length ? '<span>' + details.join(' · ') + '</span>' : '')
    + (task.note ? '<span>' + escape(task.note) + '</span>' : '')
    + (task.done_at ? '<span>сделано · ' + escape(task.done_by || '') + ', '
       + escape(stampText(task.done_at)) + '</span>' : '')
    + '</span></button>'
    + '<input type="checkbox" data-done="' + attr(task.uid) + '" aria-label="Сделано"'
    + (task.done_at ? ' checked' : '') + '></div>';
}

function patchTask(uid, body) {
  var path = '/dashboard/tasks/' + encodeURIComponent(uid);
  return api(withShop(path), { method: 'PATCH', body: body });
}

// Перенос: «Завтра» и «Через неделю» — от сегодняшнего дня, а не от дня
// задачи: просроченную на прошлой неделе переносят вперёд, а не в прошлое
function plusHour(task) {
  var now = new Date();
  var day = task.due_date < cal.today ? cal.today : task.due_date;
  var minutes;
  if (task.due_time) {
    var parts = task.due_time.split(':');
    minutes = (+parts[0]) * 60 + (+parts[1]) + 60;
  } else {
    // Без времени — через час от сейчас
    day = day < cal.today ? cal.today : day;
    minutes = now.getHours() * 60 + now.getMinutes() + 60;
  }
  if (minutes >= 24 * 60) { minutes -= 24 * 60; day = addDays(day, 1); }
  return { due_date: day, due_time: pad(Math.floor(minutes / 60)) + ':' + pad(minutes % 60) };
}

function openTask(task, kind, preset) {
  var adding = !task;
  // Задача или комментарий — переключатель сверху окна
  kind = (task ? task.kind : kind) === 'note' ? 'note' : 'task';
  preset = preset || {};
  // Где задача — шиномонтаж или мойка. Без мойки — всегда шиномонтаж.
  // С мойкой новую задачу без выбора не поставить, и заранее ничего не
  // выбрано: промахнуться легко, а задача уехала бы не тем людям. Только
  // если фильтр сверху уже стоит на одном направлении — берём его
  var direction;
  if (!adding) direction = task.direction || 'tire';
  else if (!cal.wash) direction = 'tire';
  else direction = cal.direction === 'all' ? null : cal.direction;
  var askWhere = adding && cal.wash;

  // Раздел по умолчанию — выбранный в фильтре, если он один и есть у
  // этого направления; иначе «Рабочая», она есть у обоих
  var filter = calFilter();
  task = task || { direction: direction,
                   category: (filter.length === 1 ? filter[0] : 'work'),
                   due_date: preset.due_date || cal.day, due_time: preset.due_time || null,
                   end_time: preset.end_time || null, kind: kind, title: '', note: '',
                   license_plate: '', counterparty_uid: null, amount: null };
  var category = task.category;
  function fitCategory() {
    var keys = calCats(direction || 'tire').map(function (item) { return item.key; });
    if (keys.indexOf(category) < 0) category = 'work';
  }
  if (adding && direction) fitCategory();

  // Ставить задачу «во все точки сразу» нельзя: у каждой свой склад и
  // свои люди. Точку выбирают здесь, если сверху выбраны все
  var needShop = adding && shops.length > 1 && !currentShop;
  var shopId = adding ? (currentShop || (shops[0] && shops[0].id)) : task.shop_id;

  var html = '<div class="segs" id="tKind" style="margin-bottom:10px">'
    + [['task', 'Задача'], ['note', 'Комментарий']].map(function (pair) {
      return '<button class="chip" type="button" data-kind="' + pair[0] + '" aria-pressed="'
        + (pair[0] === kind) + '">' + pair[1] + '</button>';
    }).join('') + '</div>';
  if (!adding) {
    html += '<div class="when">создал: ' + escape(task.created_by || '—')
      + (SOURCE_TITLES[task.source] ? ' · ' + SOURCE_TITLES[task.source] : '')
      + (task.created_at ? ', ' + escape(stampText(task.created_at)) : '')
      + (task.done_at ? ' · <span class="tag ok">сделано · ' + escape(task.done_by || '')
         + ', ' + escape(stampText(task.done_at)) + '</span>' : '') + '</div>';
  }

  html += '<div class="form">';
  if (needShop) {
    html += '<label for="tShop">Точка</label><select id="tShop">'
      + shops.map(function (shop) {
        return '<option value="' + shop.id + '">' + escape(shop.name) + '</option>';
      }).join('') + '</select>';
  }

  // «Где» — первым полем: от него зависят разделы и контрагенты.
  // У поставленной задачи направление не меняется — только видно
  if (askWhere) {
    html += '<label>Где*</label><div class="segs" id="tWhere">'
      + DIRS.map(function (dir) {
        return '<button class="chip" type="button" data-where="' + dir.key
          + '" aria-pressed="' + (dir.key === direction) + '">' + dir.title + '</button>';
      }).join('') + '</div>';
  } else if (cal.wash) {
    html += '<label>Где</label><div>' + dirTag(direction) + '</div>';
  }

  html += '<div class="two"><div><label for="tDate">Дата</label>'
    + '<input id="tDate" type="date" value="' + attr(task.due_date) + '"></div>'
    + '<div><label for="tTime">С</label>'
    + '<input id="tTime" type="time" value="' + attr(task.due_time || '') + '"></div>'
    + '<div><label for="tEnd">До</label>'
    + '<input id="tEnd" type="time" value="' + attr(task.end_time || '') + '"></div></div>'
    + '<p class="note">Время можно не ставить — будет «без времени»</p>';

  // Комментарий — одно поле текста; длинный целиком лежит в note
  html += '<div id="tNoteOnly"><label for="tComment">Комментарий</label>'
    + '<textarea id="tComment" maxlength="4000">'
    + escape(isNote(task) ? (task.note || task.title || '') : '') + '</textarea></div>';

  html += '<div id="tTaskOnly"><label>Раздел</label><div class="segs" id="tCats"></div>';

  html += '<label for="tTitle">Что сделать</label>'
    + '<input id="tTitle" type="text" maxlength="200" value="' + attr(task.title) + '"'
    + ' placeholder="Привезти комплект со склада">'
    + '<label for="tNote">Подробно</label>'
    + '<textarea id="tNote" maxlength="4000">' + escape(task.note || '') + '</textarea>'
    + '<div class="two"><div><label for="tPlate">Машина</label>'
    + '<input id="tPlate" type="text" maxlength="20" value="' + attr(task.license_plate || '')
    + '" placeholder="А123ВВ777"></div>'
    + '<div id="tCpBox"><label for="tCp">Контрагент</label><select id="tCp"></select></div></div>'
    + '<div id="tAmountBox"><label for="tAmount">Сумма</label>'
    + '<input id="tAmount" type="number" inputmode="decimal" value="'
    + (task.amount != null ? attr(task.amount) : '') + '"></div></div>';
  html += '<p class="note" id="tKindNote"></p>';

  if (task.client_name || task.client_phone || task.storage_ref) {
    html += '<p class="note">'
      + [task.client_name, task.client_phone ? fixPhone(task.client_phone) : '',
         task.storage_ref ? 'комплект №' + task.storage_ref : '']
        .filter(Boolean).map(escape).join(' · ') + '</p>';
  }
  html += '</div>';

  if (!adding) {
    html += '<div class="block-title">Перенести</div><div class="moves">'
      + '<button type="button" id="tMoveHour">+1 час</button>'
      + '<button type="button" id="tMoveTomorrow">Завтра</button>'
      + '<button type="button" id="tMoveWeek">Через неделю</button>'
      + '<input id="tMoveDate" type="date" aria-label="Выбрать дату"></div>';
  }

  html += '<button class="go" type="button" id="tSave" style="margin-top:18px">'
    + (adding ? 'Поставить задачу' : 'Сохранить') + '</button>';

  if (!adding) {
    html += '<button class="danger" type="button" id="tDone" style="color:var(--ok)">'
      + (task.done_at ? 'Снять отметку «сделано»' : '✓ Сделано') + '</button>'
      + '<button class="danger" type="button" id="tDelete">Удалить</button>'
      + '<div class="confirm" id="tConfirm" hidden>Удалить задачу? Она пропадёт и в цеху.'
      + '<div class="moves"><button class="yes" type="button" id="tConfirmYes">Да, удалить</button>'
      + '<button type="button" id="tConfirmNo">Нет</button></div></div>';
  }
  html += '<div class="error" id="formError" hidden></div>';

  sheet(html);

  // Контрагенты — только направления задачи: у мойки свои поставщики.
  // Пока направление не выбрано, выбирать не из чего — поле спрятано
  var people = [];
  // Само поле — один раз: ответ сервера может прийти, когда окно уже
  // закрыли и открыли другую задачу, и чужое поле трогать нельзя
  var cpSelect = $('tCp');
  function fillPeople() {
    var mine = people.filter(function (row) {
      return String(row.shop_id) === String(shopId);
    });
    cpSelect.innerHTML = '<option value="">—</option>' + mine.map(function (row) {
      return '<option value="' + attr(row.uid) + '"' + (row.uid === task.counterparty_uid
        ? ' selected' : '') + '>' + escape(row.name) + (row.kind ? ' · ' + escape(row.kind) : '')
        + '</option>';
    }).join('');
    // Контрагент задачи, которого нет в списке (список ещё грузится или
    // контрагент удалён), остаётся выбранным: «Сохранить» не должно
    // молча его стирать
    var uid = task.counterparty_uid;
    if (uid && !mine.some(function (row) { return row.uid === uid; })) {
      cpSelect.innerHTML += '<option value="' + attr(uid) + '" selected>'
        + escape(task.counterparty_name || '…') + '</option>';
    }
  }
  function refreshPeople() {
    people = [];
    fillPeople();
    $('tCpBox').hidden = !direction;
    cpSelect.disabled = !direction;
    if (!direction) return;
    var asked = direction;
    loadPeople(asked).then(function (rows) {
      if (asked !== direction || !document.body.contains(cpSelect)) return;
      people = rows;
      fillPeople();
    }).catch(function (e) { formError(e.message); });
  }

  function showAmount() {
    // Сумма нужна покраске; у остальных поле только мешает. Уже
    // поставленную сумму не прячем — иначе её не увидеть и не стереть
    $('tAmountBox').hidden = !((direction && category === 'paint') || task.amount);
  }

  // Разделы — только своего направления: «Хранение» у мойки сервер не
  // примет. Без направления — подсказка, что их покажем после выбора
  function drawCats() {
    if (!direction) {
      $('tCats').innerHTML = '<p class="note" style="margin:0">Появятся, когда выберете, '
        + 'шиномонтаж это или мойка</p>';
      return;
    }
    $('tCats').innerHTML = calCats(direction).map(function (item) {
      return '<button class="chip f-' + item.key + '" type="button" data-cat="' + item.key
        + '" aria-pressed="' + (item.key === category) + '">' + item.title + '</button>';
    }).join('');
    [].slice.call($('tCats').querySelectorAll('[data-cat]')).forEach(function (button) {
      button.addEventListener('click', function () {
        category = button.getAttribute('data-cat');
        [].slice.call($('tCats').querySelectorAll('[data-cat]')).forEach(function (other) {
          other.setAttribute('aria-pressed', String(other === button));
        });
        showAmount();
      });
    });
  }

  drawCats();
  refreshPeople();
  showAmount();

  // Переключили вид — текст переносим, чтобы не набирать заново
  function showKind() {
    var note = kind === 'note';
    $('tNoteOnly').hidden = !note;
    $('tTaskOnly').hidden = note;
    if ($('tDone')) $('tDone').hidden = note;
    $('tKindNote').textContent = note
      ? 'Комментарий — просто запись на день: без галочки, не напоминает, не краснеет '
        + 'и никуда не переходит. Видят все — в цеху и в дашборде.'
      : 'Задача — с галочкой «сделано». Сразу уходит в Telegram, висит в ленте над нарядами, краснеет, если '
        + 'просрочена, и переходит на завтра, пока её не отметят.';
    $('tSave').textContent = adding ? (note ? 'Сохранить комментарий' : 'Поставить задачу')
      : 'Сохранить';
  }
  [].slice.call($('tKind').querySelectorAll('[data-kind]')).forEach(function (button) {
    button.addEventListener('click', function () {
      var chosen = button.getAttribute('data-kind');
      if (chosen === kind) return;
      [].slice.call($('tKind').querySelectorAll('[data-kind]')).forEach(function (other) {
        other.setAttribute('aria-pressed', String(other === button));
      });
      if (chosen === 'note') {
        $('tComment').value = [$('tTitle').value.trim(), $('tNote').value.trim()]
          .filter(Boolean).join('\n');
      } else {
        var text = $('tComment').value.trim();
        var cut = text.indexOf('\n');
        $('tTitle').value = (cut < 0 ? text : text.slice(0, cut)).slice(0, 200);
        $('tNote').value = cut < 0 ? '' : text.slice(cut + 1).trim();
      }
      kind = chosen;
      $('formError').hidden = true;
      showKind();
    });
  });
  showKind();

  if (askWhere) {
    [].slice.call($('tWhere').querySelectorAll('[data-where]')).forEach(function (button) {
      button.addEventListener('click', function () {
        var chosen = button.getAttribute('data-where');
        [].slice.call($('tWhere').querySelectorAll('[data-where]')).forEach(function (other) {
          other.setAttribute('aria-pressed', String(other === button));
        });
        if (chosen === direction) return;
        direction = chosen;
        fitCategory();
        $('formError').hidden = true;
        drawCats();
        refreshPeople();
        showAmount();
      });
    });
  }

  if (needShop) {
    $('tShop').value = String(shopId);
    $('tShop').addEventListener('change', function () {
      shopId = $('tShop').value;
      fillPeople();
    });
  }

  function afterSave(saved) {
    closeSheet();
    if (saved && saved.due_date) cal.day = saved.due_date;
    loadCalendar();
  }

  $('tSave').addEventListener('click', function () {
    if (!direction) { formError('Выберите, шиномонтаж это или мойка'); return; }
    if (!$('tDate').value) { formError('Укажите дату'); return; }
    var start = $('tTime').value, end = $('tEnd').value;
    if (start && end && end <= start) { formError('«До» должно быть позже «с»'); return; }

    var body;
    if (kind === 'note') {
      var text = $('tComment').value.trim();
      if (!text) { formError('Напишите комментарий'); return; }
      var first = text.split('\n')[0].slice(0, 200);
      body = {
        kind: 'note',
        category: category,
        due_date: $('tDate').value,
        due_time: start || null,
        end_time: start ? (end || null) : null,
        title: first,
        note: text !== first ? text : null
      };
    } else {
      var title = $('tTitle').value.trim();
      if (!title) { formError('Напишите, что за задача'); return; }
      var amount = $('tAmount').value.trim();
      body = {
        kind: 'task',
        category: category,
        due_date: $('tDate').value,
        due_time: start || null,
        end_time: start ? (end || null) : null,
        title: title,
        note: $('tNote').value,
        license_plate: $('tPlate').value,
        counterparty_uid: $('tCp').value || null,
        amount: amount ? amount : null
      };
    }

    $('tSave').disabled = true;
    var request;
    if (adding) {
      body.shop = shopId;
      body.direction = direction;
      request = api('/dashboard/tasks', { method: 'POST', body: body });
    } else {
      request = patchTask(task.uid, body);
    }
    request.then(afterSave).catch(function (e) {
      $('tSave').disabled = false;
      formError(e.message);
    });
  });

  if (adding) return;

  function move(body) {
    patchTask(task.uid, body).then(afterSave)
      .catch(function (e) { formError(e.message); });
  }

  $('tMoveHour').addEventListener('click', function () { move(plusHour(task)); });
  $('tMoveTomorrow').addEventListener('click', function () {
    move({ due_date: addDays(cal.today, 1) });
  });
  $('tMoveWeek').addEventListener('click', function () {
    move({ due_date: addDays(cal.today, 7) });
  });
  $('tMoveDate').addEventListener('change', function () {
    if ($('tMoveDate').value) move({ due_date: $('tMoveDate').value });
  });

  $('tDone').addEventListener('click', function () {
    patchTask(task.uid, { done: !task.done_at }).then(function () {
      closeSheet();
      loadCalendar();
    }).catch(function (e) { formError(e.message); });
  });

  // Подтверждение — здесь же, в окне: системное окно браузера на
  // телефоне выглядит как сбой и легко нажимается не туда
  $('tDelete').addEventListener('click', function () {
    $('tConfirm').hidden = false;
    $('tConfirm').scrollIntoView({ block: 'nearest' });
  });
  $('tConfirmNo').addEventListener('click', function () { $('tConfirm').hidden = true; });
  $('tConfirmYes').addEventListener('click', function () {
    patchTask(task.uid, { deleted: true }).then(function () {
      closeSheet();
      loadCalendar();
    }).catch(function (e) { formError(e.message); });
  });
}

// ------------------------------------------------------------------
// Склад
// ------------------------------------------------------------------
//
// Остатки, присланные цехом (docs/stock.md): сначала то, что в минусе,
// потом то, чего мало. Править отсюда нельзя — склад ведут в цеху.
// Сервер отдаёт оба направления сразу, фильтр — здесь: переключение
// не ждёт сети.

var STOCK_DIRS = [{ key: 'all', title: 'Все' }, { key: 'tire', title: 'Шиномонтаж' },
                  { key: 'wash', title: 'Мойка' }];
var STOCK_DIR_TAGS = { tire: 'шинка', wash: 'мойка' };
var STOCK_KINDS = { goods: 'товар', material: 'материал' };

var stock = { data: null, direction: 'all', onlyLow: false };

// Фильтры помним на этом устройстве: кладовщику мойки не выбирать
// «Мойку» заново при каждом входе
try {
  stock.direction = localStorage.getItem('stockDirection') || 'all';
  stock.onlyLow = localStorage.getItem('stockOnlyLow') === '1';
} catch (e) {}

function saveStockFilter() {
  try {
    localStorage.setItem('stockDirection', stock.direction);
    localStorage.setItem('stockOnlyLow', stock.onlyLow ? '1' : '0');
  } catch (e) {}
}

// 1,5 л · 146 шт · −0,4 л. Минус — настоящий, а не дефис: в столбце
// цифр дефис теряется
function stockNumber(value) {
  var number = Number(value) || 0;
  var text = Math.abs(number).toLocaleString('ru-RU', { maximumFractionDigits: 3 });
  return (number < 0 && text !== '0' ? '−' : '') + text;
}

function stockAmount(value, unit) {
  return stockNumber(value) + (unit ? ' ' + escape(unit) : '');
}

// Цена за штуку — просто цена, за литр и килограмм — «350 ₽/л»
function stockPrice(item) {
  var unit = item.unit && item.unit !== 'шт' ? '/' + escape(item.unit) : '';
  return money(item.price) + unit;
}

// «Обновлено: 16:05», не сегодня — ещё и число. Время — как прислал
// сервер, московское, без перевода поясов
function stockWhen(iso) {
  if (!iso) return 'Цех ещё не присылал склад';
  var now = new Date();
  var today = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0')
    + '-' + String(now.getDate()).padStart(2, '0');
  var clock = iso.slice(11, 16);
  if (iso.slice(0, 10) === today) return 'Обновлено: ' + clock;
  return 'Обновлено: ' + iso.slice(8, 10) + '.' + iso.slice(5, 7) + ' ' + clock;
}

function loadStock() {
  api(withShop('/dashboard/stock')).then(function (data) {
    stock.data = data;
    drawStock();
  }).catch(function (e) { show(''); fail(e.message); });
}

function drawStock() {
  var data = stock.data || { items: [] };
  if (!data.enabled) {
    show('<div class="card"><h2>Склад</h2><div class="empty">Склад у этой точки не ведётся.'
      + '<br>Включают в программе цеха: Настройки → Направления.</div></div>');
    return;
  }

  var items = data.items || [];
  // Фильтр по направлению — только если есть мойка: у шиномонтажа без
  // мойки он бы только путал
  var wash = data.wash_enabled || items.some(function (item) { return item.direction === 'wash'; });
  var direction = wash ? stock.direction : 'all';
  var many = !currentShop && shops.length > 1;

  var mine = items.filter(function (item) {
    return direction === 'all' || item.direction === direction;
  });
  var neg = mine.filter(function (item) { return item.state === 'neg'; }).length;
  var low = mine.filter(function (item) { return item.state === 'low'; }).length;
  var rows = stock.onlyLow
    ? mine.filter(function (item) { return item.state !== 'ok'; }) : mine;

  var html = '<div class="card"><div class="cal-head"><h2>Склад</h2>'
    + '<span class="stock-when">' + escape(stockWhen(data.updated_at)) + '</span></div>';

  if (wash) {
    html += '<div class="cal-filter" id="sDirs"><span class="lab">Направление:</span>'
      + STOCK_DIRS.map(function (item) {
        return '<button class="chip" type="button" data-sdir="' + item.key
          + '" aria-pressed="' + (item.key === direction) + '">' + item.title + '</button>';
      }).join('') + '</div>';
  }
  html += '<div class="cal-filter"><button class="chip" type="button" id="sOnlyLow" aria-pressed="'
    + stock.onlyLow + '">Только мало и минус</button></div>';

  if (neg || low) {
    html += '<div class="stock-sum">'
      + (neg ? '<span class="tag bad" style="margin:0">В минусе: ' + neg + '</span>' : '')
      + (low ? '<span class="tag warn" style="margin:0">Мало: ' + low + '</span>' : '')
      + '</div>';
  }

  if (!rows.length) {
    html += '<div class="empty">' + (stock.onlyLow && mine.length
      ? 'Всего хватает: ничего не мало и не в минусе'
      : 'Позиций нет') + '</div>';
  }

  html += rows.map(function (item) {
    var meta = '<span class="kind ' + (item.kind === 'goods' ? 'goods' : 'material') + '">'
      + (STOCK_KINDS[item.kind] || 'материал') + '</span>';
    if (wash && direction === 'all') {
      meta += '<span class="dir ' + (item.direction === 'wash' ? 'wash' : 'tire') + '">'
        + (STOCK_DIR_TAGS[item.direction] || 'шинка') + '</span>';
    }
    if (many && item.shop_name) meta += '<span>' + escape(item.shop_name) + '</span>';
    meta += '<span>' + stockPrice(item) + '</span>';

    return '<div class="srow ' + escape(item.state) + '">'
      + '<div class="main"><b>' + escape(item.name) + '</b><div class="meta">' + meta + '</div></div>'
      + '<div class="qty"><b>' + stockAmount(item.quantity, item.unit) + '</b>'
      + '<small>мин. ' + stockNumber(item.min_quantity) + '</small></div></div>';
  }).join('');

  html += '</div>';
  show(html);

  if (wash) {
    [].slice.call($('sDirs').querySelectorAll('button')).forEach(function (button) {
      button.addEventListener('click', function () {
        stock.direction = button.getAttribute('data-sdir');
        saveStockFilter();
        drawStock();
      });
    });
  }
  $('sOnlyLow').addEventListener('click', function () {
    stock.onlyLow = !stock.onlyLow;
    saveStockFilter();
    drawStock();
  });
}

// ------------------------------------------------------------------
// Касса (docs/cash.md)
// ------------------------------------------------------------------
//
// Кассу ведёт цех; здесь только смотрят: сколько сейчас в ящике, на
// что ушли деньги за период и где касса не сошлась при пересчёте.
// Отменённый ордер и его отмена видны оба, а в итогах дают ноль.

var CASH_KINDS = { 'in': 'Приходный', out: 'Расходный' };

function loadCash() {
  api(query('/dashboard/cash')).then(function (data) {
    var many = !currentShop && shops.length > 1;
    show(cashNow(data, many) + cashTotals(data) + cashOrders(data, many)
      + cashShifts(data, many));
  }).catch(function (e) { show(''); fail(e.message); });
}

// Сейчас в кассе: у открытой смены — «должно быть», у закрытой —
// пересчитанное при закрытии. По всем точкам — сумма и каждая точка
function cashNow(data, many) {
  var known = data.now.filter(function (row) { return row.cash_expected != null; });
  var html = '<div class="card cash-now"><h2>Сейчас в кассе</h2><div class="tiles">';

  if (!known.length) {
    return html + '<div class="tile wide off"><span>Касса</span><b>Нет данных</b>'
      + '<small>Касса в цеху ещё не велась или программа цеха старая — обновите её, '
      + 'и остаток появится после ближайшего обмена.</small></div></div></div>';
  }

  if (many && known.length > 1) {
    var total = known.reduce(function (sum, row) { return sum + row.cash_expected; }, 0);
    html += '<div class="tile wide"><span>Во всех точках</span><b>' + money(total) + '</b></div>';
  }

  html += data.now.map(function (row) {
    var off = row.cash_expected == null;
    var when = row.shift_open
      ? 'смена с ' + timeText(row.shift_started_at) + ' · должно быть'
      : 'смена закрыта · пересчитали при закрытии';
    return '<div class="tile' + (many ? '' : ' wide') + (off ? ' off' : '') + '">'
      + '<span>' + escape(many ? row.shop_name : 'Должно быть в кассе') + '</span>'
      + '<b>' + (off ? 'нет данных' : money(row.cash_expected)) + '</b>'
      + (off ? '' : '<small>' + when + '</small>') + '</div>';
  }).join('');

  return html + '</div></div>';
}

function cashTotals(data) {
  var totals = data.totals;
  var out = Object.keys(totals.out), came = Object.keys(totals['in']);
  if (!out.length && !came.length && !totals.noncash_out) return '';

  var lines = function (bucket, names, cls, sign) {
    return names.map(function (name) {
      return '<div class="cat-line"><span>' + escape(name) + '</span><b class="' + cls + '">'
        + sign + money(bucket[name]) + '</b></div>';
    }).join('');
  };

  var html = '<div class="card"><h2>За период по статьям</h2>';
  if (out.length) {
    html += '<div class="block-title" style="margin-top:0">Расход наличными</div>'
      + lines(totals.out, out, 'out', '− ');
  }
  if (came.length) {
    html += '<div class="block-title"' + (out.length ? '' : ' style="margin-top:0"')
      + '>Приход наличными</div>' + lines(totals['in'], came, 'in', '+ ');
  }
  if (totals.noncash_out) {
    html += '<div class="block-title">Безнал</div>'
      + '<div class="cat-line noncash"><span>Расход безналом — касса не меняется</span><b>'
      + money(totals.noncash_out) + '</b></div>';
  }
  return html + '</div>';
}

function cashOrders(data, many) {
  var html = '<div class="card"><h2>Ордера</h2>';
  if (!data.orders.length) {
    return html + '<div class="empty">За этот период ордеров не было</div></div>';
  }

  return html + data.orders.map(function (row) {
    var noncash = row.method === 'noncash';
    var chip = '<span class="ord ' + (noncash ? 'noncash' : row.kind) + '">'
      + CASH_KINDS[row.kind] + (row.number != null ? ' №' + row.number : '')
      + (noncash ? ' · безнал' : '') + '</span>';

    var marks = '';
    if (row.reverses_uid) {
      marks += '<span class="ord noncash">отмена'
        + (row.reverses_number != null ? ' №' + row.reverses_number : '') + '</span>';
    }
    if (row.reversed_by_uid) {
      marks += '<span class="ord noncash">отменён'
        + (row.reversed_by_number != null ? ' ордером №' + row.reversed_by_number : '')
        + (row.reversed_by_title ? ' · ' + escape(row.reversed_by_title) : '') + '</span>';
    }

    var meta = [timeText(row.created_at)];
    if (row.note) meta.push(escape(row.note));
    if (row.employee_title) meta.push(escape(row.employee_title));
    if (many && row.shop_name) meta.push(escape(row.shop_name));

    // Что ордер сделал с кассой: приходный прибавил, расходный вычел,
    // отмена — наоборот. Безнал кассу не трогает — без знака и серым
    var plus = (row.kind === 'in') !== Boolean(row.reverses_uid);
    var sum = noncash ? money(row.amount)
      : (plus ? '+ ' : '− ') + money(row.amount);

    return '<div class="co' + (noncash ? ' noncash' : '') + (row.reversed_by_uid ? ' gone' : '')
      + '"><div class="main">' + chip + marks + '<b>' + escape(row.category || 'Без статьи')
      + '</b><div class="meta">' + meta.join(' · ') + '</div></div>'
      + '<div class="sum ' + (plus ? 'plus' : 'minus') + '">' + sum + '</div></div>';
  }).join('') + '</div>';
}

function cashShifts(data, many) {
  if (!data.shifts.length) return '';

  return '<div class="card"><h2>Пересчёт кассы по сменам</h2>' + data.shifts.map(function (row) {
    var diff = row.cash_diff;
    var state = diff == null ? '' : (diff < -0.005 ? 'short' : (diff > 0.005 ? 'over' : ''));
    var right;
    if (row.status === 'open' && row.cash_counted == null) {
      right = '<b>' + (row.cash_expected != null ? money(row.cash_expected) : '—')
        + '</b><small>смена идёт</small>';
    } else if (row.cash_counted == null) {
      right = '<b>—</b><small>не пересчитали</small>';
    } else if (state === 'short') {
      right = '<b>− ' + money(Math.abs(diff)) + '</b><small>недостача</small>';
    } else if (state === 'over') {
      right = '<b>+ ' + money(diff) + '</b><small>излишек</small>';
    } else {
      right = '<b>' + money(0) + '</b><small>сошлось</small>';
    }

    var meta = [];
    if (row.cash_start != null) meta.push('на начало ' + money(row.cash_start));
    if (row.cash_expected != null && row.cash_counted != null) {
      meta.push('должно быть ' + money(row.cash_expected));
    }
    if (row.cash_counted != null) meta.push('пересчитали ' + money(row.cash_counted));
    if (many && row.shop_name) meta.push(escape(row.shop_name));

    return '<div class="cshift ' + state + '"><div class="main"><b>'
      + timeText(row.started_at) + (row.ended_at ? ' – ' + timeText(row.ended_at) : '')
      + '</b><div class="meta">' + meta.join(' · ') + '</div>'
      + (row.cash_diff_reason
         ? '<div class="meta">Причина: ' + escape(row.cash_diff_reason) + '</div>' : '')
      + '</div><div class="diff">' + right + '</div></div>';
  }).join('') + '</div>';
}

// ------------------------------------------------------------------
// Запуск
// ------------------------------------------------------------------

function start() {
  remember();
  $('screenLogin').hidden = true;
  $('screenMain').hidden = false;

  $('whoName').textContent = me.name || me.phone;
  $('whoName').title = me.role_title;

  var list = sections();
  if (!list.length) {
    $('tabs').innerHTML = '';
    show('<div class="empty">Вам пока не открыт ни один раздел.<br>'
      + 'Попросите владельца выдать права.</div>');
    return;
  }

  section = list[0].key;
  applyPeriod();
  drawPeriod();
  drawTabs();

  // «Заказчики» — только владельцу сервера; остальным раздела нет
  api('/platform/me').then(function () { platformOn = true; drawTabs(); })
    .catch(function () { platformOn = false; });

  // Точки узнаём один раз: их немного, и меняются они редко. Вместе с
  // ними — какой сейчас рабочий день: от него «Сегодня» и «Вчера»
  Promise.all([
    api('/dashboard/workday').catch(function () { return null; }),
    api('/dashboard/shops').catch(function () { return null; })
  ]).then(function (both) {
    if (both[0] && both[0].day) {
      workDay = both[0].day;
      if (period.key !== 'custom') applyPeriod();
      drawPeriod();
    }
    shops = both[1] || [];
    drawShops();
    drawTabs();
    load();
  });
}

fetch('/public/info').then(function (answer) { return answer.json(); })
  .then(function (info) {
    if (info && info.shop_name) $('shopName').textContent = info.shop_name;
  })
  .catch(function () {});

try {
  var saved = localStorage.getItem('staffToken');
  if (saved) {
    token = saved;
    api('/staff/me').then(function (answer) { me = answer; start(); })
      .catch(function () { forget(); });
  }
} catch (e) {}
</script>
