<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Проверка номеров</title>
<meta name="theme-color" content="#2563eb">
<style>
/*
  Проверка распознавания номеров для владельца (docs/order_photo.md).
  Снял машину — сервер прочитал номер. Снимок не сохраняется: это
  проверка, а не наряд. Вход — тот же, что у дашборда.
*/
:root {
  --ink: #0f172a; --ink-soft: #475569; --muted: #94a3b8; --line: #e2e8f0;
  --bg: #f1f5f9; --card: #ffffff; --brand: #2563eb;
  --ok: #15803d; --ok-bg: #dcfce7; --warn: #92400e; --warn-bg: #fef3c7;
  --bad: #b91c1c; --bad-bg: #fee2e2; --plate-bg: #ffffff; --plate-ink: #0f172a;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ink: #e2e8f0; --ink-soft: #94a3b8; --muted: #64748b; --line: #1e293b;
    --bg: #0b1220; --card: #111a2e; --ok: #86efac; --ok-bg: #12301f;
    --warn: #f0c46a; --warn-bg: #3b2f14; --bad: #fca5a5; --bad-bg: #3b1416;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --ink: #e2e8f0; --ink-soft: #94a3b8; --muted: #64748b; --line: #1e293b;
  --bg: #0b1220; --card: #111a2e; --ok: #86efac; --ok-bg: #12301f;
  --warn: #f0c46a; --warn-bg: #3b2f14; --bad: #fca5a5; --bad-bg: #3b1416;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  font-size: 17px; line-height: 1.45;
  padding: env(safe-area-inset-top) max(16px, env(safe-area-inset-right)) calc(env(safe-area-inset-bottom) + 24px) max(16px, env(safe-area-inset-left));
}
.wrap { max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
header { padding: 18px 0 4px; }
h1 { margin: 0; font-size: 21px; }
.sub { color: var(--ink-soft); font-size: 14px; margin-top: 4px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px; }
button, .shoot {
  display: block; width: 100%; padding: 16px; font-size: 17px; font-family: inherit;
  font-weight: 600; border: 0; border-radius: 14px; background: var(--brand); color: #fff;
  text-align: center; cursor: pointer;
}
.shoot input { display: none; }
.busy { opacity: .6; pointer-events: none; }
.result { display: flex; gap: 12px; align-items: center; }
.result img { width: 96px; height: 72px; object-fit: cover; border-radius: 10px; flex: none; background: var(--line); }
.result .text { min-width: 0; flex: 1; }
.plate {
  display: inline-block; font-family: var(--mono); font-size: 22px; font-weight: 600; letter-spacing: .04em;
  background: var(--plate-bg); color: var(--plate-ink); border: 2px solid var(--plate-ink);
  border-radius: 6px; padding: 1px 8px;
}
.none { font-size: 17px; font-weight: 600; color: var(--bad); }
.meta { font-size: 13px; color: var(--ink-soft); margin-top: 4px; font-variant-numeric: tabular-nums; }
.tag { display: inline-block; font-size: 12px; border-radius: 6px; padding: 1px 7px; margin-left: 6px; vertical-align: 3px; }
.tag.ok { background: var(--ok-bg); color: var(--ok); }
.tag.warn { background: var(--warn-bg); color: var(--warn); }
.tag.bad { background: var(--bad-bg); color: var(--bad); }
.error { background: var(--bad-bg); color: var(--bad); border-radius: 12px; padding: 12px; font-size: 15px; }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.stats div { background: var(--bg); border-radius: 10px; padding: 8px; font-size: 12px; color: var(--ink-soft); }
.stats b { display: block; font-size: 18px; color: var(--ink); font-variant-numeric: tabular-nums; }
a { color: var(--brand); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Проверка номеров</h1>
    <div class="sub">Снимите машину так, чтобы был виден номер. Сервер прочитает его так же, как при наряде по фото. Снимки не сохраняются.</div>
  </header>

  <div id="login" class="card" hidden>
    Сначала войдите в <a href="/d">дашборд</a> на этом телефоне, потом вернитесь сюда.
  </div>

  <div id="main" hidden>
    <label class="shoot" id="shoot">Снять машину
      <input id="file" type="file" accept="image/*" capture="environment">
    </label>
  </div>

  <div id="error" class="error" hidden></div>

  <div id="statsCard" class="card" hidden>
    <div class="stats">
      <div>Снимков<b id="sCount">0</b></div>
      <div>Прочитано<b id="sRead">0</b></div>
      <div>В среднем<b id="sTime">—</b></div>
    </div>
  </div>

  <div id="results" style="display:flex;flex-direction:column;gap:10px"></div>

  <div class="sub"><a href="/d">← В дашборд</a></div>
</div>

<script>
var token = null;
try { token = localStorage.getItem('staffToken'); } catch (e) {}
var $ = function (id) { return document.getElementById(id); };
var stats = { count: 0, read: 0, ms: 0 };

if (token) { $('main').hidden = false; } else { $('login').hidden = false; }

function esc(text) {
  return String(text).replace(/[&<>"]/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
  });
}

function show(answer, preview) {
  stats.count += 1;
  if (answer.plate) stats.read += 1;
  stats.ms += answer.ms || 0;
  $('sCount').textContent = stats.count;
  $('sRead').textContent = stats.read + ' из ' + stats.count;
  $('sTime').textContent = (stats.ms / stats.count / 1000).toFixed(1).replace('.', ',') + ' с';
  $('statsCard').hidden = false;

  var head;
  if (!answer.plate) {
    head = '<span class="none">Номер не прочитан</span>';
  } else {
    var tag = answer.plate_complete
      ? (answer.confidence >= 0.8 ? '<span class="tag ok">уверенно</span>' : '<span class="tag warn">неуверенно</span>')
      : '<span class="tag warn">без региона</span>';
    if (answer.country) {
      tag += '<span class="tag warn">' + (answer.country === 'other'
        ? 'не российский — проверьте' : 'иностранный · ' + esc(answer.country)) + '</span>';
    }
    head = '<span class="plate">' + esc(answer.plate) + '</span>' + tag;
  }
  var meta = (answer.ms / 1000).toFixed(1).replace('.', ',') + ' с'
    + (answer.plate ? ' · уверенность ' + Math.round((answer.confidence || 0) * 100) + '%' : '')
    + (answer.first ? ' · первый снимок: модели загружались' : '');
  var row = document.createElement('div');
  row.className = 'card result';
  row.innerHTML = '<img alt="Снимок машины" src="' + preview + '">'
    + '<div class="text">' + head + '<div class="meta">' + meta + '</div></div>';
  $('results').insertBefore(row, $('results').firstChild);
}

$('file').addEventListener('change', function () {
  var file = this.files && this.files[0];
  this.value = '';
  if (!file) return;
  $('error').hidden = true;
  $('shoot').classList.add('busy');
  $('shoot').firstChild.textContent = 'Читаю номер…';
  var preview = URL.createObjectURL(file);
  var form = new FormData();
  form.append('photo', file);
  fetch('/dashboard/plates/check', {
    method: 'POST', body: form, headers: { 'Authorization': 'Bearer ' + token }
  }).then(function (answer) {
    return answer.json().catch(function () { return {}; }).then(function (data) {
      if (answer.status === 401) {
        $('main').hidden = true; $('login').hidden = false;
        throw new Error('Вход устарел — войдите в дашборд заново');
      }
      if (!answer.ok) throw new Error(data.detail || 'Не получилось. Попробуйте ещё раз');
      return data;
    });
  }).then(function (data) {
    show(data, preview);
  }).catch(function (e) {
    $('error').textContent = e.message;
    $('error').hidden = false;
  }).then(function () {
    $('shoot').classList.remove('busy');
    $('shoot').firstChild.textContent = 'Снять ещё';
  });
});
</script>
</body>
</html>
