<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Оставьте отзыв</title>
<style>
/*
  Отзыв по QR (решение владельца 13.11.2026): клиент сканирует код на
  экране у кассы — и сразу видит, куда оставить отзыв. Крупно, одной
  рукой, без входа.
*/
:root {
  --ink: #0f172a; --ink-soft: #475569; --line: #e2e8f0; --bg: #f1f5f9;
  --card: #ffffff; --brand: #2563eb;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ink: #e2e8f0; --ink-soft: #94a3b8; --line: #1e293b; --bg: #0b1220; --card: #111a2e;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  font-size: 17px; line-height: 1.45;
  padding: env(safe-area-inset-top) 16px calc(env(safe-area-inset-bottom) + 24px); }
main { max-width: 480px; margin: 0 auto; }
header { padding: 28px 0 16px; text-align: center; }
h1 { margin: 0; font-size: 24px; }
.sub { color: var(--ink-soft); font-size: 16px; margin-top: 6px; }
a.go { display: block; text-align: center; text-decoration: none; padding: 18px; margin-bottom: 12px;
  border-radius: 14px; font-size: 18px; font-weight: 600; background: var(--brand); color: #fff; }
a.go.second { background: var(--card); color: var(--ink); border: 1.5px solid var(--line); }
.empty { text-align: center; color: var(--ink-soft); padding: 48px 0; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <header>
    <h1 id="name">Спасибо, что заехали!</h1>
    <div class="sub">Будем благодарны за отзыв — это займёт минуту</div>
  </header>
  <div id="links"></div>
  <div class="empty" id="empty" hidden>Ссылки на отзывы ещё не настроены</div>
</main>
<script>
'use strict';
var slug = location.pathname.split('/').pop();
function escape(text) {
  return String(text == null ? '' : text).replace(/[&<>"']/g, function (ch) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch];
  });
}
fetch('/public/review/' + encodeURIComponent(slug))
  .then(function (r) { if (!r.ok) throw new Error(); return r.json(); })
  .then(function (data) {
    if (data.color) document.documentElement.style.setProperty('--brand', data.color);
    if (data.name) {
      document.getElementById('name').textContent = 'Спасибо, что заехали в «' + data.name + '»!';
      document.title = 'Отзыв — ' + data.name;
    }
    if (!data.links.length) { document.getElementById('empty').hidden = false; return; }
    document.getElementById('links').innerHTML = data.links.map(function (link, index) {
      return '<a class="go' + (index ? ' second' : '') + '" href="' + escape(link.url)
        + '" rel="noopener">' + escape(link.title) + '</a>';
    }).join('');
  })
  .catch(function () { document.getElementById('empty').hidden = false; });
</script>
</body>
</html>
