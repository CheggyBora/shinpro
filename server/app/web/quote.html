<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Цена работы</title>
<style>
/*
  Клиент подтверждает цену работы у партнёра — покраска, шины
  (решение владельца 13.11.2026). Без входа: ссылку получает только он.
*/
:root {
  --ink: #0f172a; --ink-soft: #475569; --line: #e2e8f0; --bg: #f1f5f9;
  --card: #ffffff; --brand: #2563eb; --ok: #047857; --ok-bg: #dcfce7;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ink: #e2e8f0; --ink-soft: #94a3b8; --line: #1e293b; --bg: #0b1220;
    --card: #111a2e; --ok: #4ade80; --ok-bg: #12301f;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  font-size: 17px; line-height: 1.45;
  padding: env(safe-area-inset-top) 16px calc(env(safe-area-inset-bottom) + 24px); }
main { max-width: 520px; margin: 0 auto; }
header { padding: 20px 0 12px; }
h1 { margin: 0; font-size: 22px; }
.sub { color: var(--ink-soft); font-size: 15px; margin-top: 2px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 16px;
  padding: 16px; margin-bottom: 12px; }
.price { font-size: 28px; font-weight: 700; margin-top: 6px; }
button { width: 100%; padding: 16px; font: inherit; font-size: 17px; font-weight: 600;
  border: 0; border-radius: 14px; margin-bottom: 10px; cursor: pointer; }
.yes { background: var(--brand); color: #fff; }
.call { background: var(--card); color: var(--ink); border: 1.5px solid var(--line); }
.no { background: none; color: var(--ink-soft); font-weight: 500; }
button:disabled { opacity: .55; }
.done { background: var(--ok-bg); color: var(--ok); border-radius: 14px; padding: 16px;
  font-weight: 600; text-align: center; }
.empty { text-align: center; color: var(--ink-soft); padding: 48px 0; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <header>
    <h1 id="shop">Цена работы</h1>
    <div class="sub">Подтвердите, и мы отдадим работу в дело</div>
  </header>
  <div id="body" hidden>
    <div class="card">
      <b id="title"></b>
      <div class="sub" id="note"></div>
      <div class="price" id="price"></div>
    </div>
    <div id="ask">
      <button type="button" class="yes" data-answer="yes">Да, делайте</button>
      <button type="button" class="call" data-answer="call">Позвоните мне</button>
      <button type="button" class="no" data-answer="no">Не надо</button>
    </div>
    <div class="done" id="done" hidden></div>
  </div>
  <div class="empty" id="empty" hidden>Ссылка устарела</div>
</main>
<script>
'use strict';
var token = location.pathname.split('/').pop();
var DONE = { yes: 'Спасибо! Отдаём в работу.', no: 'Поняли, не делаем.',
             call: 'Скоро позвоним.' };
function $(id) { return document.getElementById(id); }
function money(value) {
  return String(Math.round(value || 0)).replace(/\B(?=(\d{3})+(?!\d))/g, ' ') + ' ₽';
}
function draw(data) {
  $('shop').textContent = data.shop || 'Цена работы';
  $('title').textContent = data.title;
  $('note').textContent = data.note || '';
  $('price').textContent = money(data.price);
  $('body').hidden = false;
  var answered = data.state && data.state !== 'pending';
  $('ask').hidden = answered;
  $('done').hidden = !answered;
  if (answered) $('done').textContent = DONE[data.state] || 'Ответ получен';
}
fetch('/public/quote/' + encodeURIComponent(token))
  .then(function (r) { if (!r.ok) throw new Error(); return r.json(); })
  .then(draw).catch(function () { $('empty').hidden = false; });
[].slice.call(document.querySelectorAll('[data-answer]')).forEach(function (button) {
  button.addEventListener('click', function () {
    [].slice.call(document.querySelectorAll('[data-answer]')).forEach(function (b) { b.disabled = true; });
    fetch('/public/quote/' + encodeURIComponent(token), {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ answer: button.getAttribute('data-answer') })
    }).then(function (r) { return r.json(); }).then(draw)
      .catch(function () { [].slice.call(document.querySelectorAll('[data-answer]'))
        .forEach(function (b) { b.disabled = false; }); });
  });
});
</script>
</body>
</html>
