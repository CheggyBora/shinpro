# Адреса организаций: koleso.ДОМЕН (запись), koleso-admin.ДОМЕН (дашборд)
# и свои домены организаций (zapis.koleso.ru). Слова ДОМЕН_РЕГ заменяет
# update.sh — это домен сервера с экранированными точками.
#
# Свои lk. и admin. живут в tire-server и сюда не попадают: точное имя
# у nginx главнее шаблона.
#
# Сертификат у каждого адреса свой: его выпускает tire-domains
# (deploy/domains.sh) и для каждого адреса с сертификатом пишет
# короткий блок https в /etc/nginx/tire/sites/ — с путём к сертификату и
# общим набором правил из nginx-orgs-lk.inc или nginx-orgs-admin.inc.
# Брать сертификат по имени ($ssl_server_name) нельзя: тогда ключи
# читал бы рабочий процесс nginx, а им ключи недоступны и не должны.
#
# Свои домены перечислены в /etc/nginx/tire/*-names.conf — их пишет
# tire-domains из базы. Шаблон дашборда идёт ПЕРВЫМ: регулярные имена
# nginx проверяет по порядку, а под шаблон записи подходит и «-admin».

# ----------------------------------------------------------------------
# http: только подтверждение для сертификата и переход на https
# ----------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name ~^[a-z0-9-]+-admin\.ДОМЕН_РЕГ$;
    include /etc/nginx/tire/admin-names.conf;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/tire-acme;
    }

    location / {
        if (-f /etc/letsencrypt/live/$host/fullchain.pem) {
            return 301 https://$host$request_uri;
        }
        default_type text/plain;
        return 503 "Адрес подключается. Загляните через несколько минут.\n";
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name ~^[a-z0-9-]+\.ДОМЕН_РЕГ$;
    include /etc/nginx/tire/lk-names.conf;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/tire-acme;
    }

    location / {
        if (-f /etc/letsencrypt/live/$host/fullchain.pem) {
            return 301 https://$host$request_uri;
        }
        default_type text/plain;
        return 503 "Адрес подключается. Загляните через несколько минут.\n";
    }
}

# ----------------------------------------------------------------------
# https: по блоку на адрес, их пишет tire-domains
# ----------------------------------------------------------------------
include /etc/nginx/tire/sites/*.conf;
