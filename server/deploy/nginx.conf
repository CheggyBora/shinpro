# Сервер шиномонтажа: кабинет клиента и дашборд владельца.
# Слова ДОМЕН_ЛК и ДОМЕН_АДМИН заменяет install.sh.
#
# Два адреса, одна программа. Разделены они не ради безопасности —
# доступ везде по токену, — а чтобы адрес дашборда не светился
# клиентам и чтобы оба открывались с корня, без хвостов в адресе:
#
#     lk.домен.ру     → кабинет клиента
#     admin.домен.ру  → дашборд владельца
#
# На том же сервере может работать чужой сайт на основном домене.
# nginx разводит их по имени из запроса: эти два блока отвечают только
# на свои имена и ничего чужого не трогают.
#
# **Здесь только HTTP, и это намеренно.** Блоки для HTTPS дописывает
# certbot. Прописать 443 заранее нельзя — пока сертификата нет, nginx с
# таким файлом не запустится вовсе, а сертификат не выпустить, пока
# nginx не отвечает по 80 порту.
#
# **Имена зон с приставкой tire_.** У соседнего сайта может быть своя
# зона с тем же именем, а две одинаковых nginx не примет — и упадёт всё
# сразу, вместе с чужим сайтом.

# Считаем запросы кодов отдельно: SMS платные, и десять запросов в
# минуту с одного адреса — это уже не человек
limit_req_zone $binary_remote_addr zone=tire_codes:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=tire_common:10m rate=120r/m;

# ----------------------------------------------------------------------
# Кабинет клиента
# ----------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name ДОМЕН_ЛК;

    # Страница записи открывается с телефона клиента и не должна
    # попадать в поиск: это не витрина, витрина — сайт на основном домене
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "same-origin" always;

    client_max_body_size 10m;
    proxy_read_timeout 60s;
    proxy_connect_timeout 10s;

    # С корня — сразу кабинет, без /z в адресе. Адрес в строке
    # браузера при этом остаётся коротким: подменяем путь у себя, а не
    # перенаправляем человека
    location = / {
        limit_req zone=tire_common burst=40 nodelay;
        proxy_pass http://127.0.0.1:8000/z;
        include /etc/nginx/proxy_params;
    }

    location /auth/code {
        limit_req zone=tire_codes burst=3 nodelay;
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/proxy_params;
    }

    # Дашборда здесь нет. Доступ к нему всё равно по токену, но знать
    # его адрес клиенту незачем — пусть и не находит случайно
    location = /d { return 404; }
    location /staff/ { return 404; }
    location /dashboard/ { return 404; }

    location / {
        limit_req zone=tire_common burst=40 nodelay;
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/proxy_params;
    }

    # Описание запросов наружу не нужно: это внутренняя кухня
    location /docs { return 404; }
    location /redoc { return 404; }
    location /openapi.json { return 404; }

    access_log /var/log/nginx/tire-lk-access.log;
    error_log /var/log/nginx/tire-lk-error.log;
}

# ----------------------------------------------------------------------
# Дашборд владельца и обмен с цехом
# ----------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name ДОМЕН_АДМИН;

    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "same-origin" always;

    client_max_body_size 10m;

    # Обмен с цехом идёт раз в десять минут и может занять время:
    # даём ему минуту, прежде чем рвать соединение
    proxy_read_timeout 60s;
    proxy_connect_timeout 10s;

    location = / {
        limit_req zone=tire_common burst=40 nodelay;
        proxy_pass http://127.0.0.1:8000/d;
        include /etc/nginx/proxy_params;
    }

    location /staff/code {
        limit_req zone=tire_codes burst=3 nodelay;
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/proxy_params;
    }

    # Обмен с цехом под ограничение скорости не ставим: программа ходит
    # часто и по делу, а без обмена цех теряет данные
    location /sync/ {
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/proxy_params;
    }

    # Кабинет клиента живёт на своём адресе
    location /z { return 404; }

    location / {
        limit_req zone=tire_common burst=40 nodelay;
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/proxy_params;
    }

    location /docs { return 404; }
    location /redoc { return 404; }
    location /openapi.json { return 404; }

    access_log /var/log/nginx/tire-admin-access.log;
    error_log /var/log/nginx/tire-admin-error.log;
}
