# Сервер шиномонтажа. Слово ДОМЕН заменяет install.sh.
#
# nginx стоит впереди и делает три вещи: держит HTTPS, не даёт завалить
# сервер запросами кодов и отдаёт всё остальное приложению.

# Считаем запросы кодов отдельно: SMS платные, и десять запросов в
# минуту с одного адреса — это уже не человек
limit_req_zone $binary_remote_addr zone=codes:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=common:10m rate=120r/m;

server {
    listen 80;
    listen [::]:80;
    server_name ДОМЕН;

    # certbot допишет сюда перенаправление на HTTPS, когда выпустит
    # сертификат. До этого страница доступна по http — иначе проверка
    # домена не пройдёт
    location / {
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/proxy_params;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ДОМЕН;

    # Сертификат подставит certbot
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Страница записи открывается с телефона клиента, дашборд — с
    # телефона владельца. Ни то, ни другое не должно попадать в поиск
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "same-origin" always;

    # Тело запроса большим не бывает: обмен шлёт наряды пачками, но это
    # текст. Десять мегабайт — с запасом
    client_max_body_size 10m;

    # Обмен с цехом идёт раз в десять минут и может занять время:
    # даём ему минуту, прежде чем рвать соединение
    proxy_read_timeout 60s;
    proxy_connect_timeout 10s;

    location /auth/code {
        limit_req zone=codes burst=3 nodelay;
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/proxy_params;
    }

    location /staff/code {
        limit_req zone=codes burst=3 nodelay;
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/proxy_params;
    }

    # Обмен с цехом под ограничение скорости не ставим: программа ходит
    # часто и по делу, а без обмена цех теряет данные
    location /sync/ {
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/proxy_params;
    }

    location / {
        limit_req zone=common burst=40 nodelay;
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/proxy_params;
    }

    # Описание запросов наружу не нужно: это внутренняя кухня
    location /docs { return 404; }
    location /redoc { return 404; }
    location /openapi.json { return 404; }

    access_log /var/log/nginx/tire-access.log;
    error_log /var/log/nginx/tire-error.log;
}
